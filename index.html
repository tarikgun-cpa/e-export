    // React Güvenli Lucide İkon Bileşeni (Tam Uyumlu)
    const Icon = ({ name, className = "w-5 h-5", size }) => {
      const iconRef = React.useRef(null);

      React.useEffect(() => {
        if (!iconRef.current || !window.lucide || !window.lucide.icons) return;
        
        const pascalName = name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
        const iconObj = window.lucide.icons[pascalName] || window.lucide.icons[name];
        
        if (iconObj) {
          const svgNode = window.lucide.createElement(iconObj);
          
          svgNode.setAttribute("class", className);
          if (size) {
            svgNode.setAttribute("width", size);
            svgNode.setAttribute("height", size);
          }
          
          iconRef.current.innerHTML = "";
          iconRef.current.appendChild(svgNode);
        }
      }, [name, className, size]);

      return <span ref={iconRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }} />;
    };

    const Building2 = (props) => <Icon name="building-2" className="w-6 h-6 text-blue-600" {...props} />;

    // =========================================================================

    const loadFromStorage = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (!item) return fallback;
        const parsed = JSON.parse(item);
        return Array.isArray(fallback) && !Array.isArray(parsed) ? fallback : parsed;

    const saveToStorage = (key, value) => {

      } catch (err) {}
    };

    const compressImage = (file, maxWidth = 400, maxHeight = 400, quality = 0.8) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/png', quality));
          };
          img.onerror = () => resolve('');
          img.src = e.target.result;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    };

    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
    };

    const formatDateTR = (dateStr) => {
      if (!dateStr) return '';
      const s = String(dateStr).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const [y, m, d] = s.split('-');
        return `${d}-${m}-${y}`;
      }
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(s)) {
        return s.replace(/\./g, '-');
      }
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
        return s.replace(/\//g, '-');
      }
      return s;
    };

    const PALLET_COLORS = [
      'bg-[#dbeafe]/80',
      'bg-[#e0e7ff]/80',
      'bg-[#e0f2fe]/80',
      'bg-[#fae8ff]/70',
      'bg-[#dcfce7]/75',
      'bg-[#f1f5f9]'
    ];

    const processTableRows = (items) => {
      if (!Array.isArray(items) || items.length === 0) return [];
      const renderInfo = [];
      let i = 0;
      let mergedGroupCounter = 0;
      const palletColorMap = {};

      while (i < items.length) {
        const item = items[i];
        if (!item) { i++; continue; }
        const currentPallet = String(item.paletNo || '').trim();
        if (currentPallet !== '') {
          let j = i + 1;
          while (j < items.length && items[j] && String(items[j].paletNo || '').trim() === currentPallet) { j++; }
          const span = j - i;
          const isMerged = span > 1;

          let groupColor = 'bg-white';
          if (isMerged) {
            if (!palletColorMap[currentPallet]) {
              palletColorMap[currentPallet] = PALLET_COLORS[mergedGroupCounter % PALLET_COLORS.length];
              mergedGroupCounter++;
            }
            groupColor = palletColorMap[currentPallet];
          }

          for (let k = i; k < j; k++) {
            if (items[k]) {
              renderInfo[k] = {
                item: items[k],
                originalIndex: k,
                isFirstInGroup: (k === i),
                rowSpan: (k === i) ? span : 0,
                groupColor: groupColor,
                isMerged: isMerged
              };
            }
          }
          i = j;
        } else {
          renderInfo[i] = { 
            item: item, 
            originalIndex: i, 
            isFirstInGroup: true, 
            rowSpan: 1, 
            groupColor: 'bg-white',
            isMerged: false 
          };
          i++;
        }
      }
      return renderInfo.filter(Boolean);
    };

    // Proforma, Invoice, A.TR ve TR e-Fatura için aynı ürünleri tek satırda toplar
    const groupItemsForInvoice = (items) => {
      if (!Array.isArray(items) || items.length === 0) return [];
      const parseNum = (val) => {
        if (typeof val === 'number') return isNaN(val) ? 0 : val;
        if (!val) return 0;
        let s = String(val).replace(/\s/g, '');
        if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
        else if (s.includes(',')) s = s.replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      };
      const cleanDwg = (str) => String(str || '').replace(/[-–—\s]+$/, '').trim().toUpperCase();
      const norm = (str) => String(str || '').trim().toUpperCase();

      const groupedMap = new Map();
      items.forEach((item) => {
        if (!item) return;
        const fiyatNum = parseNum(item.fiyat);
        const adetNum = parseNum(item.adet);
        const tutarNum = parseNum(item.tutar) || (adetNum * fiyatNum);
        const netKgNum = parseNum(item.netKg);

        const key = [
          norm(item.adsIsNo),
          norm(item.sipRefNo),
          norm(item.posNo),
          norm(item.parcaAdi),
          cleanDwg(item.resimNo),
          fiyatNum.toFixed(4)
        ].join('||');

        if (groupedMap.has(key)) {
          const existing = groupedMap.get(key);
          existing.adet = Number((existing.adet + adetNum).toFixed(4));
          existing.tutar = Number((existing.tutar + tutarNum).toFixed(2));
          existing.netKg = Number((existing.netKg + netKgNum).toFixed(2));
        } else {
          groupedMap.set(key, {
            ...item,
            adet: adetNum,
            fiyat: fiyatNum,
            tutar: Number(tutarNum.toFixed(2)),
            netKg: netKgNum
          });
        }
      });
      return Array.from(groupedMap.values());
    };

    const calculateTotals = (items, processedRows) => {
      let totalAdet = 0;
      let totalNetKg = 0;
      let totalBrutKg = 0;
      let totalTutar = 0;
      const uniquePallets = new Set();

      const parseNum = (val) => {
        if (typeof val === 'number') return isNaN(val) ? 0 : val;
        if (!val) return 0;
        let s = String(val).replace(/\s/g, '');
        if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
        else if (s.includes(',')) s = s.replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      };

      processedRows.forEach(row => {
        const item = row.item;
        const adet = parseNum(item.adet);
        const fiyat = parseNum(item.fiyat);
        const tutar = parseNum(item.tutar) || (adet * fiyat);
        const netKg = parseNum(item.netKg);

        totalAdet += adet;
        totalNetKg += netKg;
        totalTutar += tutar;

        const pNo = (item.paletNo || '').trim();
        if (pNo) uniquePallets.add(pNo);

        if (row.isFirstInGroup) {
          const brut = parseNum(item.brutKg);
          totalBrutKg += brut;
        }
      });

      return { totalAdet, totalNetKg, totalBrutKg, totalTutar, paletCount: uniquePallets.size };
    };

    const getSymbol = (curr) => {
       if(curr === 'EUR') return '€';
       if(curr === 'USD') return '$';
       if(curr === 'TRY') return '₺';
       if(curr === 'GBP') return '£';
       return curr;
    };

    const getAmountInWords = (amount, currencyCode) => {
        if (!amount) return "";
        const units = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
        const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
        const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
        
        const convertLess1000 = (n) => {
            if (n === 0) return "";
            let parts = [];
            if (n >= 100) { parts.push(units[Math.floor(n / 100)] + " Hundred"); n %= 100; }
            if (n >= 10 && n < 20) { parts.push(teens[n - 10]); }
            else if (n >= 20) {
              const t = tens[Math.floor(n / 10)];
              const u = n % 10 > 0 ? " " + units[n % 10] : "";
              parts.push(t + u);
            } else if (n > 0) { parts.push(units[n]); }
            return parts.join(" ");
        };
        
        let intPart = Math.floor(amount);
        let decPart = Math.round((amount - intPart) * 100);
        
        let wordParts = ["Only"];
        if (intPart >= 1000000) { wordParts.push(convertLess1000(Math.floor(intPart / 1000000)) + " Million"); intPart %= 1000000; }
        if (intPart >= 1000) { wordParts.push(convertLess1000(Math.floor(intPart / 1000)) + " Thousand"); intPart %= 1000; }
        if (intPart > 0) { wordParts.push(convertLess1000(intPart)); }
        if (wordParts.length === 1) wordParts.push("Zero");
        
        if (decPart > 0) {
            wordParts.push("and " + convertLess1000(decPart) + " Cents");
        }
        
        const currName = currencyCode === 'EUR' ? 'EURO' : currencyCode === 'USD' ? 'DOLLARS' : currencyCode;
        wordParts.push(currName);
        return wordParts.join(" ");
    };

    // =========================================================================
    // KULLANICI GİRİŞ EKRANI (SADECE YETKİLİ GİRİŞİ)
    // =========================================================================
    function AuthScreen() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [resetSent, setResetSent] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          await auth.signInWithEmailAndPassword(email.trim(), password);
        } catch (err) {
          let msg = "Giriş yapılırken bir hata oluştu.";
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
            msg = "E-posta adresi veya şifre hatalı!";
          } else {
            msg = err.message;
          }
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      const handleResetPassword = async () => {
        if (!email.trim()) {
          setError("Şifre sıfırlama bağlantısı için lütfen önce e-posta adresinizi yazın.");
          return;
        }
        try {
          await auth.sendPasswordResetEmail(email.trim());
          setResetSent(true);
          setError('');
        } catch (err) {
          setError("Şifre sıfırlama e-postası gönderilemedi: " + err.message);
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-700">
            <div className="bg-slate-950 p-6 text-center border-b border-slate-800">
              <div className="w-14 h-14 bg-blue-600/20 border border-blue-500/40 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <Building2 className="w-8 h-8 text-blue-400" />
              </div>
              <h1 className="text-xl font-black text-white tracking-wide">İHRACAT YÖNETİM SİSTEMİ</h1>
              <p className="text-xs text-slate-400 mt-1">Yetkili Kullanıcı Girişi</p>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              {error && (
                <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg text-xs font-semibold">
                  {error}
                </div>
              )}

              {resetSent && (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-lg text-xs font-semibold">
                  Şifre sıfırlama bağlantısı e-posta adresinize gönderildi!
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">E-POSTA ADRESİ</label>
                <div className="relative">
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    placeholder="ornek@firma.com"
                    className="w-full pl-3 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">ŞİFRE</label>
                <div className="relative">
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full pl-3 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div className="text-right">
                <button type="button" onClick={handleResetPassword} className="text-xs text-blue-600 hover:underline font-medium">
                  Şifremi Unuttum
                </button>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white py-3 rounded-lg font-bold text-sm transition-colors flex items-center justify-center shadow-lg"
              >
                {loading ? <Loader2 className="mr-2" /> : null}
                Sisteme Giriş Yap
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ExportManagementApp() {

      const [editingProforma, setEditingProforma] = useState(null);
      const [printingProforma, setPrintingProforma] = useState(null);

      const [isCreatingChecklist, setIsCreatingChecklist] = useState(false);
      const [editingChecklist, setEditingChecklist] = useState(null);

      const [printingExportSet, setPrintingExportSet] = useState(null);

      const [exporterModalOpen, setExporterModalOpen] = useState(false);
      const [editingExporter, setEditingExporter] = useState(null);

      // Firebase Auth Dinleyicisi
      useEffect(() => {
        if (!isFirebaseConfigured || !auth) {
          setAuthChecking(false);
          return;
        }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthChecking(false);
        });
        return () => unsubscribe();
      }, []);

      // Firestore Gerçek Zamanlı Bulut Dinleyicileri
      useEffect(() => {
        if (!isFirebaseConfigured || !user || !db) return;

        const unsubExp = getColRef('exporters').onSnapshot(snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setExporters(list);
          if (!selectedExporterId && list.length > 0) {
            setSelectedExporterId(list[0].id);
          }
        });

        const unsubCust = getColRef('customers').onSnapshot(snap => {
          setCustomers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubTrans = getColRef('transporters').onSnapshot(snap => {
          setTransporters(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubProf = getColRef('proformas').onSnapshot(snap => {
          setProformas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubChk = getColRef('checklists').onSnapshot(snap => {
          setChecklists(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => {
          unsubExp(); unsubCust(); unsubTrans(); unsubProf(); unsubChk();
        };
      }, [user]);

      // Eğer Firebase henüz ayarlanmadıysa yerel depolamaya kaydetmeye devam et
      useEffect(() => { if (!isFirebaseConfigured) saveToStorage(STORAGE_KEYS.EXPORTERS, exporters); }, [exporters]);
      useEffect(() => { if (!isFirebaseConfigured) saveToStorage(STORAGE_KEYS.CUSTOMERS, customers); }, [customers]);
      useEffect(() => { if (!isFirebaseConfigured) saveToStorage(STORAGE_KEYS.TRANSPORTERS, transporters); }, [transporters]);
      useEffect(() => { if (!isFirebaseConfigured) saveToStorage(STORAGE_KEYS.PROFORMAS, proformas); }, [proformas]);
      useEffect(() => { if (!isFirebaseConfigured) saveToStorage(STORAGE_KEYS.CHECKLISTS, checklists); }, [checklists]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.SELECTED_EXP, selectedExporterId); }, [selectedExporterId]);

      const selectedExporter = useMemo(() => exporters.find(e => e.id === selectedExporterId), [exporters, selectedExporterId]);
      const currentCustomers = useMemo(() => customers.filter(c => c.exporterId === selectedExporterId), [customers, selectedExporterId]);
      const currentTransporters = useMemo(() => transporters.filter(t => t.exporterId === selectedExporterId), [transporters, selectedExporterId]);
      const currentProformas = useMemo(() => proformas.filter(p => p.exporterId === selectedExporterId), [proformas, selectedExporterId]);
      const currentChecklists = useMemo(() => checklists.filter(c => c.exporterId === selectedExporterId), [checklists, selectedExporterId]);

      // Yerel Tarayıcı Verilerini Tek Tıkla Buluta Aktarma Fonksiyonu
      const handleMigrateLocalToCloud = async () => {
        if (!isFirebaseConfigured || !db) return;
        const localExp = loadFromStorage(STORAGE_KEYS.EXPORTERS, []);
        const localCust = loadFromStorage(STORAGE_KEYS.CUSTOMERS, []);
        const localTrans = loadFromStorage(STORAGE_KEYS.TRANSPORTERS, []);
        const localProf = loadFromStorage(STORAGE_KEYS.PROFORMAS, []);
        const localChk = loadFromStorage(STORAGE_KEYS.CHECKLISTS, []);

        if (localExp.length === 0 && localCust.length === 0 && localChk.length === 0 && localProf.length === 0) {
          alert("Tarayıcı hafızasında aktarılacak yerel veri bulunamadı.");
          return;
        }

        if (!window.confirm(`${localExp.length} İhracatçı, ${localCust.length} Müşteri, ${localTrans.length} Nakliyeci, ${localProf.length} Proforma ve ${localChk.length} Evrak buluta aktarılacak. Onaylıyor musunuz?`)) return;

        setIsMigrating(true);
        try {
          for (const item of localExp) {
            const id = item.id || generateId();
            await getColRef('exporters').doc(id).set({ ...item, id });
          }
          for (const item of localCust) {
            const id = item.id || generateId();
            await getColRef('customers').doc(id).set({ ...item, id });
          }
          for (const item of localTrans) {
            const id = item.id || generateId();
            await getColRef('transporters').doc(id).set({ ...item, id });
          }
          for (const item of localProf) {
            const id = item.id || generateId();
            await getColRef('proformas').doc(id).set({ ...item, id });
          }
          for (const item of localChk) {
            const id = item.id || generateId();
            await getColRef('checklists').doc(id).set({ ...item, id });
          }
          alert("Tüm yerel verileriniz başarıyla Firebase Bulut veritabanına aktarıldı!");
        } catch (err) {
          alert("Aktarım sırasında hata oluştu: " + err.message);
        } finally {
          setIsMigrating(false);
        }
      };

      const handleSaveExporter = async (exporterData) => {
        const id = exporterData.id || generateId();
        const payload = { ...exporterData, id, createdAt: exporterData.createdAt || new Date().toISOString() };

        if (isFirebaseConfigured && db) {
          await getColRef('exporters').doc(id).set(payload);
          if (!selectedExporterId) setSelectedExporterId(id);
        } else {
          if (exporterData.id) {
            setExporters(exporters.map(e => e.id === exporterData.id ? payload : e));
          } else {
            setExporters([...exporters, payload]);
            if (!selectedExporterId) setSelectedExporterId(id);
          }
        }
        setExporterModalOpen(false);
        setEditingExporter(null);
      };

      const handleDeleteExporter = async (id) => {
        if (customers.some(c => c.exporterId === id) || transporters.some(t => t.exporterId === id) || proformas.some(p => p.exporterId === id) || checklists.some(ch => ch.exporterId === id)) {
          alert("Bu İhracatçıya ait tanımlı Müşteri, Nakliyeci, Proforma veya Çeklist/Evrak kaydı bulunmaktadır!");
          return;
        }
        if (!window.confirm("Bu İhracatçı kartını silmek istediğinizden emin misiniz?")) return;
        if (isFirebaseConfigured && db) {
          await getColRef('exporters').doc(id).delete();
        } else {
          setExporters(exporters.filter(e => e.id !== id));
        }
        if (selectedExporterId === id) setSelectedExporterId(null);
      };

      const handleSaveProforma = async (proformaData) => {
        const id = editingProforma?.id || generateId();
        const payload = { ...proformaData, id };

        if (isFirebaseConfigured && db) {
          await getColRef('proformas').doc(id).set(payload);
        } else {
          if (editingProforma?.id) {
            setProformas(proformas.map(p => p.id === editingProforma.id ? payload : p));
          } else {
            setProformas([...proformas, payload]);
          }
        }
        setIsCreatingProforma(false);
        setEditingProforma(null);
      };

      // Proforma Faturayı Tek Tıkla Check List / Evrak Formuna Aktarma
      const handleConvertProformaToChecklist = (proforma) => {
        const draftChecklist = {
          exporterId: proforma.exporterId,
          invoiceNumber: proforma.proformaNumber.replace(/^PI-|^PRO-/i, 'INV-'),
          checklistDate: new Date().toISOString().split('T')[0],
          deliveryDate: proforma.deliveryDate || '',
          customerId: proforma.customerId,
          transporterId: '',
          currency: proforma.currency || 'EUR',
          deliveryAddress: proforma.deliveryAddress || '',
          selectedBankId: proforma.selectedBankId || '',
          selectedInsuranceId: '',
          hasDownPayment: true,
          downPaymentRate: proforma.advanceRate ?? 30,
          isFreeOfCharge: false,
          items: (proforma.items || []).map(item => ({
            ...item,
            id: generateId(),
            brutKg: item.brutKg || '',
            paletNo: item.paletNo || '',
            paletEbatlari: item.paletEbatlari || ''
          }))
        };
        setActiveTab('checklists');
        setEditingChecklist(draftChecklist);
        setIsCreatingChecklist(true);
      };

      const handleSaveChecklist = async (checklistData) => {
        const id = editingChecklist?.id || generateId();
        const payload = { ...checklistData, id };

        if (isFirebaseConfigured && db) {
          await getColRef('checklists').doc(id).set(payload);
        } else {
          if (editingChecklist?.id) {
            setChecklists(checklists.map(c => c.id === editingChecklist.id ? payload : c));
          } else {
            setChecklists([...checklists, payload]);
          }
        }
        setIsCreatingChecklist(false);
        setEditingChecklist(null);
      };

      if (authChecking) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center text-white">
            <Loader2 className="w-8 h-8 animate-spin text-blue-400 mr-3" />
            <span className="font-bold">Bulut Bağlantısı Kontrol Ediliyor...</span>
          </div>
        );
      }

      if (isFirebaseConfigured && !user) {
        return <AuthScreen />;
      }

      const anyPrintModalOpen = Boolean(printingChecklist || printingExportSet || printingProforma);

      return (
        <div className="flex h-screen bg-slate-100 font-sans overflow-hidden">
          <div className="no-print h-full">
            <Sidebar 
              exporters={exporters} 
              selectedId={selectedExporterId} 
              onSelect={(id) => {
                setSelectedExporterId(id);
                setIsCreatingChecklist(false);
                setEditingChecklist(null);
                setIsCreatingProforma(false);
                setEditingProforma(null);
              }}
              onOpenAdd={() => { setEditingExporter(null); setExporterModalOpen(true); }}
              onOpenEdit={(exp) => { setEditingExporter(exp); setExporterModalOpen(true); }}
              onDelete={handleDeleteExporter}
              user={user}
              onMigrate={handleMigrateLocalToCloud}
              isMigrating={isMigrating}
            />
          </div>

          <div className={`flex-1 flex flex-col overflow-hidden ${anyPrintModalOpen ? 'no-print' : ''}`}>
            {!isFirebaseConfigured && (
              <div className="no-print bg-amber-500 text-slate-950 px-4 py-1.5 text-xs font-bold flex items-center justify-between">
                <span>⚠️ Şu an Yerel Modda çalışıyorsunuz. Bulut senkronizasyonu ve şifreli giriş için kodun içindeki FIREBASE_CONFIG alanına kendi Firebase anahtarlarınızı yapıştırın.</span>
              </div>
            )}
            {selectedExporter ? (
              (isCreatingProforma || editingProforma) ? (
                <ProformaForm
                  exporter={selectedExporter}
                  customers={currentCustomers}
                  initialData={editingProforma}
                  onBack={() => { setIsCreatingProforma(false); setEditingProforma(null); }}
                  onSaveProforma={handleSaveProforma}
                />
              ) : (isCreatingChecklist || editingChecklist) ? (
                <ChecklistForm 
                  exporter={selectedExporter}
                  customers={currentCustomers}
                  transporters={currentTransporters}
                  initialData={editingChecklist}
                  onBack={() => { setIsCreatingChecklist(false); setEditingChecklist(null); }}
                  onSaveChecklist={handleSaveChecklist}
                />
              ) : (
                <div className="flex-1 flex flex-col h-full overflow-hidden">
                  <header className="no-print bg-white border-b border-gray-200 px-6 py-4 shadow-sm z-10 flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl font-bold text-slate-800 flex items-center">
                        <Building2 className="w-6 h-6 mr-3 text-blue-600" />
                        {selectedExporter.name} Yönetimi
                      </h1>
                      <div className="text-xs text-slate-500 mt-1 flex gap-4">
                        <span><strong>VAT:</strong> {selectedExporter.vatNo || '-'}</span>
                        <span><strong>DUNS:</strong> {selectedExporter.dunsNumber || '-'}</span>
                        <span><strong>EORI:</strong> {selectedExporter.eoriNumber || '-'}</span>
                        <span><strong>Yetkili:</strong> {selectedExporter.contactPerson || '-'} ({selectedExporter.email || '-'})</span>
                      </div>
                      
                      <div className="flex mt-4 space-x-1 border-b border-gray-200">
                        <TabButton active={activeTab === 'customers'} onClick={() => setActiveTab('customers')} icon={<Users />} label="Müşteriler" />
                        <TabButton active={activeTab === 'transporters'} onClick={() => setActiveTab('transporters')} icon={<Truck />} label="Nakliyeciler" />
                        <TabButton active={activeTab === 'proformas'} onClick={() => setActiveTab('proformas')} icon={<FileText className="w-5 h-5 text-rose-600" />} label="Proforma Fatura (Sipariş/Avans)" />
                        <TabButton active={activeTab === 'checklists'} onClick={() => setActiveTab('checklists')} icon={<FileSpreadsheet />} label="Check List / Evrak" />
                      </div>
                    </div>

                    <button type="button" onClick={() => { setEditingExporter(selectedExporter); setExporterModalOpen(true); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center border">
                      <Edit size={14} className="mr-1" /> İhracatçı Kartını Düzenle
                    </button>
                  </header>

                  <main className="flex-1 overflow-auto p-6 bg-slate-50">
                    {activeTab === 'customers' && (
                      <CustomerManager 
                        exporterId={selectedExporterId} 
                        data={currentCustomers} 
                        onSave={async (cust) => {
                          const id = cust.id || generateId();
                          const payload = { ...cust, id, exporterId: selectedExporterId };
                          if (isFirebaseConfigured && db) {
                            await getColRef('customers').doc(id).set(payload);
                          } else {
                            if (cust.id) setCustomers(customers.map(c => c.id === cust.id ? payload : c));
                            else setCustomers([...customers, payload]);
                          }
                        }}
                        onDelete={async (id) => {
                          if (checklists.some(ch => ch.customerId === id) || proformas.some(p => p.customerId === id)) {
                            alert("Bu müşteriye ait kayıtlı Check List / Evrak veya Proforma Fatura bulunduğu için silinemez!");
                            return;
                          }
                          if (!window.confirm("Bu müşteriyi silmek istediğinizden emin misiniz?")) return;
                          if (isFirebaseConfigured && db) await getColRef('customers').doc(id).delete();
                          else setCustomers(customers.filter(c => c.id !== id));
                        }}
                      />
                    )}
                    {activeTab === 'transporters' && (
                      <TransporterManager 
                        exporterId={selectedExporterId} 
                        data={currentTransporters} 
                        onSave={async (trans) => {
                          const id = trans.id || generateId();
                          const payload = { ...trans, id, exporterId: selectedExporterId };
                          if (isFirebaseConfigured && db) {
                            await getColRef('transporters').doc(id).set(payload);
                          } else {
                            if (trans.id) setTransporters(transporters.map(t => t.id === trans.id ? payload : t));
                            else setTransporters([...transporters, payload]);
                          }
                        }}
                        onDelete={async (id) => {
                          if (checklists.some(ch => ch.transporterId === id)) {
                            alert("Bu nakliyeciye ait kayıtlı Check List / Evrak bulunduğu için silinemez!");
                            return;
                          }
                          if (!window.confirm("Bu nakliyeciyi silmek istediğinizden emin misiniz?")) return;
                          if (isFirebaseConfigured && db) await getColRef('transporters').doc(id).delete();
                          else setTransporters(transporters.filter(t => t.id !== id));
                        }}
                      />
                    )}
                    {activeTab === 'proformas' && (
                      <ProformaManager
                        data={currentProformas}
                        customers={currentCustomers}
                        onCreateNew={() => setIsCreatingProforma(true)}
                        onEdit={(prof) => setEditingProforma(prof)}
                        onPrint={(prof) => setPrintingProforma(prof)}
                        onConvertToChecklist={handleConvertProformaToChecklist}
                        onDelete={async (id) => {
                          if (!window.confirm("Bu Proforma Faturayı silmek istediğinizden emin misiniz?")) return;
                          if (isFirebaseConfigured && db) await getColRef('proformas').doc(id).delete();
                          else setProformas(proformas.filter(p => p.id !== id));
                        }}
                      />
                    )}
                    {activeTab === 'checklists' && (
                      <ChecklistManager 
                        data={currentChecklists} 
                        customers={currentCustomers}
                        transporters={currentTransporters}
                        onCreateNew={() => setIsCreatingChecklist(true)} 
                        onEdit={(checklist) => setEditingChecklist(checklist)}
                        onPrint={(checklist) => setPrintingChecklist(checklist)}
                        onCreateExportSet={(checklist) => setPrintingExportSet(checklist)}
                        onDelete={async (id) => {
                          if (!window.confirm("Bu evrakı silmek istediğinizden emin misiniz?")) return;
                          if (isFirebaseConfigured && db) await getColRef('checklists').doc(id).delete();
                          else setChecklists(checklists.filter(c => c.id !== id));
                        }}
                      />
                    )}
                  </main>
                </div>
              )
            ) : (
              <div className="flex-1 flex items-center justify-center bg-slate-50 no-print">
                <div className="text-center">
                  <Building2 className="w-16 h-16 text-slate-300 mx-auto mb-4" />
                  <h2 className="text-xl font-medium text-slate-600">İşlem yapmak için sol menüden bir ihracatçı seçin</h2>
                  <p className="text-slate-400 mt-2">Veya yeni bir ihracatçı kartı oluşturun.</p>
                </div>
              </div>
            )}
          </div>

          {exporterModalOpen && <ExporterModal initialData={editingExporter} onClose={() => { setExporterModalOpen(false); setEditingExporter(null); }} onSave={handleSaveExporter} />}

          {printingProforma && <ProformaPrintModal proforma={printingProforma} exporter={selectedExporter} customer={customers.find(c => c.id === printingProforma.customerId)} onClose={() => setPrintingProforma(null)} />}

          {printingChecklist && <PrintModal checklist={printingChecklist} exporter={selectedExporter} customer={customers.find(c => c.id === printingChecklist.customerId)} transporter={transporters.find(t => t.id === printingChecklist.transporterId)} onClose={() => setPrintingChecklist(null)} />}
          
          {printingExportSet && <ExportSetPrintModal checklist={printingExportSet} exporter={selectedExporter} customer={customers.find(c => c.id === printingExportSet.customerId)} transporter={transporters.find(t => t.id === printingExportSet.transporterId)} onClose={() => setPrintingExportSet(null)} />}
        </div>
      );
    }

    function Sidebar({ exporters, selectedId, onSelect, onOpenAdd, onOpenEdit, onDelete, user, onMigrate, isMigrating }) {
      return (
        <div className="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 h-full">
          <div className="p-4 bg-slate-950 flex justify-between items-center border-b border-slate-800">
            <div className="flex items-center">
              <img 
                src="Logo.jpg" 
                alt="Logo" 
                className="h-10 max-w-[155px] object-contain"
                onError={(e) => { e.currentTarget.src = 'ico.ico'; }}
              />
            </div>
            {user && (
              <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shrink-0">
                <Cloud size={11} /> Bulut Aktif
              </span>
            )}
          </div>
          <div className="flex-1 overflow-y-auto py-2">
            {exporters.map(exp => (
              <div key={exp.id} className={`w-full group flex items-center justify-between px-4 py-3 transition-colors cursor-pointer ${selectedId === exp.id ? 'bg-blue-600 text-white border-l-4 border-blue-400' : 'hover:bg-slate-800 border-l-4 border-transparent'}`} onClick={() => onSelect(exp.id)}>
                <div className="flex items-center gap-2 truncate flex-1">
                  {exp.logo && <img src={exp.logo} className="w-6 h-6 object-contain rounded bg-white p-0.5" />}
                  <span className="font-medium truncate">{exp.name}</span>
                </div>
                <div className="flex items-center gap-1">
                  <button type="button" onClick={(e) => { e.stopPropagation(); onOpenEdit(exp); }} className="opacity-0 group-hover:opacity-100 p-1 hover:text-blue-200 transition-opacity" title="Düzenle"><Edit size={14} /></button>
                  <button type="button" onClick={(e) => { e.stopPropagation(); onDelete(exp.id); }} className="opacity-0 group-hover:opacity-100 p-1 hover:text-red-300 transition-opacity" title="Sil"><Trash2 size={14} /></button>
                  {selectedId === exp.id && <ChevronRight size={16} />}
                </div>
              </div>
            ))}
            {exporters.length === 0 && <div className="px-5 py-4 text-sm text-slate-500 italic">Henüz ihracatçı bulunmuyor.</div>}
          </div>
          <div className="p-4 bg-slate-800 border-t border-slate-700 space-y-2">
            <button type="button" onClick={onOpenAdd} className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm transition-colors">
              <Plus size={18} /> Yeni İhracatçı Kartı
            </button>

            {user && (
              <>
                <button
                  type="button"
                  disabled={isMigrating}
                  onClick={onMigrate}
                  className="w-full flex items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-amber-300 py-2 rounded-lg font-semibold text-xs transition-colors border border-slate-600"
                  title="Bu tarayıcıdaki eski verileri buluta kopyalar"
                >
                  <Upload size={14} /> {isMigrating ? 'Aktarılıyor...' : 'Yerel Verileri Buluta Aktar'}
                </button>

                <div className="pt-2 border-t border-slate-700 flex items-center justify-between text-xs">
                  <span className="truncate text-slate-400 max-w-[165px]" title={user.email}>{user.email}</span>
                  <button
                    type="button"
                    onClick={() => auth.signOut()}
                    className="text-red-400 hover:text-red-300 font-bold flex items-center gap-1 px-2 py-1 rounded hover:bg-slate-700"
                  >
                    <LogOut size={14} /> Çıkış
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function ExporterModal({ initialData, onClose, onSave }) {
      const [name, setName] = useState(initialData?.name || '');
      const [address, setAddress] = useState(initialData?.address || '');
      const [phone, setPhone] = useState(initialData?.phone || '');
      const [fax, setFax] = useState(initialData?.fax || '');
      const [vatNo, setVatNo] = useState(initialData?.vatNo || '');
      const [dunsNumber, setDunsNumber] = useState(initialData?.dunsNumber || '');
      const [eoriNumber, setEoriNumber] = useState(initialData?.eoriNumber || '');
      const [contactPerson, setContactPerson] = useState(initialData?.contactPerson || '');
      const [email, setEmail] = useState(initialData?.email || '');
      const [logo, setLogo] = useState(initialData?.logo || '');
      const [stamp, setStamp] = useState(initialData?.stamp || '');

      const [insurances, setInsurances] = useState(initialData?.insurances || []);
      const [banks, setBanks] = useState(initialData?.banks || []);

      const handleLogoChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          setLogo(compressed);
        }
      };

      const handleStampChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          setStamp(compressed);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({ 
          id: initialData?.id, name: name.trim(), address: address.trim(), phone: phone.trim(), fax: fax.trim(), 
          vatNo: vatNo.trim(), dunsNumber: dunsNumber.trim(), eoriNumber: eoriNumber.trim(), contactPerson: contactPerson.trim(), 
          email: email.trim(), logo, stamp,
          insurances, banks
        });
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-start justify-center p-4 overflow-y-auto pt-10 pb-10">
          <div className="bg-white rounded-xl shadow-2xl max-w-4xl w-full p-6 relative">
            <div className="flex justify-between items-center border-b pb-3 mb-4 sticky top-0 bg-white z-10">

              <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={20} /></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-6">
              
              {/* Firma Genel Bilgileri */}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="md:col-span-2">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">UNVAN / FİRMA ADI *</label>
                    <input type="text" required className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={name} onChange={e => setName(e.target.value)} />
                  </div>
                  <div className="md:col-span-2">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">ADRES</label>

                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">TELEFON</label>
                    <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={phone} onChange={e => setPhone(e.target.value)} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">FAX</label>

                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">DUNS NUMBER</label>
                    <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={dunsNumber} onChange={e => setDunsNumber(e.target.value)} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">EORI NUMBER</label>

                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">YETKİLİ KİŞİ</label>

                  <div className="md:col-span-2">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">MAIL ADRESİ</label>

                  <div className="md:col-span-1">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">FİRMA LOGOSU</label>

                      <div className="relative border p-1 rounded bg-white mt-2 inline-block">
                        <img src={logo} alt="Logo" className="h-10 object-contain" />
                        <button type="button" onClick={() => setLogo('')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5"><X size={12} /></button>
                      </div>
                    )}
                  </div>

                  <div className="md:col-span-1">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">KAŞE / İMZA GÖRSELİ</label>
                    <input type="file" accept="image/*" onChange={handleStampChange} className="text-xs text-slate-500" />
                    {stamp && (
                      <div className="relative border p-1 rounded bg-white mt-2 inline-block">
                        <img src={stamp} alt="Stamp" className="h-10 object-contain" />
                        <button type="button" onClick={() => setStamp('')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5"><X size={12} /></button>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Sigorta Acenteleri */}
              <div>
                <div className="flex justify-between items-center mb-3 border-b pb-1">
                  <h4 className="text-sm font-bold text-blue-800">SİGORTA ŞİRKETİ / ACENTE BİLGİLERİ</h4>
                  <button type="button" onClick={() => setInsurances([...insurances, { id: generateId(), agencyName: '', phone: '', email: '', address: '' }])} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded flex items-center font-bold">
                    <Plus size={14} className="mr-1" /> Yeni Acente Ekle
                  </button>
                </div>
                
                {insurances.length === 0 && <div className="text-sm text-slate-500 italic">Sigorta acentesi eklenmemiş.</div>}
                
                {insurances.map((ins) => (
                  <div key={ins.id} className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3 bg-slate-50 p-3 rounded border relative">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">ACENTA ADI</label>
                      <input type="text" value={ins.agencyName} onChange={e => setInsurances(insurances.map(item => item.id === ins.id ? { ...item, agencyName: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">TELEFON</label>
                      <input type="text" value={ins.phone} onChange={e => setInsurances(insurances.map(item => item.id === ins.id ? { ...item, phone: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">MAIL ADRESİ</label>
                      <input type="text" value={ins.email} onChange={e => setInsurances(insurances.map(item => item.id === ins.id ? { ...item, email: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">ADRES</label>
                      <input type="text" value={ins.address} onChange={e => setInsurances(insurances.map(item => item.id === ins.id ? { ...item, address: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                    </div>
                    <button type="button" onClick={() => setInsurances(insurances.filter(item => item.id !== ins.id))} className="absolute top-2 right-2 text-red-500 p-1 hover:bg-red-50 rounded"><Trash2 size={16} /></button>
                  </div>
                ))}
              </div>

              {/* Banka Hesapları */}
              <div>
                <div className="flex justify-between items-center mb-3 border-b pb-1">
                  <h4 className="text-sm font-bold text-blue-800">BANKA HESAPLARI</h4>
                  <button type="button" onClick={() => setBanks([...banks, { id: generateId(), currency: 'EUR', bankName: '', swift: '', iban: '' }])} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded flex items-center font-bold">
                    <Plus size={14} className="mr-1" /> Yeni Banka Ekle
                  </button>
                </div>
                
                {banks.length === 0 && <div className="text-sm text-slate-500 italic">Banka hesabı eklenmemiş.</div>}
                
                {banks.map((b) => (
                  <div key={b.id} className="flex gap-2 mb-3 items-center flex-wrap md:flex-nowrap bg-slate-50 p-2 rounded border">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">DÖVİZ</label>
                      <select value={b.currency} onChange={e => setBanks(banks.map(item => item.id === b.id ? { ...item, currency: e.target.value } : item))} className="px-2 py-1.5 border rounded text-sm w-20 outline-none">
                        <option value="EUR">EUR</option><option value="USD">USD</option><option value="TRY">TRY</option><option value="GBP">GBP</option>
                      </select>
                    </div>
                    <div className="flex-1 min-w-[120px]">
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">BANKA ADI</label>
                      <input type="text" value={b.bankName} onChange={e => setBanks(banks.map(item => item.id === b.id ? { ...item, bankName: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" placeholder="Banka Adı" />
                    </div>
                    <div className="w-32">
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">SWIFT</label>
                      <input type="text" value={b.swift} onChange={e => setBanks(banks.map(item => item.id === b.id ? { ...item, swift: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" placeholder="SWIFT Kodu" />
                    </div>
                    <div className="flex-[2] min-w-[200px]">
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">HESAP NO / IBAN</label>
                      <input type="text" value={b.iban} onChange={e => setBanks(banks.map(item => item.id === b.id ? { ...item, iban: e.target.value } : item))} className="w-full px-3 py-1.5 border rounded text-sm outline-none" placeholder="TR..." />
                    </div>
                    <div className="pt-4">
                      <button type="button" onClick={() => setBanks(banks.filter(item => item.id !== b.id))} className="text-red-500 p-2 hover:bg-red-50 rounded"><Trash2 size={18} /></button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex justify-end gap-2 border-t pt-4 sticky bottom-0 bg-white z-10 pb-2">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">İptal</button>
                <button type="submit" className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold flex items-center"><Save size={16} className="mr-1.5" /> Kaydet</button>
              </div>
            </form>
          </div>
        </div>
      );
    }
    function TabButton({ active, onClick, icon, label }) {
      return (
        <button type="button" onClick={onClick} className={`flex items-center px-6 py-3 font-medium text-sm transition-colors border-b-2 ${active ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}>
          <span className="mr-2">{icon}</span>{label}
        </button>
      );
    }

    function CustomerManager({ exporterId, data, onSave, onDelete }) {
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [name, setName] = useState('');
      const [address, setAddress] = useState('');
      const [country, setCountry] = useState('');
      const [vatNo, setVatNo] = useState('');
      const [htsNo, setHtsNo] = useState('');
      const [logo, setLogo] = useState('');
      const [contacts, setContacts] = useState([{ id: generateId(), name: '', email: '', phone: '' }]);

      const resetForm = () => {
        setEditingId(null);
        setName(''); setAddress(''); setCountry(''); setVatNo(''); setHtsNo(''); setLogo('');
        setContacts([{ id: generateId(), name: '', email: '', phone: '' }]);
        setIsFormOpen(false);
      };

      const openNewForm = () => {
        setEditingId(null);
        setName(''); setAddress(''); setCountry(''); setVatNo(''); setHtsNo(''); setLogo('');
        setContacts([{ id: generateId(), name: '', email: '', phone: '' }]);
        setIsFormOpen(true);
      };

      const startEdit = (item) => {
        setEditingId(item.id);
        setName(item.name || ''); setAddress(item.address || ''); setCountry(item.country || '');
        setVatNo(item.vatNo || ''); setHtsNo(item.htsNo || ''); setLogo(item.logo || '');
        setContacts(item.contacts && item.contacts.length > 0 ? item.contacts.map(c => ({ phone: '', ...c })) : [{ id: generateId(), name: '', email: '', phone: '' }]);
        setIsFormOpen(true);
      };

      const handleLogoChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file);
          setLogo(compressed);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          id: editingId,
          exporterId,
          name: name.trim(),
          address: address.trim(),
          country: country.trim(),
          vatNo: vatNo.trim(),
          htsNo: htsNo.trim(),
          logo,
          contacts: contacts.filter(c => (c.name && c.name.trim()) || (c.email && c.email.trim()) || (c.phone && c.phone.trim()))
        });
        resetForm();
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-5 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
            <h3 className="text-lg font-semibold text-slate-800 flex items-center">
              <Users className="w-5 h-5 mr-2 text-blue-500" /> Müşteri Listesi
            </h3>
            <button
              type="button"
              onClick={openNewForm}
              className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center shadow-sm text-sm transition-colors"
            >
              <Plus size={18} className="mr-1.5" /> Yeni Müşteri Ekle
            </button>
          </div>

          {isFormOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-xl shadow-2xl max-w-3xl w-full p-6 relative">
                <div className="flex justify-between items-center border-b pb-3 mb-4">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center">
                    <Users className="w-5 h-5 mr-2 text-blue-500" />
                    {editingId ? 'Müşteri Kartını Düzenle' : 'Yeni Müşteri Ekle'}
                  </h3>
                  <button type="button" onClick={resetForm} className="text-slate-400 hover:text-slate-600">
                    <X size={20} />
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">FİRMA ADI *</label>
                      <input type="text" required className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={name} onChange={e => setName(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ÜLKE</label>
                      <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={country} onChange={e => setCountry(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">VAT NO</label>
                      <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={vatNo} onChange={e => setVatNo(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">HTS NO</label>
                      <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={htsNo} onChange={e => setHtsNo(e.target.value)} />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ADRES</label>
                      <input type="text" className="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={address} onChange={e => setAddress(e.target.value)} />
                    </div>
                  </div>
                  <div className="flex items-center gap-4 pt-1">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">FİRMA LOGO</label>
                      <input type="file" accept="image/*" onChange={handleLogoChange} className="text-xs text-slate-500" />
                    </div>
                    {logo && (
                      <div className="relative border p-1 rounded bg-white">
                        <img src={logo} alt="Müşteri Logo" className="h-10 object-contain" />
                        <button type="button" onClick={() => setLogo('')} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5"><X size={12} /></button>
                      </div>
                    )}
                  </div>
                  <div className="border-t pt-3">
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold text-slate-700">YETKİLİ KİŞİLER (Telefon No sadece Nakliye Talimatında görünür)</label>
                      <button type="button" onClick={() => setContacts([...contacts, { id: generateId(), name: '', email: '', phone: '' }])} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded flex items-center font-semibold"><Plus size={14} className="mr-1" /> Ekle</button>
                    </div>
                    <div className="max-h-40 overflow-y-auto pr-1">
                      {contacts.map((c) => (
                        <div key={c.id} className="flex gap-2 mb-2 items-center">
                          <input type="text" placeholder="Ad Soyad" className="flex-1 px-3 py-1.5 border rounded text-sm outline-none" value={c.name || ''} onChange={e => setContacts(contacts.map(item => item.id === c.id ? { ...item, name: e.target.value } : item))} />
                          <input type="email" placeholder="Mail" className="flex-1 px-3 py-1.5 border rounded text-sm outline-none" value={c.email || ''} onChange={e => setContacts(contacts.map(item => item.id === c.id ? { ...item, email: e.target.value } : item))} />
                          <input type="text" placeholder="Telefon No" className="w-40 px-3 py-1.5 border rounded text-sm outline-none" value={c.phone || ''} onChange={e => setContacts(contacts.map(item => item.id === c.id ? { ...item, phone: e.target.value } : item))} />
                          {contacts.length > 1 && <button type="button" onClick={() => setContacts(contacts.filter(item => item.id !== c.id))} className="text-red-500 p-1"><Trash2 size={16} /></button>}
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 border-t pt-4">
                    <button type="button" onClick={resetForm} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium">İptal</button>
                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-bold flex items-center"><Save size={16} className="mr-1.5" /> {editingId ? 'Güncelle' : 'Kaydet'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-sm">
                  <th className="p-3 font-semibold">Logo</th>
                  <th className="p-3 font-semibold">Firma Adı</th>
                  <th className="p-3 font-semibold">Ülke / VAT</th>
                  <th className="p-3 font-semibold">Yetkililer</th>
                  <th className="p-3 font-semibold w-24 text-center">İşlem</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 text-sm">
                {data.length > 0 ? data.map(item => (
                  <tr key={item.id} className="hover:bg-slate-50">
                    <td className="p-3">{item.logo ? <img src={item.logo} className="h-8 w-12 object-contain rounded border" /> : <span className="text-slate-400 text-xs">-</span>}</td>
                    <td className="p-3 font-medium text-slate-800">{item.name}<div className="text-xs text-slate-500">{item.address}</div></td>
                    <td className="p-3 text-slate-600">{item.country || '-'} / VAT: {item.vatNo || '-'}</td>
                    <td className="p-3 text-xs text-slate-600">{item.contacts?.map((c, i) => <div key={i}>{c.name} ({c.email})</div>)}</td>
                    <td className="p-3 text-center">
                      <button type="button" onClick={() => startEdit(item)} className="text-blue-600 p-1" title="Düzenle"><Edit size={16} /></button>
                      <button type="button" onClick={() => onDelete(item.id)} className="text-red-500 p-1" title="Sil"><Trash2 size={16} /></button>
                    </td>
                  </tr>
                )) : <tr><td colSpan={5} className="p-8 text-center text-slate-500">Müşteri kaydı bulunmuyor. Sağ üstten yeni müşteri ekleyebilirsiniz.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ChecklistManager({ data, customers, transporters, onCreateNew, onEdit, onPrint, onCreateExportSet, onDelete }) {
      const [searchTerm, setSearchTerm] = useState('');
      const getCustomerName = (id) => customers.find(c => c.id === id)?.name || 'Bilinmiyor';
      const getTransporterName = (id) => transporters.find(t => t.id === id)?.name || '-';

      // En yeni fatura tarihli kaydı en üstte sırala ve arama terimine göre filtrele
      const filteredAndSortedData = useMemo(() => {
        const q = searchTerm.trim().toLocaleLowerCase('tr-TR');
        const filtered = !q ? data : data.filter(item => {
          const custName = getCustomerName(item.customerId).toLocaleLowerCase('tr-TR');
          const transName = getTransporterName(item.transporterId).toLocaleLowerCase('tr-TR');
          const invNo = String(item.invoiceNumber || '').toLocaleLowerCase('tr-TR');
          const dateStr = String(formatDateTR(item.checklistDate) || '').toLocaleLowerCase('tr-TR');
          const shipNo = String(item.shipmentNo || '').toLocaleLowerCase('tr-TR');
          const bookNo = String(item.bookingNo || '').toLocaleLowerCase('tr-TR');
          const contNo = String(item.containerNo || '').toLocaleLowerCase('tr-TR');
          const noteStr = String(item.specialNote || '').toLocaleLowerCase('tr-TR');
          const itemMatch = (item.items || []).some(sub =>
            String(sub.parcaAdi || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(sub.sipRefNo || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(sub.resimNo || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(sub.adsIsNo || '').toLocaleLowerCase('tr-TR').includes(q)
          );
          return (
            invNo.includes(q) ||
            custName.includes(q) ||
            transName.includes(q) ||
            dateStr.includes(q) ||
            shipNo.includes(q) ||
            bookNo.includes(q) ||
            contNo.includes(q) ||
            noteStr.includes(q) ||
            itemMatch
          );
        });

        return [...filtered].sort((a, b) => {
          const dateA = a.checklistDate ? new Date(a.checklistDate).getTime() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
          const dateB = b.checklistDate ? new Date(b.checklistDate).getTime() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
          if (dateB !== dateA) return dateB - dateA;
          const createdA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const createdB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          if (createdB !== createdA) return createdB - createdA;
          return String(b.invoiceNumber || '').localeCompare(String(a.invoiceNumber || ''), undefined, { numeric: true });
        });
      }, [data, searchTerm, customers, transporters]);

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
          <div className="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-wrap justify-between items-center gap-3">
            <div className="flex items-center gap-3">
              <h3 className="text-lg font-semibold text-slate-800 flex items-center">
                <FileSpreadsheet className="w-5 h-5 mr-2 text-blue-500" /> Kayıtlı Evraklar / Check Listler
              </h3>
              <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                {filteredAndSortedData.length} Kayıt
              </span>
            </div>

            <div className="flex items-center gap-3 flex-1 max-w-xl justify-end">
              <div className="relative flex-1 max-w-sm">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <Icon name="search" size={16} />
                </span>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  placeholder="Fatura No, Müşteri, Konteyner, Sipariş veya Parça ara..."
                  className="w-full pl-9 pr-8 py-2 border border-slate-300 rounded-lg text-xs font-medium outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm"
                />
                {searchTerm && (
                  <button
                    type="button"
                    onClick={() => setSearchTerm('')}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                    title="Temizle"
                  >
                    <X size={14} />
                  </button>
                )}
              </div>

              <button type="button" onClick={onCreateNew} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold flex items-center shadow-sm text-xs whitespace-nowrap transition-colors">
                <FileText size={16} className="mr-1.5" /> Yeni Evrak / Check List Oluştur
              </button>
            </div>
          </div>
          <div className="overflow-auto flex-1">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-sm sticky top-0 shadow-sm z-10">
                  <th className="p-4 font-semibold">Fatura No / Tarih</th>
                  <th className="p-4 font-semibold">Müşteri</th>
                  <th className="p-4 font-semibold">Nakliyeci</th>
                  <th className="p-4 font-semibold">Döviz</th>
                  <th className="p-4 font-semibold text-center">Toplam Adet</th>
                  <th className="p-4 font-semibold w-64 text-center">İşlem</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 text-sm">
                {filteredAndSortedData.length > 0 ? filteredAndSortedData.map(item => {
                  const totalAdet = (item.items || []).reduce((sum, it) => {
                    const val = typeof it.adet === 'number' ? it.adet : parseFloat(String(it.adet || '0').replace(/\./g, '').replace(',', '.'));
                    return sum + (isNaN(val) ? 0 : val);
                  }, 0);

                  return (
                    <tr key={item.id} className="hover:bg-slate-50">
                      <td className="p-4 font-bold text-blue-600">
                        {item.invoiceNumber}
                        <div className="text-xs text-slate-400 font-normal">{formatDateTR(item.checklistDate) || new Date(item.createdAt).toLocaleDateString('tr-TR')}</div>
                        {(item.shipmentNo || item.containerNo || item.bookingNo) && (
                          <div className="flex flex-wrap gap-1 mt-1">
                            {item.shipmentNo && <span className="bg-red-50 text-red-700 border border-red-200 px-1.5 py-0.5 rounded text-[10px] font-extrabold">{item.shipmentNo.toLowerCase().startsWith('shipment') ? item.shipmentNo : `Shipment ${item.shipmentNo}`}</span>}
                            {item.bookingNo && <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-0.5 rounded text-[10px] font-extrabold">{item.bookingNo}</span>}
                            {item.containerNo && <span className="bg-blue-50 text-blue-700 border border-blue-200 px-1.5 py-0.5 rounded text-[10px] font-extrabold">📦 {item.containerNo}</span>}
                          </div>
                        )}
                      </td>
                      <td className="p-4 text-slate-700 font-medium">{getCustomerName(item.customerId)}</td>
                      <td className="p-4 text-slate-700">
                        {getTransporterName(item.transporterId)}
                        {item.specialNote && <div className="text-[11px] text-amber-700 font-semibold truncate max-w-[200px]" title={item.specialNote}>📌 {item.specialNote}</div>}
                      </td>
                      <td className="p-4 text-slate-700 font-bold">{item.currency || 'EUR'}</td>
                      <td className="p-4 text-center">
                        <span className="inline-flex items-center gap-1.5 bg-gradient-to-r from-indigo-50 to-blue-50 text-indigo-700 border border-indigo-200/90 shadow-sm py-1 px-3 rounded-full text-xs font-extrabold whitespace-nowrap">
                          <span className="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
                          {totalAdet.toLocaleString('tr-TR')} Adet
                        </span>
                      </td>
                      <td className="p-4 text-center">
                        <div className="flex justify-center items-center gap-2">
                          <button type="button" onClick={() => onCreateExportSet(item)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-xs font-bold flex items-center shadow-sm" title="İhracat Seti Oluştur"><Layers size={14} className="mr-1" /> İhracat Seti</button>
                          <button type="button" onClick={() => onPrint(item)} className="text-emerald-600 p-1 flex items-center" title="Sadece Packing List"><Printer size={18} /></button>
                          <button type="button" onClick={() => onEdit(item)} className="text-blue-600 p-1 flex items-center" title="Düzenle"><Edit size={18} /></button>
                          <button type="button" onClick={() => onDelete(item.id)} className="text-red-500 p-1 flex items-center" title="Sil"><Trash2 size={16} /></button>
                        </div>
                      </td>
                    </tr>
                  );
                }) : (
                  <tr>
                    <td colSpan={6} className="p-12 text-center text-slate-500 text-base">
                      {searchTerm ? `"${searchTerm}" aramasına uygun evrak bulunamadı.` : 'Bu ihracatçıya ait evrak/checklist bulunamadı.'}
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ChecklistForm({ exporter, customers, transporters, initialData, onBack, onSaveChecklist }) {

      const [checklistDate, setChecklistDate] = useState(initialData?.checklistDate || new Date().toISOString().split('T')[0]);

      const [customerId, setCustomerId] = useState(initialData?.customerId || '');
      const [transporterId, setTransporterId] = useState(initialData?.transporterId || '');
      const [currency, setCurrency] = useState(initialData?.currency || 'EUR');
      const [deliveryAddress, setDeliveryAddress] = useState(initialData?.deliveryAddress || '');
      const [selectedBankId, setSelectedBankId] = useState(initialData?.selectedBankId || '');
      const [selectedInsuranceId, setSelectedInsuranceId] = useState(initialData?.selectedInsuranceId || '');
      const [customsDescriptionTR, setCustomsDescriptionTR] = useState(initialData?.customsDescriptionTR || 'Yatak');
      const [specialNote, setSpecialNote] = useState(initialData?.specialNote || '');
      const [shipmentNo, setShipmentNo] = useState(initialData?.shipmentNo || '');
      const [bookingNo, setBookingNo] = useState(initialData?.bookingNo || '');
      const [containerNo, setContainerNo] = useState(initialData?.containerNo || '');
      const [hasDutyFee, setHasDutyFee] = useState(initialData?.hasDutyFee || false);
      const [dutyFeeRate, setDutyFeeRate] = useState(initialData?.dutyFeeRate ?? 12.5);
      const [dutyFeeLabel, setDutyFeeLabel] = useState(initialData?.dutyFeeLabel || '');
      const [extraCharges, setExtraCharges] = useState(initialData?.extraCharges || []);
      const [hasDownPayment, setHasDownPayment] = useState(initialData?.hasDownPayment || false);
      const [downPaymentRate, setDownPaymentRate] = useState(initialData?.downPaymentRate ?? 30);
      const [isFreeOfCharge, setIsFreeOfCharge] = useState(initialData?.isFreeOfCharge || false);
      const [items, setItems] = useState(initialData?.items || []);
      const [isExcelLoading, setIsExcelLoading] = useState(false);

      // Tıklayınca Açılan Opsiyonel Alanların Görünürlük State'leri
      const [showDeliveryAddrInput, setShowDeliveryAddrInput] = useState(Boolean(initialData?.deliveryAddress));
      const [showSpecialNoteInput, setShowSpecialNoteInput] = useState(Boolean(initialData?.specialNote));
      const [showExtraChargesPanel, setShowExtraChargesPanel] = useState(Boolean(initialData?.extraCharges?.length > 0));
      const [showTaxDutyPanel, setShowTaxDutyPanel] = useState(Boolean(initialData?.hasDutyFee || initialData?.hasDownPayment || initialData?.isFreeOfCharge));

      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(50);

      const [selectedIds, setSelectedIds] = useState([]);
      const [groupPalletNo, setGroupPalletNo] = useState('');
      const [groupPalletEbat, setGroupPalletEbat] = useState('');
      const [groupBrutKg, setGroupBrutKg] = useState('');

      const handleAddExtraCharge = (presetName = '') => {
        setShowExtraChargesPanel(true);
        setExtraCharges(prev => [
          ...prev,
          { id: generateId(), sipRefNo: '', description: presetName, adet: 1, fiyat: '', tutar: '' }
        ]);
      };

      const handleExtraChargeChange = (id, key, val) => {
        setExtraCharges(prev => prev.map(ec => {
          if (ec.id !== id) return ec;
          const updated = { ...ec, [key]: val };
