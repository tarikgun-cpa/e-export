          ? String(data.dutyFeeLabel).trim()
          : `RECIP TR ${dutyRate.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} % DUTY`;
      }, [directDuty, dutyRate, data?.dutyFeeLabel]);

      const showAdvance = hasDownPayment !== undefined ? Boolean(hasDownPayment) : Number(advanceRate ?? data?.advanceRate ?? 30) > 0;
      const rate = showAdvance ? Number(advanceRate ?? data?.advanceRate ?? data?.downPaymentRate ?? 30) : 0;
      const advanceAmount = (finalOrderAmount * rate) / 100;
      const balanceAmount = Math.max(0, finalOrderAmount - advanceAmount);

      const proformaDate = formatDateTR(data?.proformaDate || data?.checklistDate || new Date().toISOString().split('T')[0]);
      const formattedDeliveryDate = formatDateTR(data?.deliveryDate);
      const proformaNo = data?.proformaNumber || data?.invoiceNumber || '';
      const customDeliveryAddress = data?.deliveryAddress || '';
      const hasCustomDelivery = Boolean(customDeliveryAddress && customDeliveryAddress.trim() !== '');

      const shipmentNo = data?.shipmentNo || '';
      const bookingNo = data?.bookingNo || '';
      const containerNo = data?.containerNo || '';
      const hasContainerInfo = Boolean((shipmentNo && shipmentNo.trim()) || (bookingNo && bookingNo.trim()) || (containerNo && containerNo.trim()));

      const selectedBank = exporter?.banks?.find(b => b.id === data?.selectedBankId) || exporter?.banks?.filter(b => b.currency === currency)[0] || exporter?.banks?.[0];

      const totalRows = items.length + extraCharges.length;
      const isFewRows = totalRows <= 10;
      const isMediumRows = totalRows > 10 && totalRows <= 18;
      const isCompact = totalRows > 18;
      const isUltraCompact = totalRows > 25;

      const invRowPad = isUltraCompact
        ? 'py-[2px] px-1.5 text-[8.5px]'
        : isCompact
        ? 'py-[3px] px-1.5 text-[9px]'
        : isMediumRows
        ? 'py-1 px-2 text-[9.5px]'
        : 'py-1.5 px-2 text-[10px]';

      const emptyZebraCount = isFewRows ? Math.max(0, (hasContainerInfo ? 7 : 9) - totalRows) : 0;

      const defaultPaymentText = rate > 0
        ? `${rate}% ADVANCE PAYMENT PRIOR TO PRODUCTION, ${100 - rate}% BALANCE BEFORE SHIPMENT.`
        : '100% BEFORE SHIPMENT.';

      return (
        <div className="bg-white p-6 mx-auto w-full shadow-lg relative print-page flex flex-col justify-between font-sans text-black border border-slate-300" style={{ width: '210mm', height: '287mm', minHeight: '287mm' }}>
          {/* ÜST BÖLÜM */}
          <div className="shrink-0">
            <div className="flex flex-col items-center mb-2">
              {exporter?.logo && <img src={exporter.logo} alt="Exporter Logo" className="h-20 max-w-[240px] object-contain" />}
            </div>

            <div className="text-[10px] mb-3">
              <div className="font-extrabold mb-1 text-[11px] text-black">{exporter?.address}</div>
              <div className="grid grid-cols-[65px_145px_100px_1fr] gap-x-2 gap-y-0.5 max-w-lg items-center">

              <colgroup>
                <col className="w-[58%]" />
                <col className="w-[42%]" />
              </colgroup>
              <tbody>
                <tr className="border-b border-slate-300">

                  </td>
                  <td className="p-2.5 bg-white align-bottom">
                    <div className="flex justify-between items-end font-extrabold text-[11px] text-black">
                      <span>Net Order Amount</span>
                      <span>{netOrderAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} .-{getSymbol(currency)}</span>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td className="border-r border-slate-300 p-2.5 align-top bg-white">
                    <div className="grid grid-cols-[118px_1fr] gap-x-2 gap-y-0.5 text-[9px] uppercase items-center">
                      <div className="text-black font-extrabold">TOTAL QUANTITY :</div>

                        <>
                          <div className="text-black font-extrabold">NET WEIGHT (EST.) :</div>
                          <div className="text-black font-semibold">{totals.totalNetKg.toLocaleString('tr-TR')} KGS</div>

                      <div className="text-black font-extrabold">DELIVERY TERM :</div>
                      <div className="text-[#a80000] font-black">{deliveryTerm || 'DAP'} {customer?.country}</div>

                      <div className="text-black font-extrabold self-start">PAYMENT TERMS :</div>
                      <div className="text-[#0047b3] font-bold text-[8.5px] leading-tight">
                        {data?.paymentTerms || defaultPaymentText}
                      </div>

                      {customer?.htsNo && (
                        <>
                          <div className="text-black font-extrabold">HS / HTS CODE :</div>

                      )}

                      </div>

                      <div className="col-span-2 border-t border-slate-300 my-1"></div>

                      <div className="text-black font-extrabold">OUR BANK DETAILS</div>
                      <div className="text-black font-bold">{selectedBank?.bankName || '-'}</div>

                      <div className="text-black font-extrabold">SWIFT CODE</div>
                      <div className="text-black font-semibold">{selectedBank?.swift || '-'}</div>

                      <div className="text-black font-extrabold">ACCOUNT NO</div>
                      <div className="text-black font-semibold">-</div>

                      <div className="text-black font-extrabold">IBAN NO</div>
                      <div className="text-black font-extrabold">{selectedBank?.iban || '-'}</div>
                    </div>
                  </td>
                  <td className="p-0 align-top bg-white h-full">
                    <div className="flex flex-col justify-between h-full font-bold text-[10.5px]" style={{ minHeight: '152px' }}>
                      <div>
                        {hasDuty ? (

                            <span className="font-black text-[9.5px] uppercase px-1 text-center">{effectiveDutyLabel}</span>
                            <span className="font-black whitespace-nowrap">{dutyAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} .-{getSymbol(currency)}</span>

                          <div className="flex justify-between items-center px-2.5 py-1.5 text-[#003d99] bg-[#eef2f7] border-b border-slate-300 text-[11px]">
                            <span className="font-extrabold">VAT</span>
                            <span className="font-extrabold">0,00 .-{getSymbol(currency)}</span>
                          </div>
                        )}

                        <div className="flex justify-between items-center px-2.5 py-2 border-b-4 border-double border-slate-400 text-[11px] bg-white">

                          <span className="text-[#a80000] text-[9.5px] font-black uppercase text-center px-1">{deliveryTerm || 'DAP'} {customer?.country}</span>
                          <span className="font-black text-black whitespace-nowrap">{finalOrderAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} .-{getSymbol(currency)}</span>

                              <span className="underline whitespace-nowrap">
                                {advanceAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} .-{getSymbol(currency)}
                              </span>
                            </div>

                            <div className="flex justify-between items-center px-2.5 py-1.5 text-[#0047b3] font-extrabold text-[10px]">
                              <span className="underline">BALANCE ({100 - rate}%)</span>
                              <span className="underline whitespace-nowrap">
                                {balanceAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} .-{getSymbol(currency)}
                              </span>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="py-2 px-2 text-center bg-[#eef2f7] border-t border-b border-slate-300 my-auto">
                        <span className="text-[#003d99] italic text-[8.5px] font-semibold leading-tight block">
                          {rate > 0 ? `Advance Payment (${rate}%): ` : ''}
                          {getAmountInWords(rate > 0 ? advanceAmount : finalOrderAmount, currency)}

                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          {/* FOOTER */}
          <div className="mt-2 flex flex-col items-center justify-center shrink-0">
            <div className="flex flex-wrap justify-center gap-6 w-full px-6 mb-1.5 text-[#0047b3] text-[9.5px] font-medium">
              {customer?.contacts && customer.contacts.filter(c => c.email).length > 0 ? (
                customer.contacts.filter(c => c.email).map((c, i) => (
                  <a key={i} href={`mailto:${c.email}`} className="underline flex items-center gap-1">
                    <Icon name="mail" size={11} /> {c.name ? `${c.name} (${c.email})` : c.email}
                  </a>
                ))

            <div className="w-full text-center text-[9px] bg-[#e2e8f0] border border-slate-400 py-1.5 px-2 font-bold text-black">

              VAT ID No: {exporter?.vatNo}
            </div>
          </div>
        </div>
      );

    function ProformaPrintModal({ proforma, exporter, customer, onClose }) {
      const [showStamp, setShowStamp] = useState(true);
      const [advanceRate, setAdvanceRate] = useState(proforma?.advanceRate ?? 30);

      return (
        <div className="fixed inset-0 bg-slate-900/90 z-50 flex flex-col p-4 print-modal-wrapper">
          <div className="bg-white rounded-xl shadow-2xl max-w-[1120px] mx-auto w-full flex-1 flex flex-col overflow-hidden border border-slate-300 print-modal-inner">
            <div className="no-print bg-slate-100 p-3.5 flex flex-wrap justify-between items-center gap-3 border-b border-slate-300 shrink-0">
              <div className="flex items-center gap-2">
                <FileText className="text-rose-600 w-5 h-5" />
                <h3 className="text-base font-bold text-slate-800">Proforma Fatura Önizleme ({proforma?.proformaNumber})</h3>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-300 text-xs">
                  <span className="font-bold text-rose-700">Avans Oranı (%):</span>
                  <input
                    type="number"
                    min="0"
                    max="100"
                    value={advanceRate}
                    onChange={e => setAdvanceRate(e.target.value)}
                    className="w-14 border border-slate-300 rounded px-1.5 py-0.5 text-center font-black text-rose-700 outline-none"
                  />
                </div>

                {exporter?.stamp && (
                  <label className="flex items-center gap-2 cursor-pointer bg-amber-50 hover:bg-amber-100 text-amber-900 px-3 py-1.5 rounded-lg border border-amber-300 text-xs font-bold shadow-sm">
                    <input type="checkbox" checked={showStamp} onChange={e => setShowStamp(e.target.checked)} className="w-4 h-4 accent-amber-600" />
                    Kaşe/İmza Bas
                  </label>
                )}

                <button type="button" onClick={() => window.print()} className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-1.5 rounded-lg font-bold flex items-center shadow-md text-sm">
                  <Printer size={16} className="mr-1.5" /> Yazdır
                </button>
                <button type="button" onClick={onClose} className="bg-slate-300 text-slate-700 hover:bg-slate-400 px-4 py-1.5 rounded-lg font-medium text-sm">
                  Kapat
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto bg-slate-300 p-6 print-container">
              <ProformaInvoicePage
                data={proforma}
                exporter={exporter}
                customer={customer}
                deliveryTerm={proforma?.deliveryTerm || 'DAP'}
                showStamp={showStamp}
                advanceRate={advanceRate}
                hasDownPayment={Number(advanceRate) > 0}
              />
            </div>
          </div>
        </div>
      );
    }

    function ExportSetPrintModal({ checklist, exporter, customer, transporter, onClose }) {
      const [activeTab, setActiveTab] = useState('invoice');
      const [showStamp, setShowStamp] = useState(true);
      const [hasDownPayment, setHasDownPayment] = useState(checklist?.hasDownPayment || false);
      const [downPaymentRate, setDownPaymentRate] = useState(checklist?.downPaymentRate ?? 30);
      const [isFreeOfCharge, setIsFreeOfCharge] = useState(checklist?.isFreeOfCharge || false);
      const [deliveryDate, setDeliveryDate] = useState(checklist?.deliveryDate || '');
      const [customDeliveryAddress, setCustomDeliveryAddress] = useState(checklist?.deliveryAddress || '');
      const [customsDescTR, setCustomsDescTR] = useState(checklist?.customsDescriptionTR || 'Yatak');
      const [specialNote, setSpecialNote] = useState(checklist?.specialNote || '');
      const [shipmentNo, setShipmentNo] = useState(checklist?.shipmentNo || '');
      const [bookingNo, setBookingNo] = useState(checklist?.bookingNo || '');
      const [containerNo, setContainerNo] = useState(checklist?.containerNo || '');
      const [hasDutyFee, setHasDutyFee] = useState(checklist?.hasDutyFee || false);
      const [dutyFeeRate, setDutyFeeRate] = useState(checklist?.dutyFeeRate ?? 12.5);
      const [dutyFeeLabel, setDutyFeeLabel] = useState(checklist?.dutyFeeLabel || '');
      const [copiedKey, setCopiedKey] = useState(null);

      // Sigorta Talimatı İçin Denizyolu & Karayolu Özel Alanları
      const isSeaTransport = String(transporter?.transportType || '').toLowerCase().includes('deniz');
      const [vesselName, setVesselName] = useState(checklist?.vesselName || '');
      const [vesselFlag, setVesselFlag] = useState(checklist?.vesselFlag || '');
      const [vesselImoYear, setVesselImoYear] = useState(checklist?.vesselImoYear || '');
      const [vesselDestination, setVesselDestination] = useState(checklist?.vesselDestination || customer?.country || '');
      const [portDepartureDate, setPortDepartureDate] = useState(checklist?.portDepartureDate || checklist?.checklistDate || '');
      const [truckPlateNo, setTruckPlateNo] = useState(checklist?.truckPlateNo || '');
      const [loadingDate, setLoadingDate] = useState(checklist?.loadingDate || checklist?.checklistDate || '');

      const copyText = (text, key) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(String(text));
          setCopiedKey(key);
          setTimeout(() => setCopiedKey(null), 1500);
        }
      };

      const items = checklist?.items || [];
      const extraCharges = useMemo(() => (checklist?.extraCharges || []).filter(ec => ec && ec.description && String(ec.description).trim() !== ''), [checklist?.extraCharges]);
      const invoiceItems = useMemo(() => groupItemsForInvoice(items), [items]);
      const processedRows = useMemo(() => processTableRows(items), [items]);
      const totals = useMemo(() => calculateTotals(items, processedRows), [items, processedRows]);
      const currency = checklist?.currency || 'EUR';

      // Ek Maliyetler Toplamı (Freight, Pattern, Machining vb.)
      const extraChargesTotal = useMemo(() => {
        return extraCharges.reduce((sum, ec) => {
          const a = parseFloat(String(ec.adet ?? 1).replace(',', '.')) || 0;
          const f = parseFloat(String(ec.fiyat ?? 0).replace(',', '.')) || 0;
          const t = parseFloat(String(ec.tutar ?? 0).replace(',', '.')) || (a * f) || 0;
          return sum + t;
        }, 0);
      }, [extraCharges]);

      // Net Amount = Malzeme Toplamı + Ek Maliyetler (Freight vb.)
      const netInvoiceAmount = useMemo(() => {
        return (totals?.totalTutar || 0) + extraChargesTotal;
      }, [totals?.totalTutar, extraChargesTotal]);

      // 2. kutuya (dutyFeeLabel) direkt tutar yazılmışsa yüzdeden hesaplama, direkt yazılan tutarı getir!
      const directDutyAmount = useMemo(() => parseDirectDutyValue(dutyFeeLabel), [dutyFeeLabel]);

      const dutyFeeAmount = useMemo(() => {
        if (!hasDutyFee) return 0;
        if (directDutyAmount !== null) return directDutyAmount;
        return ((totals?.totalTutar || 0) * (Number(dutyFeeRate) || 0)) / 100;
      }, [hasDutyFee, directDutyAmount, dutyFeeRate, totals?.totalTutar]);

      // Genel Fatura Toplamı (Invoice Amount) = Net Amount + Duty Fee
      const finalInvoiceAmount = useMemo(() => {
        return netInvoiceAmount + dutyFeeAmount;
      }, [netInvoiceAmount, dutyFeeAmount]);

      const downPaymentAmount = useMemo(() => {
        if (!hasDownPayment) return 0;
        return (finalInvoiceAmount * (Number(downPaymentRate) || 0)) / 100;
      }, [hasDownPayment, downPaymentRate, finalInvoiceAmount]);

      const remainingAmount = useMemo(() => {
        if (!hasDownPayment) return finalInvoiceAmount;
        return Math.max(0, finalInvoiceAmount - downPaymentAmount);
      }, [hasDownPayment, finalInvoiceAmount, downPaymentAmount]);

      const rawInvoiceDate = checklist?.checklistDate || new Date().toISOString().split('T')[0];
      const invoiceDate = formatDateTR(rawInvoiceDate);
      const formattedDeliveryDate = formatDateTR(deliveryDate);
      const hasCustomDelivery = Boolean(customDeliveryAddress && customDeliveryAddress.trim() !== '');
      const hasContainerInfo = Boolean((shipmentNo && shipmentNo.trim()) || (bookingNo && bookingNo.trim()) || (containerNo && containerNo.trim()));
      const hasPackingBottomBar = Boolean(hasContainerInfo || (customer?.htsNo && String(customer.htsNo).trim() !== ''));

      const cleanDrawingNo = (str) => String(str || '').replace(/[-–—\s]+$/, '').trim();

      const exporterCity = useMemo(() => {
        if (!exporter?.address) return 'TÜRKİYE';
        const parts = exporter.address.split(/[-/,]/).map(s => s.trim()).filter(Boolean);
        return parts.length > 1 ? parts[parts.length - 1] : 'KOCAELİ';
      }, [exporter?.address]);

      const uniquePartNames = Array.from(new Set(items.map(i => i.parcaAdi).filter(Boolean))).join(' & ');
      const uniqueOrders = Array.from(new Set(items.map(i => i.sipRefNo).filter(Boolean))).join(' & ');

      const palletMap = {};
      items.forEach(i => { if (i.paletNo && i.paletEbatlari) palletMap[i.paletNo] = i.paletEbatlari; });
      const dimensionCounts = {};
      Object.values(palletMap).forEach(dim => { dimensionCounts[dim] = (dimensionCounts[dim] || 0) + 1; });
      const palletSummary = Object.entries(dimensionCounts).map(([dim, count]) => `${count} Pallets ${dim}`).join(' & ');

      const selectedBank = exporter?.banks?.find(b => b.id === checklist?.selectedBankId) || exporter?.banks?.filter(b => b.currency === currency)[0] || exporter?.banks?.[0];
      const selectedInsurance = exporter?.insurances?.find(i => i.id === checklist?.selectedInsuranceId) || exporter?.insurances?.[0];

      const totalInvoiceRowCount = invoiceItems.length + extraCharges.length;
      const isFewRows = items.length <= 10;
      const isMediumRows = totalInvoiceRowCount > 10 && totalInvoiceRowCount <= 18;
      const isCompact = totalInvoiceRowCount > 18;
      const isUltraCompact = totalInvoiceRowCount > 25;

      const invRowPad = isUltraCompact
        ? 'py-[2px] px-1.5 text-[8.5px]'
        : isCompact
        ? 'py-[3px] px-2 text-[9px]'
        : isMediumRows
        ? 'py-1 px-2 text-[9.5px]'
        : 'py-1.5 px-2 text-[10px]';

      const packRowPad = items.length > 25
        ? 'py-[2px] px-1.5 text-[8.5px]'
        : items.length > 18
        ? 'py-[3px] px-2 text-[9px]'
        : items.length > 10
        ? 'py-1 px-2 text-[9.5px]'
        : 'py-1.5 px-2.5 text-[10px]';

      const emptyZebraCount = totalInvoiceRowCount <= 10 ? Math.max(0, (hasContainerInfo ? 7 : 9) - totalInvoiceRowCount) : 0;
      const emptyPackingZebraCount = isFewRows ? Math.max(0, (hasPackingBottomBar ? 6 : 8) - items.length) : 0;

      const effectiveDutyLabel = useMemo(() => {
        if (directDutyAmount !== null) {
          return Number(dutyFeeRate) > 0
            ? `RECIP TR ${Number(dutyFeeRate).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} % DUTY`
            : 'CUSTOMS DUTY';
        }
        return dutyFeeLabel && dutyFeeLabel.trim() !== ''
          ? dutyFeeLabel.trim()
          : `RECIP TR ${Number(dutyFeeRate || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} % DUTY`;
      }, [directDutyAmount, dutyFeeRate, dutyFeeLabel]);

      const trDutyLineDesc = `TAX ${effectiveDutyLabel}`;

      const tabs = [
        { id: 'proforma', label: 'Proforma Invoice' },
        { id: 'invoice', label: 'Invoice' },
        { id: 'packing', label: 'Çeki Listesi' },
        { id: 'workOrder', label: 'İş Emri' },
        { id: 'transport', label: 'Nakliye Talimatı' },
        { id: 'insurance', label: 'Sigorta Talimatı' },
        { id: 'atr', label: 'A.TR Belgesi' },
        { id: 'trInvoice', label: 'TR e-Fatura (GİB Kopyala)' }
      ];

      const StampImage = ({ className = '', maxW = '200px', maxH = '100px' }) => {
        if (!showStamp || !exporter?.stamp) return null;
        return (
          <img
            src={exporter.stamp}
            alt="Kaşe İmza"
            className={`mix-blend-multiply opacity-95 pointer-events-none object-contain ${className}`}
            style={{ maxWidth: maxW, maxHeight: maxH }}
          />
        );
      };

      return (
        <div className="fixed inset-0 bg-slate-900/90 z-50 flex flex-col p-4 print-modal-wrapper">
          <div className="bg-white rounded-xl shadow-2xl max-w-[1160px] mx-auto w-full flex-1 flex flex-col overflow-hidden border border-slate-300 print-modal-inner">
            {/* Modal Header & Tabs (Yazdırırken Gizlenir) */}
            <div className="no-print bg-slate-100 flex flex-col z-10 shrink-0">
              <div className="p-3 flex flex-wrap justify-between items-center gap-2 border-b border-slate-300">
                <div className="flex items-center gap-2">
                  <Layers className="text-indigo-600 w-5 h-5" />
                  <h3 className="text-sm font-bold text-slate-800">Tam İhracat Seti</h3>
                </div>
                
                <div className="flex flex-wrap items-center gap-2">
                  <div className="flex flex-wrap items-center gap-2 bg-white px-2.5 py-1 rounded-lg border border-slate-300 shadow-sm text-[11px]">
                    <div className="flex items-center gap-1">
                      <span className="font-bold text-red-700">Shipment:</span>
                      <input type="text" value={shipmentNo} onChange={e => setShipmentNo(e.target.value)} placeholder="23" className="border border-slate-300 rounded px-1 py-0.5 text-[11px] font-bold text-red-700 w-12 text-center outline-none" />
                    </div>
                    <div className="flex items-center gap-1">
                      <span className="font-bold text-blue-800">Booking:</span>
                      <input type="text" value={bookingNo} onChange={e => setBookingNo(e.target.value)} placeholder="ELK20262456" className="border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-bold text-blue-900 w-24 outline-none" />
                    </div>
                    <div className="flex items-center gap-1">
                      <span className="font-bold text-sky-800">📦 Cont:</span>
                      <input type="text" value={containerNo} onChange={e => setContainerNo(e.target.value)} placeholder="ZIMUIST..." className="border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-bold text-sky-900 w-28 outline-none" />
                    </div>
                    <span className="text-slate-300">|</span>
                    <div className="flex items-center gap-1">
                      <span className="font-semibold text-slate-600">Sevk Adresi:</span>
                      <input 
                        type="text" 
                        value={customDeliveryAddress} 
                        onChange={e => setCustomDeliveryAddress(e.target.value)} 
                        placeholder="Farklı sevk adresi..."
                        className="border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-semibold text-blue-800 outline-none w-32"
                      />
                    </div>
                    {(activeTab === 'invoice' || activeTab === 'proforma') && (
                      <>
                        <span className="text-slate-300">|</span>
                        <label className="flex items-center gap-1 font-bold text-rose-700 cursor-pointer" title="Oran veya 2. kutuya direkt tutar girebilirsiniz">
                          <input type="checkbox" checked={hasDutyFee} onChange={e => setHasDutyFee(e.target.checked)} className="w-3.5 h-3.5 accent-rose-600" />
                          Duty%
                        </label>
                        {hasDutyFee && (
                          <div className="flex items-center gap-1">
                            <input 
                              type="number" 
                              step="0.01"
                              value={dutyFeeRate} 
                              onChange={e => setDutyFeeRate(e.target.value)} 
                              className="w-11 border border-rose-300 rounded px-1 py-0.5 text-center font-black text-rose-700 outline-none"
                              title="Yüzde Oranı (%)"
                            />
                            <input 
                              type="text" 
                              value={dutyFeeLabel} 
                              onChange={e => setDutyFeeLabel(e.target.value)} 
                              placeholder="Etiket veya Tutar"
                              className="w-28 border border-rose-300 rounded px-1.5 py-0.5 font-bold text-rose-900 outline-none"
                              title="Buraya direkt rakam/tutar yazarsanız yüzdeden hesaplamaz, yazdığınız tutarı getirir"
                            />
                          </div>
                        )}
                        <span className="text-slate-300">|</span>
                        <label className="flex items-center gap-1 font-bold text-red-700 cursor-pointer">
                          <input type="checkbox" checked={hasDownPayment} onChange={e => setHasDownPayment(e.target.checked)} className="w-3.5 h-3.5 accent-red-600" />
                          Peşinat%
                        </label>
                        {hasDownPayment && (
                          <input 
                            type="number" 
                            value={downPaymentRate} 
                            onChange={e => setDownPaymentRate(e.target.value)} 
                            className="w-10 border border-slate-300 rounded px-1 py-0.5 text-center font-bold text-red-600 outline-none"
                          />
                        )}
                      </>
                    )}
                  </div>

                  {exporter?.stamp && (
                    <label className="flex items-center gap-1.5 cursor-pointer bg-amber-50 hover:bg-amber-100 text-amber-900 px-2.5 py-1.5 rounded-lg border border-amber-300 text-xs font-bold shadow-sm transition-colors">
                      <input type="checkbox" checked={showStamp} onChange={(e) => setShowStamp(e.target.checked)} className="w-3.5 h-3.5 cursor-pointer accent-amber-600" />
                      Kaşe
                    </label>
                  )}
                  <button type="button" onClick={() => window.print()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg font-bold flex items-center shadow-md transition-colors text-xs">
                    <Printer size={15} className="mr-1" /> Yazdır
                  </button>
                  <button type="button" onClick={onClose} className="bg-slate-300 text-slate-700 hover:bg-slate-400 px-3 py-1.5 rounded-lg font-medium text-xs transition-colors">Kapat</button>
                </div>
              </div>

              {/* SİGORTA TALİMATI SEKMESİ AÇIKKEN DENİZYOLU / KARAYOLU BİLGİ GİRİŞ BARI */}
              {activeTab === 'insurance' && (
                <div className="bg-blue-50 border-b border-blue-200 px-4 py-2 flex flex-wrap items-center gap-3 text-xs">
                  <span className="font-extrabold text-[#003d99] uppercase flex items-center gap-1">
                    <CarrierBadge transporter={transporter} />
                    <span>Sigorta Sevk Detayları ({isSeaTransport ? 'Denizyolu' : 'Karayolu'}):</span>
                  </span>

                  {isSeaTransport ? (
                    <div className="flex flex-wrap items-center gap-2 flex-1">
                      <div className="flex items-center gap-1">
                        <span className="font-bold text-slate-700">Gemi Adı:</span>
                        <input type="text" value={vesselName} onChange={e => setVesselName(e.target.value)} placeholder="Örn: MSC ANNA" className="px-2 py-1 border border-blue-300 rounded bg-white text-xs font-bold w-32 outline-none" />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="font-bold text-slate-700">Bayrak:</span>
                        <input type="text" value={vesselFlag} onChange={e => setVesselFlag(e.target.value)} placeholder="Örn: PANAMA" className="px-2 py-1 border border-blue-300 rounded bg-white text-xs font-bold w-24 outline-none" />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="font-bold text-slate-700">IMO / Yapım Yılı:</span>
                        <input type="text" value={vesselImoYear} onChange={e => setVesselImoYear(e.target.value)} placeholder="Örn: 9485671 / 2012" className="px-2 py-1 border border-blue-300 rounded bg-white text-xs font-bold w-36 outline-none" />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="font-bold text-slate-700">Destinasyon:</span>
                        <input type="text" value={vesselDestination} onChange={e => setVesselDestination(e.target.value)} placeholder="Liman / Ülke" className="px-2 py-1 border border-blue-300 rounded bg-white text-xs font-bold w-36 outline-none" />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="font-bold text-slate-700">Liman Kalkış Tarihi:</span>
                        <input type="date" value={portDepartureDate} onChange={e => setPortDepartureDate(e.target.value)} className="px-2 py-1 border border-blue-300 rounded bg-white text-xs font-bold outline-none" />
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-wrap items-center gap-3">
                      <div className="flex items-center gap-1.5">
                        <span className="font-bold text-slate-700">Tır Plaka No:</span>
                        <input type="text" value={truckPlateNo} onChange={e => setTruckPlateNo(e.target.value)} placeholder="Örn: 34 ABC 123 / 34 XYZ 45" className="px-2.5 py-1 border border-blue-300 rounded bg-white text-xs font-bold w-48 outline-none" />
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="font-bold text-slate-700">Yükleme Tarihi:</span>
                        <input type="date" value={loadingDate} onChange={e => setLoadingDate(e.target.value)} className="px-2.5 py-1 border border-blue-300 rounded bg-white text-xs font-bold outline-none" />
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TABS */}
              <div className="flex bg-slate-200 px-2 pt-2 gap-1 overflow-x-auto shadow-inner">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-5 py-2 rounded-t-lg font-bold text-xs transition-colors whitespace-nowrap ${activeTab === tab.id ? 'bg-white text-indigo-700 border-t-2 border-indigo-600 shadow-[0_-2px_6px_rgba(0,0,0,0.05)] z-10' : 'bg-slate-100 text-slate-600 hover:bg-slate-50 border-t-2 border-transparent'}`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Document Render Area */}
            <div className="flex-1 overflow-y-auto bg-slate-300 p-6 print-container">
              
              {/* 0. PROFORMA INVOICE */}
              {activeTab === 'proforma' && (
                <ProformaInvoicePage
                  data={{
                    ...checklist,
                    deliveryAddress: customDeliveryAddress,
                    deliveryDate,
                    shipmentNo,
                    bookingNo,
                    containerNo,
                    hasDutyFee,
                    dutyFeeRate,
                    dutyFeeLabel
                  }}
                  exporter={exporter}
                  customer={customer}
                  transporter={transporter}
                  deliveryTerm={transporter?.deliveryTerm || 'DAP'}
                  showStamp={showStamp}
                  advanceRate={downPaymentRate}
                  hasDownPayment={hasDownPayment}
                />
              )}

              {/* ========================================================================= */}
              {/* 1. INVOICE (Müşteri Kutusundaki İkinci HS Code Kaldırıldı, Sol Alttaki Korundu) */}
              {/* ========================================================================= */}
              {activeTab === 'invoice' && (
                <div className="bg-white p-6 mx-auto w-full shadow-lg relative print-page flex flex-col justify-between font-sans text-black border border-slate-300" style={{ width: '210mm', height: '287mm', minHeight: '287mm' }}>
                  
                  {/* ÜST BÖLÜM */}
                  <div className="shrink-0">
                    <div className="flex flex-col items-center mb-2">
                      {exporter?.logo && <img src={exporter.logo} alt="Exporter Logo" className="h-20 max-w-[240px] object-contain" />}
                    </div>
                    
                    <div className="text-[10px] mb-3">
                       <div className="font-extrabold mb-1 text-[11px] text-black">{exporter?.address}</div>
                       <div className="grid grid-cols-[65px_145px_100px_1fr] gap-x-2 gap-y-0.5 max-w-lg items-center">
                          <div className="text-[#0047b3] font-bold whitespace-nowrap">Tel:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.phone}</div>
                          <div className="text-[#0047b3] font-bold whitespace-nowrap">D-U-N-S ® Number:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.dunsNumber}</div>
                          
                          <div className="text-[#0047b3] font-bold whitespace-nowrap">Fax:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.fax}</div>
                          <div className="text-[#0047b3] font-bold whitespace-nowrap">EORI Number:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.eoriNumber}</div>
                          
                          <div className="text-[#0047b3] font-bold whitespace-nowrap">VAT ID No:</div>
                          <div className="font-extrabold text-black whitespace-nowrap col-span-3">{exporter?.vatNo}</div>
                       </div>
                    </div>

                    {/* CONSIGNEE & INVOICE BANNER */}
                    <div className="flex justify-between items-stretch mb-3 gap-4">
                       <div className="border border-slate-300 rounded-xl p-3.5 w-[57%] min-h-[104px] text-[10.5px] flex flex-col justify-between bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
                         <div>
                           <div className="font-black text-[13.5px] uppercase text-black leading-snug">{customer?.name}</div>
                           <div className="mt-0.5 text-black leading-snug">{customer?.address}</div>
                           <div className="flex justify-between items-baseline mt-1">
                             <span className="font-extrabold uppercase text-black">{customer?.country}</span>
                             {customer?.vatNo && (
                               <span className="font-extrabold text-black text-[10.5px] whitespace-nowrap">
                                 VAT ID: {customer.vatNo}
                               </span>
                             )}
                           </div>
                         </div>

                         {hasCustomDelivery && (
                           <div className="pt-2 mt-2 border-t border-slate-200 text-[9px] leading-tight">
                             <span className="text-[#a80000] font-black uppercase tracking-wide">DELIVERY ADDRESS: </span>
                             <span className="text-[#0047b3] font-bold whitespace-pre-line">{customDeliveryAddress}</span>
                           </div>
                         )}
                       </div>

                       <div className="w-[41%] relative flex flex-col justify-between">
                         <StampImage className="absolute -top-[68px] left-1/2 -translate-x-1/2 z-20" maxW="185px" maxH="82px" />
                         
                         <div className="bg-[#a80000] text-white text-center font-black text-lg py-1.5 rounded-lg uppercase tracking-widest shadow-sm">
                           INVOICE
                         </div>
                         <div className="border border-slate-300 rounded-xl bg-white px-3.5 py-2 flex-1 flex flex-col justify-center mt-2">
                           <div className="text-[10px] font-bold divide-y divide-slate-200">
                             <div className="flex justify-between py-1">
                               <span className="text-black font-bold">Delivery Date</span>
                               <span className="text-right text-black font-extrabold">{formattedDeliveryDate}</span>
                             </div>
                             <div className="flex justify-between py-1">
                               <span className="text-black font-bold">Date of Invoice</span>
                               <span className="text-right text-black font-extrabold">{invoiceDate}</span>
                             </div>
                             <div className="flex justify-between py-1">
                               <span className="text-black font-bold">Invoice Number</span>
                               <span className="text-right text-black font-black">{checklist?.invoiceNumber}</span>
                             </div>
                           </div>
                         </div>
                       </div>
                    </div>
                  </div>

                  {/* ORTA & ALT ENTEGRE TABLO BLOĞU */}
                  <div className="flex-1 flex flex-col border border-slate-300 rounded-t-xl overflow-hidden">
                    <table className="w-full text-left border-collapse" style={{tableLayout: 'fixed'}}>
                      <colgroup>
                        <col className="w-[17.5%]" />
                        <col className="w-[5%]" />
                        <col className="w-[23.5%]" />
                        <col className="w-[15%]" />
                        <col className="w-[9.5%]" />
                        <col className="w-[14%]" />
                        <col className="w-[15.5%]" />
                      </colgroup>
                      <thead>
                        <tr className="bg-[#a80000] text-white text-center">
                          <th colSpan="4" className="border-r border-b border-white/30 py-1.5 px-1 font-extrabold uppercase tracking-wider text-[10px]">
                            DESCRIPTION OF THE GOODS
                          </th>
                          <th rowSpan="2" className="border-r border-white/30 p-1 uppercase font-extrabold align-middle tracking-wider text-[10px]">
                            QUANTITY
                          </th>
                          <th rowSpan="2" className="border-r border-white/30 p-1 uppercase font-extrabold align-middle tracking-wider text-[10px]">
                            UNIT PRICE
                          </th>
                          <th rowSpan="2" className="p-1 uppercase font-extrabold align-middle tracking-wider text-[10px]">
                            TOTAL
                          </th>
                        </tr>
                        <tr className="bg-[#a80000] text-white text-center text-[9px] border-b border-slate-300">
                          <th className="font-bold border-r border-white/30 py-1 px-1 whitespace-nowrap">Order No</th>
                          <th className="font-bold border-r border-white/30 py-1 px-0.5 whitespace-nowrap">Pos No</th>
                          <th className="font-bold border-r border-white/30 py-1 px-1 whitespace-nowrap">Part Name</th>
                          <th className="font-bold border-r border-white/30 py-1 px-1 whitespace-nowrap">Drawing No</th>
                        </tr>
                      </thead>
                      <tbody className="align-middle text-black">
                        {/* 1. MALZEME SATIRLARI */}
                        {invoiceItems.map((item, idx) => {
                            const adet = parseFloat(item.adet) || 0;
                            const fiyat = parseFloat(item.fiyat) || 0;
                            const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
                            const isEven = idx % 2 === 1;

                <div className="bg-white p-6 mx-auto w-full shadow-lg rounded-xl border border-slate-300 max-w-[1000px] font-sans text-black">
                  <div className="flex flex-wrap justify-between items-center gap-4 border-b border-slate-200 pb-4 mb-4">

                        <FileSpreadsheet className="text-[#a80000] w-6 h-6" />

                      </h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Format: <strong>Malın Gümrük Tanımı + [ADS İş No, Parça Adı, Sip. Ref No, Resim No]</strong> (Ek Maliyetler ve TAX/DUTY dahil)
                      </p>
                    </div>

                    <div className="flex items-center gap-2 no-print">
                      <button
                        type="button"
                        onClick={() => {
                          const matLines = invoiceItems.map((item, idx) => {
                            const adet = parseFloat(item.adet) || 0;
                            const fiyat = parseFloat(item.fiyat) || 0;
                            const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
                            const bracketParts = [item.adsIsNo, item.parcaAdi, item.sipRefNo, cleanDrawingNo(item.resimNo)].map(s => String(s || '').trim()).filter(Boolean).join(', ');
                            const desc = `${customsDescTR.trim()} [${bracketParts}]`.trim();
                            return `${idx + 1}\t${desc}\t${adet}\t${fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\t${tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                          });
                          const extraLines = extraCharges.map((ec, eIdx) => {
                            const adet = parseFloat(String(ec.adet ?? 1).replace(',', '.')) || 1;
                            const fiyat = parseFloat(String(ec.fiyat ?? 0).replace(',', '.')) || 0;
                            const tutar = parseFloat(String(ec.tutar ?? 0).replace(',', '.')) || (adet * fiyat) || 0;
                            return `${invoiceItems.length + eIdx + 1}\t${ec.description}\t${adet}\t${fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\t${tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                          });
                          const dutyLines = (hasDutyFee && dutyFeeAmount > 0) ? [
                            `${invoiceItems.length + extraCharges.length + 1}\t${trDutyLineDesc}\t1\t${dutyFeeAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\t${dutyFeeAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                          ] : [];
                          copyText([...matLines, ...extraLines, ...dutyLines].join('\n'), 'all-table');
                        }}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-colors"
                      >

                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          if (!window.XLSX) return;
                          const rows = [
                            ["SIRA NO", "MAL / HİZMET AÇIKLAMASI (GİB TR-FATURA)", "MİKTAR (ADET)", `BİRİM FİYAT (${currency})`, `TOPLAM TUTAR (${currency})`],
                            ...invoiceItems.map((item, idx) => {
                              const adet = parseFloat(item.adet) || 0;
                              const fiyat = parseFloat(item.fiyat) || 0;
                              const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
                              const bracketParts = [item.adsIsNo, item.parcaAdi, item.sipRefNo, cleanDrawingNo(item.resimNo)].map(s => String(s || '').trim()).filter(Boolean).join(', ');
                              const desc = `${customsDescTR.trim()} [${bracketParts}]`.trim();
                              return [idx + 1, desc, adet, Number(fiyat.toFixed(2)), Number(tutar.toFixed(2))];
                            }),
                            ...extraCharges.map((ec, eIdx) => {
                              const adet = parseFloat(String(ec.adet ?? 1).replace(',', '.')) || 1;
                              const fiyat = parseFloat(String(ec.fiyat ?? 0).replace(',', '.')) || 0;
                              const tutar = parseFloat(String(ec.tutar ?? 0).replace(',', '.')) || (adet * fiyat) || 0;

                          const wb = window.XLSX.utils.book_new();

                      value={customsDescTR}

                            .filter(Boolean)
                            .join(', ');
                          const trLineDesc = `${customsDescTR.trim()} [${bracketParts}]`.trim();
                          const fiyatFormatted = fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                          return (
                            <tr key={idx} className={`${isEven ? 'bg-[#eef2f7]' : 'bg-white'} hover:bg-blue-50/60 transition-colors`}>

                                    type="button"

                                    title="Sadece Açıklamayı Kopyala"

                                    {copiedKey === `desc-${idx}` ? '✓ Kopyalandı' : 'Açıklamayı Kopyala'}

                                </div>
                              </td>
                              <td
                                onClick={() => copyText(adet, `qty-${idx}`)}

                                title="Tıkla Kopyala"
                              >
                                {copiedKey === `qty-${idx}` ? <span className="text-emerald-600">✓ {adet}</span> : `${adet} ADET`}
                              </td>
                              <td
                                onClick={() => copyText(fiyatFormatted, `price-${idx}`)}

                              >
                                {copiedKey === `price-${idx}` ? <span className="text-emerald-600 font-bold">✓ {fiyatFormatted}</span> : `${fiyatFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td
                                onClick={() => copyText(tutarFormatted, `tot-${idx}`)}
                                className="py-2 px-2.5 text-right font-extrabold text-[#a80000] border-r border-slate-300 cursor-pointer hover:bg-indigo-50 whitespace-nowrap"
                                title="Tıkla Kopyala"
                              >
                                {copiedKey === `tot-${idx}` ? <span className="text-emerald-600">✓ {tutarFormatted}</span> : `${tutarFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td className="py-2 px-2 text-center no-print">
                                <button
                                  type="button"
                                  onClick={() => copyText(`${trLineDesc}\t${adet}\t${fiyatFormatted}\t${tutarFormatted}`, `row-${idx}`)}
                                  className={`px-2.5 py-1 rounded text-[10px] font-bold transition-colors ${
                                    copiedKey === `row-${idx}`
                                      ? 'bg-emerald-600 text-white'
                                      : 'bg-slate-800 hover:bg-slate-700 text-white'
                                  }`}
                                >
                                  {copiedKey === `row-${idx}` ? '✓ Satır' : 'Satırı Kopyala'}
                                </button>
                              </td>
                            </tr>
                          );

                        {/* Ek Maliyet Satırları (Freight, Pattern vb.) */}
                        {extraCharges.map((ec, eIdx) => {
                          const rowIdx = invoiceItems.length + eIdx;

                          const fiyat = parseFloat(String(ec.fiyat ?? 0).replace(',', '.')) || 0;
                          const tutar = parseFloat(String(ec.tutar ?? 0).replace(',', '.')) || (adet * fiyat) || 0;
                          const fiyatFormatted = fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                          const tutarFormatted = tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                          return (
                            <tr key={`tr-ec-${eIdx}`} className="bg-indigo-50/40 hover:bg-indigo-50 transition-colors">
                              <td className="py-2 px-2 text-center font-bold text-slate-600 border-r border-slate-300">{rowIdx + 1}</td>
                              <td className="py-2 px-3 font-bold text-indigo-950 border-r border-slate-300">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="select-all">{ec.description}</span>
                                  <button
                                    type="button"
                                    onClick={() => copyText(ec.description, `ec-desc-${eIdx}`)}
                                    className="no-print shrink-0 px-2 py-0.5 rounded text-[10px] font-bold border bg-white hover:bg-slate-100 text-indigo-700 border-slate-300"
                                  >
                                    {copiedKey === `ec-desc-${eIdx}` ? '✓ Kopyalandı' : 'Açıklamayı Kopyala'}
                                  </button>
                                </div>
                              </td>
                              <td
                                onClick={() => copyText(adet, `ec-qty-${eIdx}`)}
                                className="py-2 px-2.5 text-right font-extrabold text-black border-r border-slate-300 cursor-pointer hover:bg-indigo-100"
                              >
                                {copiedKey === `ec-qty-${eIdx}` ? <span className="text-emerald-600">✓ {adet}</span> : `${adet} ADET`}
                              </td>
                              <td
                                onClick={() => copyText(fiyatFormatted, `ec-price-${eIdx}`)}
                                className="py-2 px-2.5 text-right font-semibold text-black border-r border-slate-300 cursor-pointer hover:bg-indigo-100 whitespace-nowrap"
                              >
                                {copiedKey === `ec-price-${eIdx}` ? <span className="text-emerald-600 font-bold">✓ {fiyatFormatted}</span> : `${fiyatFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td
                                onClick={() => copyText(tutarFormatted, `ec-tot-${eIdx}`)}
                                className="py-2 px-2.5 text-right font-extrabold text-[#a80000] border-r border-slate-300 cursor-pointer hover:bg-indigo-100 whitespace-nowrap"
                              >
                                {copiedKey === `ec-tot-${eIdx}` ? <span className="text-emerald-600">✓ {tutarFormatted}</span> : `${tutarFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td className="py-2 px-2 text-center no-print">
                                <button
                                  type="button"
                                  onClick={() => copyText(`${ec.description}\t${adet}\t${fiyatFormatted}\t${tutarFormatted}`, `ec-row-${eIdx}`)}
                                  className="px-2.5 py-1 rounded text-[10px] font-bold bg-slate-800 hover:bg-slate-700 text-white"
                                >
                                  {copiedKey === `ec-row-${eIdx}` ? '✓ Satır' : 'Satırı Kopyala'}
                                </button>
                              </td>
                            </tr>
                          );
                        })}

                        {/* 3. ABD / GÜMRÜK TAX DUTY SATIRI */}
                        {hasDutyFee && dutyFeeAmount > 0 && (() => {
                          const dutyRowIdx = invoiceItems.length + extraCharges.length + 1;
                          const dutyFormatted = dutyFeeAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                          return (
                            <tr className="bg-rose-50/60 hover:bg-rose-100/60 transition-colors">
                              <td className="py-2 px-2 text-center font-bold text-rose-800 border-r border-slate-300">{dutyRowIdx}</td>
                              <td className="py-2 px-3 font-black text-[#a80000] border-r border-slate-300">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="select-all">{trDutyLineDesc}</span>
                                  <button
                                    type="button"
                                    onClick={() => copyText(trDutyLineDesc, 'duty-desc')}
                                    className={`no-print shrink-0 px-2 py-0.5 rounded text-[10px] font-bold border transition-colors ${
                                      copiedKey === 'duty-desc'
                                        ? 'bg-emerald-600 text-white border-emerald-600'
                                        : 'bg-white hover:bg-slate-100 text-rose-700 border-rose-300'
                                    }`}
                                  >
                                    {copiedKey === 'duty-desc' ? '✓ Kopyalandı' : 'Açıklamayı Kopyala'}
                                  </button>
                                </div>
                              </td>
                              <td
                                onClick={() => copyText(1, 'duty-qty')}
                                className="py-2 px-2.5 text-right font-extrabold text-black border-r border-slate-300 cursor-pointer hover:bg-rose-100"
                              >
                                {copiedKey === 'duty-qty' ? <span className="text-emerald-600">✓ 1</span> : '1 ADET'}
                              </td>
                              <td
                                onClick={() => copyText(dutyFormatted, 'duty-price')}
                                className="py-2 px-2.5 text-right font-semibold text-black border-r border-slate-300 cursor-pointer hover:bg-rose-100 whitespace-nowrap"
                              >
                                {copiedKey === 'duty-price' ? <span className="text-emerald-600 font-bold">✓ {dutyFormatted}</span> : `${dutyFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td
                                onClick={() => copyText(dutyFormatted, 'duty-tot')}
                                className="py-2 px-2.5 text-right font-extrabold text-[#a80000] border-r border-slate-300 cursor-pointer hover:bg-rose-100 whitespace-nowrap"
                              >
                                {copiedKey === 'duty-tot' ? <span className="text-emerald-600">✓ {dutyFormatted}</span> : `${dutyFormatted} ${getSymbol(currency)}`}
                              </td>
                              <td className="py-2 px-2 text-center no-print">
                                <button
                                  type="button"
                                  onClick={() => copyText(`${trDutyLineDesc}\t1\t${dutyFormatted}\t${dutyFormatted}`, 'duty-row')}
                                  className={`px-2.5 py-1 rounded text-[10px] font-bold transition-colors ${
                                    copiedKey === 'duty-row'
                                      ? 'bg-emerald-600 text-white'
                                      : 'bg-[#a80000] hover:bg-rose-800 text-white'
                                  }`}
                                >
                                  {copiedKey === 'duty-row' ? '✓ Satır' : 'Satırı Kopyala'}
                                </button>
                              </td>
                            </tr>
                          );
                        })()}
                      </tbody>
                      <tfoot className="bg-slate-900 text-white font-extrabold text-xs">
                        <tr>
                          <td colSpan={2} className="py-2.5 px-3 text-right uppercase tracking-wider text-slate-300 border-r border-slate-700">
                            TR e-FATURA GENEL TOPLAM:
                          </td>
                          <td className="py-2.5 px-2.5 text-right text-amber-400 border-r border-slate-700 whitespace-nowrap">
                            {totals?.totalAdet?.toLocaleString('tr-TR')} ADET
                          </td>
                          <td className="py-2.5 px-2.5 border-r border-slate-700"></td>
                          <td className="py-2.5 px-2.5 text-right text-emerald-400 border-r border-slate-700 whitespace-nowrap">
                            {finalInvoiceAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {getSymbol(currency)}
                          </td>
                          <td className="no-print"></td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    function PrintModal({ checklist, exporter, customer, transporter, onClose }) {
      const items = checklist?.items || [];
      const processedRows = useMemo(() => processTableRows(items), [items]);
      const totals = useMemo(() => calculateTotals(items, processedRows), [items, processedRows]);
      const currency = checklist?.currency || 'EUR';
      const formattedDate = formatDateTR(checklist?.checklistDate || (checklist?.createdAt ? new Date(checklist.createdAt).toLocaleDateString('tr-TR') : ''));
      const cleanDrawingNo = (str) => String(str || '').replace(/[-–—\s]+$/, '').trim();
      const isCompact = items.length > 16;
      const cellPad = isCompact ? 'py-[2px] px-1.5 text-[9.5px]' : 'py-1 px-2 text-[10.5px]';

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto print-modal-wrapper">
          {/* Sadece bu modal açıkken yazdırma yönünü A4 Yatay (Landscape) yapar */}
          <style>{`@media print { @page { size: A4 landscape !important; margin: 4mm !important; } }`}</style>
          <div className="bg-white rounded-xl shadow-2xl max-w-[1200px] w-full p-6 max-h-[92vh] overflow-y-auto print-container print-modal-inner">
            <div className="no-print flex justify-between items-center border-b pb-4 mb-4">
              <div className="flex items-center gap-2">
                <Printer className="text-emerald-600" />
                <h3 className="text-lg font-bold text-slate-800">Yazdırma Önizleme (Çeki Listesi / Packing List - A4 Yatay)</h3>
              </div>
              <div className="flex gap-2">
                <button type="button" onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-bold flex items-center shadow-md">
                  <Printer size={18} className="mr-2" /> Yazdır
                </button>
                <button type="button" onClick={onClose} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium">Kapat</button>
              </div>
            </div>

            <div className="text-black bg-white p-1 print-page-landscape flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center border-b border-slate-300 pb-2 mb-2.5">
                  <div className="flex items-center gap-3">
                    {exporter?.logo && <img src={exporter.logo} alt="Exporter Logo" className="h-14 max-w-[180px] object-contain rounded-lg border border-slate-200 p-0.5" />}
                    <div>
                      <h1 className="text-lg font-black uppercase tracking-tight text-black">{exporter?.name || 'İHRACATÇI FİRMA UNVANI'}</h1>
                      <p className="text-[10px] text-slate-800">{exporter?.address}</p>
                      <p className="text-[10px] text-slate-700">
                        {exporter?.phone ? `Tel: ${exporter.phone}` : ''} {exporter?.email ? `| Mail: ${exporter.email}` : ''} | <strong className="text-[#0047b3]">VAT ID:</strong> {exporter?.vatNo || '-'} | <strong className="text-[#0047b3]">DUNS:</strong> {exporter?.dunsNumber || '-'} | <strong className="text-[#0047b3]">EORI:</strong> {exporter?.eoriNumber || '-'}
                      </p>
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="inline-block bg-[#a80000] text-white px-4 py-1 rounded-lg text-xs font-extrabold tracking-widest uppercase mb-1 shadow-sm">
                      PACKING LIST / ÇEKİ LİSTESİ
                    </div>
                    <p className="text-[10px] text-slate-800">
                      <strong>Fatura No:</strong> <span className="text-black font-black">{checklist?.invoiceNumber || '-'}</span> | <strong>Tarih:</strong> <span className="font-bold">{formattedDate || '-'}</span> | <strong>Döviz:</strong> <span className="font-bold text-black">{currency}</span>
                    </p>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2.5 text-[10px] mb-2.5">
                  <div className="border border-slate-300 p-2.5 rounded-xl bg-white flex justify-between items-start">
                    <div>
                      <p className="font-extrabold text-[#0047b3] border-b border-slate-200 pb-0.5 mb-1 uppercase tracking-wide text-[9.5px]">
                        CONSIGNEE / MÜŞTERİ BİLGİLERİ
                      </p>
                      <p className="font-black text-xs text-black">{customer?.name || '-'}</p>
                      <p className="text-slate-800 leading-tight mt-0.5">{customer?.address || '-'}</p>
                      <p className="text-slate-800 mt-0.5"><strong>Ülke:</strong> {customer?.country || '-'} | <strong>VAT:</strong> {customer?.vatNo || '-'}</p>
                    </div>
                    {customer?.logo && <img src={customer.logo} alt="Customer Logo" className="h-10 max-w-[100px] object-contain ml-2" />}
                  </div>

                  <div className="border border-slate-300 p-2.5 rounded-xl bg-white">
                    <p className="font-extrabold text-[#0047b3] border-b border-slate-200 pb-0.5 mb-1 uppercase tracking-wide text-[9.5px]">
                      CARRIER / NAKLİYECİ BİLGİLERİ
                    </p>
                    <p className="font-black text-xs text-black">{transporter?.name || '-'}</p>
                    <p className="text-slate-800 leading-tight mt-0.5">{transporter?.address || '-'}</p>
                    <p className="text-slate-800 mt-0.5"><strong>Teslim Şekli:</strong> {transporter?.deliveryTerm || '-'} | <strong>Taşıma:</strong> {transporter?.transportType || '-'}</p>
                  </div>

                  <div className="border border-slate-300 p-2.5 rounded-xl bg-white">
                    <p className="font-extrabold text-[#0047b3] border-b border-slate-200 pb-0.5 mb-1 uppercase tracking-wide text-[9.5px]">
                      SHIPMENT / SEVK DETAYLARI
                    </p>
                    <p className="text-black leading-tight"><strong>Sevk Adresi:</strong> <span className="text-[#0047b3] font-bold">{checklist?.deliveryAddress || customer?.address || '-'}</span></p>
                    <p className="text-black mt-1">
                      <strong>Kalem:</strong> {items.length} | <strong>Palet:</strong> {totals?.paletCount || 0} Palet | <strong>Brüt:</strong> {totals?.totalBrutKg ? totals.totalBrutKg.toLocaleString('tr-TR') : 0} KG
                    </p>
                    {(checklist?.shipmentNo || checklist?.bookingNo || checklist?.containerNo) && (
                      <div className="mt-1 pt-1 border-t border-slate-200 flex flex-wrap gap-2 text-[9.5px]">
                        {checklist?.shipmentNo && <span className="font-black text-[#a80000]">{checklist.shipmentNo}</span>}
                        {checklist?.bookingNo && <span className="font-bold text-black">{checklist.bookingNo}</span>}
                        {checklist?.containerNo && <span className="font-extrabold text-[#0047b3]">📦 {checklist.containerNo}</span>}
                      </div>
                    )}
                  </div>
                </div>

                <div className="border border-slate-300 rounded-xl overflow-hidden mb-2">
                  <table className="w-full text-left border-collapse" style={{tableLayout: 'fixed'}}>
                    <colgroup>
                      <col className="w-[4%]" />
                      <col className="w-[8.5%]" />
                      <col className="w-[13.5%]" />
                      <col className="w-[11.5%]" />
                      <col className="w-[14.5%]" />
                      <col className="w-[4.5%]" />
                      <col className="w-[8.5%]" />
                      <col className="w-[9.5%]" />
                      <col className="w-[6%]" />
                      <col className="w-[6%]" />
                      <col className="w-[5.5%]" />
                      <col className="w-[8%]" />
                    </colgroup>
                    <thead>
                      <tr className="bg-[#a80000] text-white font-bold text-[9.5px] uppercase tracking-wider">
                        <th className="border-r border-white/30 py-1.5 px-1 text-center">Sıra</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5">ADS İş No</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5">Parça Adı</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5">Sip. Ref No</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5">Pos / Resim</th>
                        <th className="border-r border-white/30 py-1.5 px-1 text-right">Adet</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5 text-right">Fiyat ({currency})</th>
                        <th className="border-r border-white/30 py-1.5 px-1.5 text-right">Tutar ({currency})</th>
                        <th className="border-r border-white/30 py-1.5 px-1 text-right">Net KG</th>
                        <th className="border-r border-white/30 py-1.5 px-1 text-right">Brüt KG</th>
                        <th className="border-r border-white/30 py-1.5 px-1 text-center">Palet No</th>
                        <th className="py-1.5 px-1.5">Palet Ebatları</th>
                      </tr>
                    </thead>
                    <tbody>
                      {processedRows.map((rowInfo, idx) => {
                        const item = rowInfo.item;
                        const adet = parseFloat(item.adet) || 0;
                        const fiyat = parseFloat(item.fiyat) || 0;
                        const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
                        const isEven = idx % 2 === 1;
                        const rowBg = rowInfo.isMerged ? rowInfo.groupColor : (isEven ? 'bg-[#eef2f7]' : 'bg-white');

                        return (
                          <tr key={idx} className={`${rowBg} border-b border-slate-300`}>
                            <td className={`border-r border-slate-300 ${cellPad} text-center font-medium`}>{item.siraNo || idx + 1}</td>
                            <td className={`border-r border-slate-300 ${cellPad} font-bold text-[#003d99] whitespace-nowrap`}>{item.adsIsNo || '-'}</td>
                            <td className={`border-r border-slate-300 ${cellPad} font-bold text-black break-words leading-tight`}>{item.parcaAdi || '-'}</td>
                            <td className={`border-r border-slate-300 ${cellPad} font-mono text-slate-900 break-words leading-tight ${String(item.sipRefNo || '').length > 16 ? 'text-[8.5px] tracking-tighter' : ''}`}>{item.sipRefNo || '-'}</td>
                            <td className={`border-r border-slate-300 ${cellPad} text-slate-900 break-words leading-tight`}>
                              {[item.posNo, cleanDrawingNo(item.resimNo)].filter(Boolean).join(' / ') || '-'}
                            </td>
                            <td className={`border-r border-slate-300 ${cellPad} text-right font-extrabold text-black`}>{item.adet || '-'}</td>
                            <td className={`border-r border-slate-300 ${cellPad} text-right text-slate-900`}>
                              {fiyat ? fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                            </td>
                            <td className={`border-r border-slate-300 ${cellPad} text-right font-extrabold text-black`}>
                              {tutar ? tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                            </td>
                            <td className={`border-r border-slate-300 ${cellPad} text-right font-semibold text-black`}>{item.netKg || '-'}</td>

                            {rowInfo.isFirstInGroup && (
                              <>
                                <td rowSpan={rowInfo.rowSpan} className={`border-r border-slate-300 ${cellPad} text-right font-extrabold text-black align-middle ${rowBg}`}>
                                  {item.brutKg || '-'}
                                </td>
                                <td rowSpan={rowInfo.rowSpan} className={`border-r border-slate-300 ${cellPad} text-center font-extrabold text-[#003d99] align-middle ${rowBg}`}>
                                  {item.paletNo || '-'}
                                </td>
                                <td rowSpan={rowInfo.rowSpan} className={`${cellPad} font-semibold text-black align-middle ${rowBg}`}>
                                  {item.paletEbatlari || '-'}
                                </td>
                              </>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>

                    <tfoot className="bg-[#eef2f7] text-black font-bold border-t border-slate-300 text-[10px]">
                      <tr>
                        <td colSpan={5} className="border-r border-slate-300 py-1.5 px-2 text-right uppercase tracking-wider font-extrabold text-[#003d99]">
                          GENEL TOPLAM / TOTALS:
                        </td>
                        <td className="border-r border-slate-300 py-1.5 px-1 text-right font-extrabold text-black">
                          {totals?.totalAdet ? totals.totalAdet.toLocaleString('tr-TR') : 0}
                        </td>
                        <td className="border-r border-slate-300 py-1.5 px-1"></td>
                        <td className="border-r border-slate-300 py-1.5 px-1.5 text-right font-extrabold text-[#a80000] whitespace-nowrap">
                          {totals?.totalTutar ? totals.totalTutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : 0} {currency}
                        </td>
                        <td className="border-r border-slate-300 py-1.5 px-1 text-right font-extrabold text-black whitespace-nowrap">
                          {totals?.totalNetKg ? totals.totalNetKg.toLocaleString('tr-TR') : 0} KG
                        </td>
                        <td className="border-r border-slate-300 py-1.5 px-1 text-right font-extrabold text-black whitespace-nowrap">
                          {totals?.totalBrutKg ? totals.totalBrutKg.toLocaleString('tr-TR') : 0} KG
                        </td>
                        <td className="border-r border-slate-300 py-1.5 px-1 text-center font-extrabold text-[#003d99] whitespace-nowrap">
                          {totals?.paletCount || 0} Palet
                        </td>
                        <td className="py-1.5 px-1"></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              {/* ALT 3 YETKİLİ KUTUSU */}
              <div className="grid grid-cols-3 gap-5 text-[10px] text-center pt-1 relative">
                <div className="border border-slate-300 rounded-xl bg-white overflow-hidden min-h-[82px] flex flex-col justify-between">
                  <div className="bg-[#eef2f7] border-b border-slate-300 py-1 px-2">
                    <span className="font-extrabold text-black">SON İŞLEM ŞEFİ</span> <span className="italic font-medium text-slate-700">/ FETTLING SHOP CHIEF</span>
                  </div>
                  <div className="font-bold text-black text-[11px] pt-1">İBRAHİM ALKAN</div>
                  <p className="text-[9px] text-slate-400 border-t border-dashed border-slate-300 w-3/4 mx-auto py-1 mt-4">İmza / Signature</p>
                </div>

                <div className="border border-slate-300 rounded-xl bg-white overflow-hidden min-h-[82px] flex flex-col justify-between">
                  <div className="bg-[#eef2f7] border-b border-slate-300 py-1 px-2">
                    <span className="font-extrabold text-black">ÜRETİM KOORD.</span> <span className="italic font-medium text-slate-700">/ PRODUCTION COORD.</span>
                  </div>
                  <div className="font-bold text-black text-[11px] pt-1">HAYKAN ENGİN</div>
                  <p className="text-[9px] text-slate-400 border-t border-dashed border-slate-300 w-3/4 mx-auto py-1 mt-4">İmza / Signature</p>
                </div>

                <div className="border border-slate-300 rounded-xl bg-white overflow-hidden min-h-[82px] flex flex-col justify-between">
                  <div className="bg-[#eef2f7] border-b border-slate-300 py-1 px-2">
                    <span className="font-extrabold text-black">KALİTE MÜD.</span> <span className="italic font-medium text-slate-700">/ QUALITY MANAGER</span>
                  </div>
                  <div className="font-bold text-black text-[11px] pt-1">METE HAN BOYDAK</div>
                  <p className="text-[9px] text-slate-400 border-t border-dashed border-slate-300 w-3/4 mx-auto py-1 mt-4">İmza / Signature</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ExportManagementApp />);
  </script>
</body>
</html>
