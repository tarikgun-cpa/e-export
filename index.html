                      <button type="button" onClick={() => onDelete(item.id)} className="text-red-500 p-1" title="Sil"><Trash2 size={16} /></button>
                    </td>
                  </tr>
                )) : <tr><td colSpan={6} className="p-8 text-center text-slate-500">Nakliyeci kaydı bulunmuyor. Sağ üstten yeni nakliyeci ekleyebilirsiniz.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ChecklistManager({ data, customers, transporters, onCreateNew, onEdit, onPrint, onCreateExportSet, onDelete }) {
      const getCustomerName = (id) => customers.find(c => c.id === id)?.name || 'Bilinmiyor';
      const getTransporterName = (id) => transporters.find(t => t.id === id)?.name || '-';

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
          <div className="p-5 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
            <h3 className="text-lg font-semibold text-slate-800 flex items-center"><FileSpreadsheet className="w-5 h-5 mr-2 text-blue-500" /> Kayıtlı Evraklar / Check Listler</h3>
            <button type="button" onClick={onCreateNew} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-medium flex items-center shadow-sm text-sm"><FileText size={18} className="mr-2" /> Yeni Evrak/Check List Oluştur</button>
          </div>
          <div className="overflow-auto flex-1">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-sm sticky top-0 shadow-sm">
                  <th className="p-4 font-semibold">Fatura No / Tarih</th>
                  <th className="p-4 font-semibold">Müşteri</th>
                  <th className="p-4 font-semibold">Nakliyeci</th>
                  <th className="p-4 font-semibold">Döviz</th>
                  <th className="p-4 font-semibold">Kalem</th>
                  <th className="p-4 font-semibold w-64 text-center">İşlem</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 text-sm">
                {data.length > 0 ? data.map(item => (
                  <tr key={item.id} className="hover:bg-slate-50">
                    <td className="p-4 font-bold text-blue-600">
                      {item.invoiceNumber}
                      <div className="text-xs text-slate-400 font-normal">{item.checklistDate || new Date(item.createdAt).toLocaleDateString('tr-TR')}</div>
                    </td>
                    <td className="p-4 text-slate-700">{getCustomerName(item.customerId)}</td>
                    <td className="p-4 text-slate-700">{getTransporterName(item.transporterId)}</td>
                    <td className="p-4 text-slate-700 font-bold">{item.currency || 'EUR'}</td>
                    <td className="p-4 text-slate-600"><span className="bg-slate-200 text-slate-700 py-1 px-3 rounded-full text-xs font-semibold">{item.items?.length || 0} Kalem</span></td>
                    <td className="p-4 text-center">
                      <div className="flex justify-center items-center gap-2">
                        <button type="button" onClick={() => onCreateExportSet(item)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-xs font-bold flex items-center shadow-sm" title="İhracat Seti Oluştur"><Layers size={14} className="mr-1" /> İhracat Seti</button>
                        <button type="button" onClick={() => onPrint(item)} className="text-emerald-600 p-1 flex items-center" title="Sadece Packing List"><Printer size={18} /></button>
                        <button type="button" onClick={() => onEdit(item)} className="text-blue-600 p-1 flex items-center" title="Düzenle"><Edit size={18} /></button>
                        <button type="button" onClick={() => onDelete(item.id)} className="text-red-500 p-1 flex items-center" title="Sil"><Trash2 size={16} /></button>
                      </div>
                    </td>
                  </tr>
                )) : <tr><td colSpan={6} className="p-12 text-center text-slate-500 text-lg">Bu ihracatçıya ait evrak/checklist bulunamadı.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ChecklistForm({ exporter, customers, transporters, initialData, onBack, onSaveChecklist }) {
      const [invoiceNumber, setInvoiceNumber] = useState(initialData?.invoiceNumber || '');
      const [checklistDate, setChecklistDate] = useState(initialData?.checklistDate || new Date().toISOString().split('T')[0]);
      const [deliveryDate, setDeliveryDate] = useState(initialData?.deliveryDate || '');
      const [customerId, setCustomerId] = useState(initialData?.customerId || '');
      const [transporterId, setTransporterId] = useState(initialData?.transporterId || '');
      const [currency, setCurrency] = useState(initialData?.currency || 'EUR');
      const [deliveryAddress, setDeliveryAddress] = useState(initialData?.deliveryAddress || '');
      const [selectedBankId, setSelectedBankId] = useState(initialData?.selectedBankId || '');
      const [selectedInsuranceId, setSelectedInsuranceId] = useState(initialData?.selectedInsuranceId || '');
      const [hasDownPayment, setHasDownPayment] = useState(initialData?.hasDownPayment || false);
      const [downPaymentRate, setDownPaymentRate] = useState(initialData?.downPaymentRate ?? 30);
      const [isFreeOfCharge, setIsFreeOfCharge] = useState(initialData?.isFreeOfCharge || false);
      const [items, setItems] = useState(initialData?.items || []);
      const [isExcelLoading, setIsExcelLoading] = useState(false);

      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(50);

      const [selectedIds, setSelectedIds] = useState([]);
      const [groupPalletNo, setGroupPalletNo] = useState('');
      const [groupPalletEbat, setGroupPalletEbat] = useState('');
      const [groupBrutKg, setGroupBrutKg] = useState('');

      const processedRows = useMemo(() => processTableRows(items), [items]);
      const totals = useMemo(() => calculateTotals(items, processedRows), [items, processedRows]);

      const paginatedRows = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedRows.slice(start, start + pageSize);
      }, [processedRows, currentPage, pageSize]);

      const totalPages = Math.ceil(processedRows.length / pageSize) || 1;

      const columns = [
        { key: 'siraNo', label: 'Sıra No', width: 'w-16' },
        { key: 'adsIsNo', label: 'ADS İş No', width: 'w-24' },
        { key: 'parcaAdi', label: 'Parça Adı', width: 'w-48' },
        { key: 'sipRefNo', label: 'Sip Ref No', width: 'w-28' },
        { key: 'posNo', label: 'Pos No', width: 'w-20' },
        { key: 'resimNo', label: 'Resim No', width: 'w-32' },
        { key: 'fiyat', label: 'Fiyat', width: 'w-24' },
        { key: 'adet', label: 'Adet', width: 'w-20' },
        { key: 'tutar', label: 'Tutar', width: 'w-28' },
        { key: 'netKg', label: 'Net KG', width: 'w-24' },
        { key: 'brutKg', label: 'Brüt KG', width: 'w-24' },
        { key: 'paletNo', label: 'Palet No', width: 'w-24' },
        { key: 'paletEbatlari', label: 'Palet Ebatları', width: 'w-32' },
      ];

      const handleDownloadTemplate = () => {
        if (!window.XLSX) {
          alert("XLSX modülü henüz yüklenmedi.");
          return;
        }

        const sampleData = [
          ["SIRA NO", "ADS İŞ NO", "PARÇA ADI", "SİP.REF NO", "POS", "RESİM NO", "FİYAT", "ADET", "TUTAR", "NET KG", "BRÜT KG", "PALET NO", "PALET EBATLARI"],
          [1, "26/0147-2", "Bowl Cover", "4500285283-20", 20, "D 2903.184.00 -", 4091.22, 2, 8182.44, 532, 560, "1/24", "80x160x50"],
          [2, "26/0147-2", "Bowl Cover", "4500285283-20", 20, "D 2903.184.00 -", 4091.22, 2, 8182.44, 532, 560, "2/24", "80x160x50"]
        ];

        const ws = window.XLSX.utils.aoa_to_sheet(sampleData);
        ws['!cols'] = Array(13).fill({ wch: 15 });

        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "Ceklist_Sablonu");
        window.XLSX.writeFile(wb, "Ornek_Ceklist_Sablonu.xlsx");
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!window.XLSX) {
          alert("XLSX okuma kütüphanesi hazır değil. Sayfayı yenileyip tekrar deneyin.");
          return;
        }

        const inputEl = e.target;
        setIsExcelLoading(true);

        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const dataBuffer = new Uint8Array(evt.target.result);
              const wb = window.XLSX.read(dataBuffer, { 
                type: 'array', 
                cellFormula: false, 
                cellHTML: false, 
                cellText: true 
              });

              if (!wb.SheetNames || wb.SheetNames.length === 0) {
                alert("Excel dosyasında çalışma sayfası bulunamadı.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];

              if (!ws || !ws['!ref']) {
                alert("Seçilen çalışma sayfası boş.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const range = window.XLSX.utils.decode_range(ws['!ref']);
              if (range.e.r > 5000) range.e.r = 5000;

              const rawData = window.XLSX.utils.sheet_to_json(ws, { 
                header: 1, 
                blankrows: false,
                range: range 
              });

              if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
                alert("Excel dosyasında okunabilir veri bulunamadı.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const normalizeText = (str) => {
                return String(str || '')
                  .replace(/İ/g, 'i')
                  .replace(/I/g, 'ı')
                  .replace(/i̇/g, 'i')
                  .toLowerCase()
                  .trim();
              };

              const parseTurkishNumber = (val) => {
                if (val === null || val === undefined || val === '') return '';
                if (typeof val === 'number') return isNaN(val) ? '' : val;
                let str = String(val).replace(/\s/g, '').trim();
                if (str.includes(',') && str.includes('.')) {
                  str = str.replace(/\./g, '').replace(',', '.');
                } else if (str.includes(',')) {
                  str = str.replace(',', '.');
                }
                const num = parseFloat(str);
                return isNaN(num) ? String(val).trim() : num;
              };

              let headerRowIndex = -1;
              const colMap = {};

              const keywords = {
                siraNo: ['sıra no', 'sira no', 's.no', 'sno', 'item no', 'sıra', 'sira'],
                adsIsNo: ['ads iş no', 'ads is no', 'anadolu work no', 'work no', 'iş no', 'is no'],
                parcaAdi: ['parça adı', 'parca adi', 'part name', 'description', 'açıklama', 'aciklama', 'malzeme', 'ürün'],
                sipRefNo: ['sip.ref no', 'sip ref no', 'order ref. no', 'order ref', 'po no', 'sip ref'],
                posNo: ['pos no', 'pos', 'poz'],
                resimNo: ['resim no', 'drawing no', 'çizim no', 'resim'],
                modelNo: ['model no', 'pattern no', 'model'],
                fiyat: ['fiyat', 'price', 'unit price', 'birim fiyat'],
                adet: ['adet', 'qty', 'quantity', 'miktar', 'pcs'],
                tutar: ['tutar', 'amount', 'toplam tutar'],
                dokumKg: ['döküm kg', 'dokum kg', 'casting weight'],
                netKg: ['net kg', 'net weight', 'net'],
                brutKg: ['brüt kg', 'gross weight', 'brut kg', 'brüt', 'brut'],
                sarjNo: ['şarj no', 'sarj no', 'heat no', 'charge no'],
                paletNo: ['palet no', 'pallet no', 'koli no', 'palet'],
                paletEbatlari: ['palet ebatları', 'palet ebatlari', 'pallet dimensions', 'ebat', 'dimension', 'ölçü']
              };

              for (let r = 0; r < Math.min(30, rawData.length); r++) {
                const row = rawData[r];
                if (!row || !Array.isArray(row)) continue;

                let matchCount = 0;
                const tempMap = {};

                row.forEach((cellVal, colIdx) => {
                  const text = normalizeText(cellVal);
                  if (!text) return;

                  for (const [key, wordList] of Object.entries(keywords)) {
                    if (tempMap[key] === undefined) {
                      if (wordList.some(w => text === w) || wordList.some(w => w.length > 2 && text.includes(w))) {
                        tempMap[key] = colIdx;
                        matchCount++;
                        break;
                      }
                    }
                  }
                });

                if (matchCount >= 2) {
                  headerRowIndex = r;
                  Object.assign(colMap, tempMap);
                  break;
                }
              }

              const defaultIndices = {
                siraNo: 0, adsIsNo: 1, parcaAdi: 2, sipRefNo: 3, posNo: 4, resimNo: 5,
                fiyat: 6, adet: 7, tutar: 8, netKg: 9, brutKg: 10, paletNo: 11, paletEbatlari: 12
              };

              Object.keys(defaultIndices).forEach(key => {
                if (colMap[key] === undefined) {
                  colMap[key] = defaultIndices[key];
                }
              });

              const startRow = headerRowIndex !== -1 ? headerRowIndex + 1 : 0;
              const newItems = [];

              const isHeaderSubrow = (str) => {
                const s = normalizeText(str);
                if (!s) return false;
                return (
                  s === 'part name' || s === 'parça adı' || s === 'parca adi' || 
                  s === 'description' || s === 'item no' || s === 'anadolu work no' || 
                  s === 'order ref. no' || s === 'drawing no' || s === 'pattern no' || 
                  s === 'qty' || s === 'quantity' || s === 'casting weight' || 
                  s === 'net weight' || s === 'gross weight' || s === 'heat no' || 
                  s === 'pallet no' || s === 'pallet dimensions' ||
                  s.startsWith('(part name') || s.startsWith('(item no') || s.startsWith('(order ref')
                );
              };

              let lastPalletNo = '';
              let lastPalletEbatlari = '';
              let lastBrutKg = '';

              for (let i = startRow; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || !Array.isArray(row) || row.length === 0) continue;

                const safeGet = (key) => {
                  const idx = colMap[key];
                  if (idx === undefined || idx < 0 || idx >= row.length) return '';
                  const val = row[idx];
                  return (val === null || val === undefined) ? '' : String(val).trim();
                };

                const siraNoRaw = safeGet('siraNo');
                const parcaAdi = safeGet('parcaAdi');
                const fiyatVal = safeGet('fiyat');

                const c0 = siraNoRaw.toUpperCase();
                const cFiyat = fiyatVal.toUpperCase();

                if (
                  c0.includes('TOPLAM') || c0.includes('TOTAL') || 
                  cFiyat.includes('TOPLAM') || cFiyat.includes('TOTAL') || 
                  c0.includes('YALNIZ') || c0.includes('ONLY') || 
                  c0.includes('ISTIFLENEMEZ')
                ) {
                  break;
                }

                if (isHeaderSubrow(parcaAdi) || isHeaderSubrow(siraNoRaw)) {
                  continue;
                }

                const adetVal = safeGet('adet');
                const posNo = safeGet('posNo');

                if (!parcaAdi && !adetVal && !posNo && !siraNoRaw) continue;

                let pNo = safeGet('paletNo');
                let pEbat = safeGet('paletEbatlari');
                let bKg = safeGet('brutKg');

                if (pNo !== '') {
                  lastPalletNo = pNo;
                  lastPalletEbatlari = pEbat;
                  lastBrutKg = bKg;
                } else if (lastPalletNo !== '' && pEbat !== '') {
                  pNo = lastPalletNo;
                  if (!pEbat) pEbat = lastPalletEbatlari;
                  if (!bKg) bKg = lastBrutKg;
                }

                const parsedAdet = parseTurkishNumber(adetVal);
                const parsedFiyat = parseTurkishNumber(fiyatVal);
                const rawTutar = safeGet('tutar');
                let parsedTutar = parseTurkishNumber(rawTutar);
                if (!parsedTutar && typeof parsedAdet === 'number' && typeof parsedFiyat === 'number') {
                  parsedTutar = (parsedAdet * parsedFiyat).toFixed(2);
                }

                newItems.push({
                  id: generateId(),
                  siraNo: siraNoRaw || String(newItems.length + 1),
                  adsIsNo: safeGet('adsIsNo'),
                  parcaAdi: parcaAdi,
                  sipRefNo: safeGet('sipRefNo'),
                  posNo: safeGet('posNo'),
                  resimNo: safeGet('resimNo'),
                  modelNo: safeGet('modelNo'),
                  fiyat: parsedFiyat,
                  adet: parsedAdet,
                  tutar: parsedTutar,
                  dokumKg: parseTurkishNumber(safeGet('dokumKg')),
                  netKg: parseTurkishNumber(safeGet('netKg')),
                  brutKg: parseTurkishNumber(bKg),
                  sarjNo: safeGet('sarjNo'),
                  paletNo: pNo,
                  paletEbatlari: pEbat
                });
              }

              if (newItems.length === 0) {
                alert("Excel dosyasından geçerli bir veri satırı okunamadı. Lütfen dosyanızı kontrol edin.");
              } else {
                setItems(newItems);
              }

            } catch (err) {
              console.error("Excel Ayrıştırma Hatası:", err);
              alert("Excel dosyası okunurken bir hata oluştu: " + err.message);
            } finally {
              setIsExcelLoading(false);
              if (inputEl) inputEl.value = "";
            }
          };

          reader.onerror = () => {
            alert("Dosya yükleme hatası!");
            setIsExcelLoading(false);
            if (inputEl) inputEl.value = "";
          };

          reader.readAsArrayBuffer(file);
        }, 50);
      };

      const handleAddRow = () => {
        const newRow = columns.reduce((acc, col) => ({ ...acc, [col.key]: '' }), { id: generateId() });
        setItems([...items, newRow]);
      };

      const handleRemoveRow = (id) => {
        setItems(items.filter(i => i.id !== id));
        setSelectedIds(selectedIds.filter(i => i !== id));
      };

      const handleItemChange = (index, key, value) => {
        setItems(prevItems => {
          const newItems = [...prevItems];
          const currentRow = newItems[index];
          const currentPallet = (currentRow.paletNo || '').trim();
          const isMergedKey = (key === 'brutKg' || key === 'paletNo' || key === 'paletEbatlari');

          if (isMergedKey && currentPallet !== '') {
            for (let k = 0; k < newItems.length; k++) {
              if ((newItems[k].paletNo || '').trim() === currentPallet) {
                newItems[k] = { ...newItems[k], [key]: value };
              }
            }
          } else {
            const updatedRow = { ...currentRow, [key]: value };
            if (key === 'adet' || key === 'fiyat') {
              const adet = parseFloat(updatedRow.adet) || 0;
              const fiyat = parseFloat(updatedRow.fiyat) || 0;
              if (adet && fiyat) updatedRow.tutar = (adet * fiyat).toFixed(2);
            }
            newItems[index] = updatedRow;
          }
          return newItems;
        });
      };

      const toggleSelectAll = () => {
        if (selectedIds.length === items.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(items.map(i => i.id));
        }
      };

      const toggleSelectRow = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleApplyPalletGroup = () => {
        if (selectedIds.length === 0) return;
        setItems(prev => prev.map(item => {
          if (selectedIds.includes(item.id)) {
            return { ...item, paletNo: groupPalletNo, paletEbatlari: groupPalletEbat, brutKg: groupBrutKg };
          }
          return item;
        }));
        setGroupPalletNo(''); setGroupPalletEbat(''); setGroupBrutKg(''); setSelectedIds([]);
      };

      const handleSave = () => {
        if (!invoiceNumber.trim() || !customerId) {
          alert("Lütfen Fatura No ve Müşteri seçimini yapın.");
          return;
        }
        onSaveChecklist({
          exporterId: exporter.id,
          invoiceNumber: invoiceNumber.trim(),
          checklistDate,
          deliveryDate,
          customerId,
          transporterId,
          currency,
          deliveryAddress,
          selectedBankId,
          selectedInsuranceId,
          hasDownPayment,
          downPaymentRate: Number(downPaymentRate) || 0,
          isFreeOfCharge,
          items,
          createdAt: initialData?.createdAt || new Date().toISOString()
        });
      };

      return (
        <div className="flex flex-col h-full bg-white z-20 overflow-hidden">
          <div className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md shrink-0">
            <div className="flex items-center">
              <button type="button" onClick={onBack} className="mr-4 p-2 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white">
                <ArrowLeft size={24} />
              </button>
              <h2 className="text-xl font-bold flex items-center">
                <FileSpreadsheet className="mr-2 text-blue-400" /> {initialData ? 'Evrak Düzenle' : 'Yeni Evrak / Check List Oluştur'}
              </h2>
            </div>
            <div className="text-slate-400 text-sm">İhracatçı: <span className="text-white font-medium">{exporter.name}</span></div>
          </div>

          <div className="p-4 border-b border-gray-200 bg-slate-50 shrink-0">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">FATURA NO *</label>
                <input type="text" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm" value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} placeholder="INV-2026-001" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">TARİH</label>
                <input type="date" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={checklistDate} onChange={e => setChecklistDate(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">DÖVİZ</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white font-bold" value={currency} onChange={e => setCurrency(e.target.value)}>
                  <option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="TRY">TRY (₺)</option><option value="GBP">GBP (£)</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">MÜŞTERİ *</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={customerId} onChange={e => setCustomerId(e.target.value)}>
                  <option value="">-- Seçin --</option>
                  {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">NAKLİYECİ</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={transporterId} onChange={e => setTransporterId(e.target.value)}>
                  <option value="">-- Seçin --</option>
                  {transporters.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">BANKA HESABI</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={selectedBankId} onChange={e => setSelectedBankId(e.target.value)}>
                  <option value="">-- Otomatik Seç --</option>
                  {exporter?.banks?.map(b => <option key={b.id} value={b.id}>{b.bankName} ({b.currency})</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">SİGORTA ACENTESİ</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={selectedInsuranceId} onChange={e => setSelectedInsuranceId(e.target.value)}>
                  <option value="">-- Acente Seçin --</option>
                  {exporter?.insurances?.map(i => <option key={i.id} value={i.id}>{i.agencyName}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">TESLİM TARİHİ (DELIVERY DATE)</label>
                <input type="date" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">SEVK ADRESİ</label>
                <input type="text" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm" value={deliveryAddress} onChange={e => setDeliveryAddress(e.target.value)} placeholder="Adres..." />
              </div>
              <div className="flex items-center gap-4 bg-white px-3 py-1.5 border rounded-lg md:col-span-2">
                <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer">
                  <input type="checkbox" checked={hasDownPayment} onChange={e => setHasDownPayment(e.target.checked)} className="w-4 h-4 accent-red-600" />
                  Down Payment (Peşinat)
                </label>
                {hasDownPayment && (
                  <div className="flex items-center gap-1">
                    <span className="text-xs text-slate-500">Oran (%):</span>
                    <input type="number" min="0" max="100" step="1" value={downPaymentRate} onChange={e => setDownPaymentRate(e.target.value)} className="w-16 px-2 py-0.5 border rounded text-xs font-bold text-red-600 text-center" />
                  </div>
                )}
                <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer ml-auto">
                  <input type="checkbox" checked={isFreeOfCharge} onChange={e => setIsFreeOfCharge(e.target.checked)} className="w-4 h-4 accent-blue-600" />
                  Bedelsiz
                </label>
              </div>
            </div>

            {selectedIds.length > 0 && (
              <div className="bg-amber-50 border border-amber-300 p-2 rounded flex flex-wrap items-center justify-between gap-2 mb-2">
                <span className="text-xs font-bold text-amber-900">{selectedIds.length} Satır Seçili - Palette Topla:</span>
                <div className="flex items-center gap-2">
                  <input type="text" placeholder="Palet No" className="px-2 py-1 border rounded text-xs w-24" value={groupPalletNo} onChange={e => setGroupPalletNo(e.target.value)} />
                  <input type="text" placeholder="Ebat" className="px-2 py-1 border rounded text-xs w-28" value={groupPalletEbat} onChange={e => setGroupPalletEbat(e.target.value)} />
                  <input type="text" placeholder="Brüt KG" className="px-2 py-1 border rounded text-xs w-24" value={groupBrutKg} onChange={e => setGroupBrutKg(e.target.value)} />
                  <button type="button" onClick={handleApplyPalletGroup} className="bg-amber-600 text-white px-3 py-1 rounded text-xs font-bold">Birleştir</button>
                  <button type="button" onClick={() => setSelectedIds([])} className="text-xs text-slate-500">Vazgeç</button>
                </div>
              </div>
            )}

            <div className="flex justify-between items-center gap-2">
              <div className="flex items-center gap-2">
                <button type="button" onClick={handleAddRow} className="bg-white border text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow-sm">
                  <Plus size={16} className="mr-1" /> Satır Ekle
                </button>
                <button type="button" onClick={handleDownloadTemplate} className="bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow-sm">
                  <Download size={16} className="mr-1" /> Şablon İndir
                </button>
                <div className="relative inline-block">
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} disabled={isExcelLoading} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                  <button type="button" className={`px-3 py-1.5 text-white rounded-lg text-xs font-medium flex items-center shadow-sm ${isExcelLoading ? 'bg-indigo-400' : 'bg-indigo-600'}`}>
                    {isExcelLoading ? <Loader2 className="mr-1" /> : <Upload size={16} className="mr-1" />}
                    {isExcelLoading ? 'Yükleniyor...' : 'Excel Yükle'}
                  </button>
                </div>
              </div>

              {items.length > 0 && (
                <div className="flex items-center gap-2 text-xs bg-slate-200 px-3 py-1 rounded-lg">
                  <span className="font-semibold text-slate-700">Toplam {items.length} Kalem</span>
                  <span className="text-slate-400">|</span>
                  <button type="button" disabled={currentPage === 1} onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="disabled:opacity-40 font-bold px-1.5 py-0.5 bg-white rounded">
                    &lt;
                  </button>
                  <span className="font-bold text-blue-700">Sayfa {currentPage} / {totalPages}</span>
                  <button type="button" disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} className="disabled:opacity-40 font-bold px-1.5 py-0.5 bg-white rounded">
                    &gt;
                  </button>
                  <select value={pageSize} onChange={e => { setPageSize(Number(e.target.value)); setCurrentPage(1); }} className="bg-white border rounded px-1 py-0.5 ml-1">
                    <option value={25}>25 Göster</option>
                    <option value={50}>50 Göster</option>
                    <option value={100}>100 Göster</option>
                  </select>
                </div>
              )}

              <button type="button" onClick={handleSave} className="px-6 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center shadow-md">
                <Save size={16} className="mr-1.5" /> Kaydet
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-auto bg-slate-200 p-3">
            <div className="bg-white rounded-xl shadow-lg inline-block min-w-full overflow-hidden">
              <table className="min-w-full text-left border-collapse whitespace-nowrap">
                <thead>
                  <tr className="bg-slate-800 text-white text-xs uppercase tracking-wider sticky top-0 z-10">
                    <th className="p-2.5 w-8 text-center border-r border-slate-700">
                      <input type="checkbox" checked={items.length > 0 && selectedIds.length === items.length} onChange={toggleSelectAll} />
                    </th>
                    <th className="p-2.5 w-10 text-center border-r border-slate-700">Sil</th>
                    {columns.map(col => <th key={col.key} className={`p-2.5 font-semibold border-x border-slate-700 ${col.width}`}>{col.label}</th>)}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-sm">
                  {items.length === 0 ? (
                    <tr><td colSpan={columns.length + 2} className="p-8 text-center text-slate-500">Henüz kalem bulunmuyor. Excel yükleyebilir veya satır ekleyebilirsiniz.</td></tr>
                  ) : (
                    paginatedRows.map((rowInfo) => {
                      const index = rowInfo.originalIndex;
                      const row = rowInfo.item;
                      const isSelected = selectedIds.includes(row.id);

                      return (
                        <tr key={row.id} className={`transition-colors ${isSelected ? 'bg-amber-200/70' : `${rowInfo.groupColor} hover:bg-blue-100/40`}`}>
                          <td className="p-1 border-r text-center border-slate-200">
                            <input type="checkbox" checked={isSelected} onChange={() => toggleSelectRow(row.id)} />
                          </td>
                          <td className="p-1 border-r text-center border-slate-200">
                            <button type="button" onClick={() => handleRemoveRow(row.id)} className="text-slate-400 hover:text-red-500 p-1">
                              <Trash2 size={15} />
                            </button>
                          </td>

                          {columns.map(col => {
                            const isMergedField = (col.key === 'brutKg' || col.key === 'paletNo' || col.key === 'paletEbatlari');

                            if (isMergedField) {
                              if (!rowInfo.isFirstInGroup) return null;
                              return (
                                <td key={col.key} rowSpan={rowInfo.rowSpan} className="p-1 border-r border-slate-300 align-middle bg-slate-50 text-center font-bold">
                                  <input 
                                    type="text" 
                                    value={row[col.key] ?? ''} 
                                    onChange={(e) => handleItemChange(index, col.key, e.target.value)} 
                                    className="w-full px-1.5 py-1 bg-transparent outline-none focus:bg-white text-xs font-bold text-center text-blue-900" 
                                    placeholder="-" 
                                  />
                                </td>
                              );
                            }

                            return (
                              <td key={col.key} className="p-1 border-r border-slate-200">
                                <input 
                                  type="text" 
                                  value={row[col.key] ?? ''} 
                                  onChange={(e) => handleItemChange(index, col.key, e.target.value)} 
                                  className="w-full px-1.5 py-1 bg-transparent outline-none focus:bg-white text-xs" 
                                  placeholder="-" 
                                />
                              </td>
                            );
                          })}
                        </tr>
                      );
                    })
                  )}
                </tbody>
                <tfoot className="bg-slate-900 text-white font-bold text-xs sticky bottom-0 z-10 shadow-lg border-t-2 border-slate-700">
                  <tr>
                    <td colSpan={8} className="p-2.5 text-right uppercase tracking-wider font-extrabold text-slate-300 bg-slate-950">
                      GENEL TOPLAM / TOTALS:
                    </td>
                    <td className="p-2.5 text-right"></td>
                    <td className="p-2.5 text-right font-extrabold text-amber-400 text-sm">
                      {totals.totalAdet.toLocaleString('tr-TR')}
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-emerald-400 text-sm">
                      {totals.totalTutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-sky-300 text-sm">
                      {totals.totalNetKg.toLocaleString('tr-TR')} KG
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-amber-300 text-sm bg-slate-800">
                      {totals.totalBrutKg.toLocaleString('tr-TR')} KG
                    </td>
                    <td className="p-2.5 text-center font-extrabold text-indigo-300 text-sm bg-slate-800">
                      {totals.paletCount} Palet
                    </td>
                    <td className="p-2.5"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function ExportSetPrintModal({ checklist, exporter, customer, transporter, onClose }) {
      const [activeTab, setActiveTab] = useState('invoice');
      const [showStamp, setShowStamp] = useState(false);
      const [hasDownPayment, setHasDownPayment] = useState(checklist?.hasDownPayment || false);
      const [downPaymentRate, setDownPaymentRate] = useState(checklist?.downPaymentRate ?? 30);
      const [isFreeOfCharge, setIsFreeOfCharge] = useState(checklist?.isFreeOfCharge || false);
      const [deliveryDate, setDeliveryDate] = useState(checklist?.deliveryDate || '');
      const [customDeliveryAddress, setCustomDeliveryAddress] = useState(checklist?.deliveryAddress || '');

      const items = checklist?.items || [];
      const processedRows = useMemo(() => processTableRows(items), [items]);
      const totals = useMemo(() => calculateTotals(items, processedRows), [items, processedRows]);
      const currency = checklist?.currency || 'EUR';

      const downPaymentAmount = useMemo(() => {
        if (!hasDownPayment) return 0;
        return (totals.totalTutar * (Number(downPaymentRate) || 0)) / 100;
      }, [hasDownPayment, downPaymentRate, totals.totalTutar]);

      const remainingAmount = useMemo(() => {
        if (!hasDownPayment) return totals.totalTutar;
        return Math.max(0, totals.totalTutar - downPaymentAmount);
      }, [hasDownPayment, totals.totalTutar, downPaymentAmount]);

      const rawInvoiceDate = checklist?.checklistDate || new Date().toISOString().split('T')[0];
      const invoiceDate = formatDateTR(rawInvoiceDate);
      const formattedDeliveryDate = formatDateTR(deliveryDate);
      const hasCustomDelivery = Boolean(customDeliveryAddress && customDeliveryAddress.trim() !== '');

      const uniquePartNames = Array.from(new Set(items.map(i => i.parcaAdi).filter(Boolean))).join(' & ');
      const uniqueOrders = Array.from(new Set(items.map(i => i.sipRefNo).filter(Boolean))).join(' & ');

      const palletMap = {};
      items.forEach(i => { if (i.paletNo && i.paletEbatlari) palletMap[i.paletNo] = i.paletEbatlari; });
      const dimensionCounts = {};
      Object.values(palletMap).forEach(dim => { dimensionCounts[dim] = (dimensionCounts[dim] || 0) + 1; });
      const palletSummary = Object.entries(dimensionCounts).map(([dim, count]) => `${count} Pallets ${dim}`).join(' & ');

      const selectedBank = exporter?.banks?.find(b => b.id === checklist?.selectedBankId) || exporter?.banks?.filter(b => b.currency === currency)[0] || exporter?.banks?.[0];
      const selectedInsurance = exporter?.insurances?.find(i => i.id === checklist?.selectedInsuranceId) || exporter?.insurances?.[0];

      // Kalem sayısına göre (Az satırlı vs Çok satırlı) dinamik görsel optimizasyon
      const isFewRows = items.length <= 6;
      const isMediumRows = items.length > 6 && items.length <= 15;
      const isCompact = items.length > 16;
      const isUltraCompact = items.length > 22;

      const rowPadding = isUltraCompact
        ? 'py-[2px] px-1.5'
        : isCompact
        ? 'py-[3px] px-2'
        : isFewRows
        ? 'py-2 px-2'
        : 'py-1 px-2';

      const packingRowPadding = isUltraCompact
        ? 'py-[2px] px-1.5'
        : isCompact
        ? 'py-[3px] px-2'
        : isFewRows
        ? 'py-2.5 px-2'
        : 'py-1.5 px-2';

      const tableFontSize = isUltraCompact
        ? 'text-[9px]'
        : isFewRows
        ? 'text-[10.5px]'
        : 'text-[10px]';

      // Az satırlı faturalarda tabloyu A4 sayfasına dengeli yayacak dolgu yüksekliği
      const fillerHeight = isFewRows
        ? Math.max(140, 260 - items.length * 32)
        : isMediumRows
        ? Math.max(40, 210 - items.length * 22)
        : Math.max(0, 140 - items.length * 18);

      const packingFillerHeight = isFewRows
        ? Math.max(80, 180 - items.length * 30)
        : 0;

      const tabs = [
        { id: 'invoice', label: 'Invoice' },
        { id: 'packing', label: 'Çeki Listesi' },
        { id: 'workOrder', label: 'İş Emri' },
        { id: 'transport', label: 'Nakliye Talimatı' },
        { id: 'insurance', label: 'Sigorta Talimatı' },
        { id: 'atr', label: 'A.TR Belgesi' }
      ];

      const StampImage = ({ className }) => {
        if (!showStamp || !exporter?.stamp) return null;
        return <img src={exporter.stamp} alt="Kaşe İmza" className={`absolute mix-blend-multiply opacity-95 pointer-events-none ${className}`} style={{ maxWidth: '210px', maxHeight: '110px' }} />;
      };

      return (
        <div className="fixed inset-0 bg-slate-900/90 z-50 flex flex-col p-4 print-modal-wrapper">
          <div className="bg-white rounded-xl shadow-2xl max-w-[1120px] mx-auto w-full flex-1 flex flex-col overflow-hidden border border-slate-300 print-modal-inner">
            {/* Modal Header & Tabs (Yazdırırken Gizlenir) */}
            <div className="no-print bg-slate-100 flex flex-col z-10 shrink-0">
              <div className="p-3.5 flex flex-wrap justify-between items-center gap-3 border-b border-slate-300">
                <div className="flex items-center gap-2">
                  <Layers className="text-indigo-600 w-5 h-5" />
                  <h3 className="text-base font-bold text-slate-800">Tam İhracat Seti</h3>
                </div>
                
                <div className="flex flex-wrap items-center gap-2.5">
                  <div className="flex flex-wrap items-center gap-2.5 bg-white px-3 py-1.5 rounded-lg border border-slate-300 shadow-sm text-xs">
                    <div className="flex items-center gap-1.5">
                      <span className="font-semibold text-slate-600">Sevk Adresi:</span>
                      <input 
                        type="text" 
                        value={customDeliveryAddress} 
                        onChange={e => setCustomDeliveryAddress(e.target.value)} 
                        placeholder="Farklı sevk adresi..."
                        className="border border-slate-300 rounded px-2 py-0.5 text-xs font-semibold text-blue-800 outline-none focus:border-indigo-500 w-44"
                      />
                    </div>
                    {activeTab === 'invoice' && (
                      <>
                        <span className="text-slate-300">|</span>
                        <div className="flex items-center gap-1.5">
                          <span className="font-semibold text-slate-600">Delivery Date:</span>
                          <input 
                            type="date" 
                            value={deliveryDate} 
                            onChange={e => setDeliveryDate(e.target.value)} 
                            className="border border-slate-300 rounded px-1.5 py-0.5 text-xs font-bold text-slate-800 outline-none focus:border-indigo-500"
                          />
                        </div>
                        <span className="text-slate-300">|</span>
                        <label className="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer">
                          <input type="checkbox" checked={isFreeOfCharge} onChange={e => setIsFreeOfCharge(e.target.checked)} className="w-3.5 h-3.5 accent-slate-800" />
                          BEDELSİZ
                        </label>
                        <span className="text-slate-300">|</span>
                        <label className="flex items-center gap-1.5 font-bold text-red-700 cursor-pointer">
                          <input type="checkbox" checked={hasDownPayment} onChange={e => setHasDownPayment(e.target.checked)} className="w-3.5 h-3.5 accent-red-600" />
                          Down Payment
                        </label>
                        {hasDownPayment && (
                          <div className="flex items-center border border-slate-300 rounded overflow-hidden">
                            <input 
                              type="number" 
                              value={downPaymentRate} 
                              onChange={e => setDownPaymentRate(e.target.value)} 
                              className="w-12 px-1.5 py-0.5 text-center font-bold text-red-600 outline-none"
                            />
                            <span className="bg-slate-100 px-1.5 py-0.5 font-bold text-slate-600">%</span>
                          </div>
                        )}
                      </>
                    )}
                  </div>

                  {exporter?.stamp && (
                    <label className="flex items-center gap-2 cursor-pointer bg-amber-50 hover:bg-amber-100 text-amber-900 px-3 py-1.5 rounded-lg border border-amber-300 text-xs font-bold shadow-sm transition-colors">
                      <input type="checkbox" checked={showStamp} onChange={(e) => setShowStamp(e.target.checked)} className="w-4 h-4 cursor-pointer accent-amber-600" />
                      Kaşe/İmza Bas
                    </label>
                  )}
                  <button type="button" onClick={() => window.print()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-1.5 rounded-lg font-bold flex items-center shadow-md transition-colors text-sm">
                    <Printer size={16} className="mr-1.5" /> Yazdır (A4)
                  </button>
                  <button type="button" onClick={onClose} className="bg-slate-300 text-slate-700 hover:bg-slate-400 px-4 py-1.5 rounded-lg font-medium text-sm transition-colors">Kapat</button>
                </div>
              </div>

              {/* TABS */}
              <div className="flex bg-slate-200 px-2 pt-2 gap-1 overflow-x-auto shadow-inner">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-5 py-2 rounded-t-lg font-bold text-xs transition-colors whitespace-nowrap ${activeTab === tab.id ? 'bg-white text-indigo-700 border-t-2 border-indigo-600 shadow-[0_-2px_6px_rgba(0,0,0,0.05)] z-10' : 'bg-slate-100 text-slate-600 hover:bg-slate-50 border-t-2 border-transparent'}`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Document Render Area */}
            <div className="flex-1 overflow-y-auto bg-slate-300 p-6 print-container">
              
              {/* 1. INVOICE */}
              {activeTab === 'invoice' && (
                <div className="bg-white p-6 mx-auto w-full shadow-lg relative print-page flex flex-col justify-between font-sans text-black border border-slate-300" style={{ width: '210mm', minHeight: '287mm' }}>
                  
                  <div>
                    {/* TOP: Centered Logo */}
                    <div className="flex flex-col items-center mb-3">
                      {exporter?.logo && <img src={exporter.logo} alt="Exporter Logo" className="h-24 max-w-[260px] object-contain" />}
                    </div>
                    
                    {/* EXPORTER DETAILS */}
                    <div className="text-[10px] mb-3.5">
                       <div className="font-bold mb-1 text-[11px] text-black">{exporter?.address}</div>
                       <div className="grid grid-cols-[65px_145px_100px_1fr] gap-x-2 gap-y-0.5 max-w-lg items-center">
                          <div className="text-[#0052cc] font-semibold whitespace-nowrap">Tel:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.phone}</div>
                          <div className="text-[#0052cc] font-semibold whitespace-nowrap">D-U-N-S ® Number:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.dunsNumber}</div>
                          
                          <div className="text-[#0052cc] font-semibold whitespace-nowrap">Fax:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.fax}</div>
                          <div className="text-[#0052cc] font-semibold whitespace-nowrap">EORI Number:</div>
                          <div className="font-medium text-black whitespace-nowrap">{exporter?.eoriNumber}</div>
                          
                          <div className="text-[#0052cc] font-semibold whitespace-nowrap">VAT ID No:</div>
                          <div className="font-bold text-black whitespace-nowrap col-span-3">{exporter?.vatNo}</div>
                       </div>
                    </div>

                    {/* CONSIGNEE & INVOICE BANNER */}
                    <div className="flex justify-between items-stretch mb-3 gap-4">
                       {/* CONSIGNEE BOX (Sevk Adresi Varsa Örnek.pdf Gibi Gösterir) */}
                       <div className="border border-black p-2.5 w-[58%] min-h-[100px] text-[10.5px] flex flex-col justify-between bg-white">
                         <div>
                           <div className="font-black text-[13px] uppercase text-black leading-snug">{customer?.name}</div>
                           <div className="mt-0.5 text-black leading-snug">{customer?.address}</div>
                           <div className="font-extrabold mt-0.5 uppercase text-black">{customer?.country}</div>
                         </div>

                         <div className="flex justify-between items-end pt-2 mt-1">
                           {hasCustomDelivery ? (
                             <div className="text-[9.5px] leading-tight pr-2">
                               <div className="text-[#c00000] font-black uppercase tracking-wide">DELIVERY ADDRESS</div>
                               <div className="text-[#0052cc] font-bold mt-0.5 whitespace-pre-line">{customDeliveryAddress}</div>
                             </div>
                           ) : <div />}
                           <div className="text-right font-bold text-black text-[10.5px] whitespace-nowrap ml-auto">
                             VAT ID: {customer?.vatNo}
                           </div>
                         </div>
                       </div>

                       {/* INVOICE BANNER & INFO */}
                       <div className="w-[39%] relative flex flex-col justify-between">
                         <StampImage className="-top-24 left-1/2 -translate-x-1/2 z-20 !max-w-[195px] !max-h-[95px]" />

                  <div className="inline-block bg-slate-900 text-white px-4 py-1.5 rounded text-sm font-extrabold tracking-wider uppercase mb-2">
                    PACKING LIST / ÇEKİ LİSTESİ
                  </div>
                  <p className="text-xs text-slate-700"><strong>Fatura No:</strong> <span className="text-black font-bold">{checklist?.invoiceNumber || '-'}</span></p>
                  <p className="text-xs text-slate-700"><strong>Tarih:</strong> {formattedDate || '-'}</p>
                  <p className="text-xs text-slate-700"><strong>Döviz Birimi:</strong> <span className="font-bold text-black">{currency}</span></p>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3 text-xs mb-5">
                <div className="border border-black p-3 rounded bg-white flex justify-between items-start">
                  <div>
                    <p className="font-bold text-black border-b border-slate-300 pb-1 mb-1.5 uppercase tracking-wide text-[11px]">
                      CONSIGNEE / MÜŞTERİ BİLGİLERİ
                    </p>
                    <p className="font-bold text-sm text-black">{customer?.name || '-'}</p>
                    <p className="text-slate-800 mt-1">{customer?.address || checklist?.deliveryAddress || '-'}</p>
                    <p className="text-slate-700 mt-1">Ülke: {customer?.country || '-'}</p>
                    <p className="text-slate-700">VAT No: {customer?.vatNo || '-'}</p>
                  </div>
                  {customer?.logo && <img src={customer.logo} alt="Customer Logo" className="h-14 max-w-[120px] object-contain ml-2" />}
                </div>

                <div className="border border-black p-3 rounded bg-white">
                  <p className="font-bold text-black border-b border-slate-300 pb-1 mb-1.5 uppercase tracking-wide text-[11px]">
                    CARRIER / NAKLİYECİ BİLGİLERİ
                  </p>
                  <p className="font-bold text-sm text-black">{transporter?.name || '-'}</p>
                  <p className="text-slate-800 mt-1">{transporter?.address || '-'}</p>
                  <p className="text-slate-700 mt-1"><strong>Teslim Şekli:</strong> {transporter?.deliveryTerm || '-'}</p>
                  <p className="text-slate-700"><strong>Taşımacılık:</strong> {transporter?.transportType || '-'}</p>
                </div>

                <div className="border border-black p-3 rounded bg-white">
                  <p className="font-bold text-black border-b border-slate-300 pb-1 mb-1.5 uppercase tracking-wide text-[11px]">
                    SHIPMENT / SEVK DETAYLARI
                  </p>
                  <p className="text-black"><strong>Sevk Adresi:</strong> {checklist?.deliveryAddress || customer?.address || '-'}</p>
                  <p className="text-black mt-1"><strong>Toplam Kalem:</strong> {items.length} Kalem</p>
                  <p className="text-black"><strong>Toplam Palet:</strong> {totals?.paletCount || 0} Palet</p>
                  <p className="text-black"><strong>Toplam Brüt KG:</strong> {totals?.totalBrutKg ? totals.totalBrutKg.toLocaleString('tr-TR') : 0} KG</p>
                </div>
              </div>

              <table className="w-full text-left text-xs border-collapse border border-black mb-5">
                <thead>
                  <tr className="bg-slate-900 text-white font-bold text-[11px] uppercase tracking-wider">
                    <th className="border border-black p-2 text-center w-8">Sıra</th>
                    <th className="border border-black p-2">Parça Adı</th>
                    <th className="border border-black p-2">Sip. Ref No</th>
                    <th className="border border-black p-2">Pos / Resim</th>
                    <th className="border border-black p-2 text-right">Adet</th>
                    <th className="border border-black p-2 text-right">Fiyat ({currency})</th>
                    <th className="border border-black p-2 text-right">Tutar ({currency})</th>
                    <th className="border border-black p-2 text-right">Net KG</th>
                    <th className="border border-black p-2 text-right">Brüt KG</th>
                    <th className="border border-black p-2 text-center">Palet No</th>
                    <th className="border border-black p-2">Palet Ebatları</th>
                  </tr>
                </thead>
                <tbody>
                  {processedRows.map((rowInfo, idx) => {
                    const item = rowInfo.item;
                    const adet = parseFloat(item.adet) || 0;
                    const fiyat = parseFloat(item.fiyat) || 0;
                    const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
                    const rowBg = rowInfo.groupColor || 'bg-white';

                    return (
                      <tr key={idx} className={`border-b border-slate-400 ${rowBg}`}>
                        <td className="border border-black p-1.5 text-center font-medium">{item.siraNo || idx + 1}</td>
                        <td className="border border-black p-1.5 font-bold text-black">{item.parcaAdi || '-'}</td>
                        <td className="border border-black p-1.5 font-mono text-[11px] text-slate-800">{item.sipRefNo || '-'}</td>
                        <td className="border border-black p-1.5 text-slate-800">
                          {[item.posNo, item.resimNo].filter(Boolean).join(' / ') || '-'}
                        </td>
                        <td className="border border-black p-1.5 text-right font-extrabold text-black">{item.adet || '-'}</td>
                        <td className="border border-black p-1.5 text-right text-slate-800">
                          {fiyat ? fiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                        </td>
                        <td className="border border-black p-1.5 text-right font-extrabold text-black">
                          {tutar ? tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-'}
                        </td>
                        <td className="border border-black p-1.5 text-right font-semibold text-black">{item.netKg || '-'}</td>

                        {rowInfo.isFirstInGroup && (
                          <>
                            <td rowSpan={rowInfo.rowSpan} className={`border border-black p-1.5 text-right font-extrabold text-black align-middle ${rowBg}`}>
                              {item.brutKg || '-'}
                            </td>
                            <td rowSpan={rowInfo.rowSpan} className={`border border-black p-1.5 text-center font-extrabold text-blue-900 align-middle ${rowBg}`}>
                              {item.paletNo || '-'}
                            </td>
                            <td rowSpan={rowInfo.rowSpan} className={`border border-black p-1.5 text-black align-middle ${rowBg}`}>
                              {item.paletEbatlari || '-'}
                            </td>
                          </>
                        )}
                      </tr>
                    );
                  })}
                </tbody>

                <tfoot className="bg-slate-200 text-black font-bold border-t-2 border-black text-xs">
                  <tr>
                    <td colSpan={4} className="border border-black p-2 text-right uppercase tracking-wider font-extrabold bg-slate-300">
                      GENEL TOPLAM / TOTALS:
                    </td>
                    <td className="border border-black p-2 text-right font-extrabold text-black">
                      {totals?.totalAdet ? totals.totalAdet.toLocaleString('tr-TR') : 0}
                    </td>
                    <td className="border border-black p-2"></td>
                    <td className="border border-black p-2 text-right font-extrabold text-black">
                      {totals?.totalTutar ? totals.totalTutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : 0} {currency}
                    </td>
                    <td className="border border-black p-2 text-right font-extrabold text-black">
                      {totals?.totalNetKg ? totals.totalNetKg.toLocaleString('tr-TR') : 0} KG
                    </td>
                    <td className="border border-black p-2 text-right font-extrabold text-black bg-slate-300">
                      {totals?.totalBrutKg ? totals.totalBrutKg.toLocaleString('tr-TR') : 0} KG
                    </td>
                    <td className="border border-black p-2 text-center font-extrabold text-blue-900 bg-slate-300">
                      {totals?.paletCount || 0} Palet
                    </td>
                    <td className="border border-black p-2"></td>
                  </tr>
                </tfoot>
              </table>
              <div className="grid grid-cols-3 gap-6 text-xs text-center mt-10 pt-6 border-t border-black relative">
                <div className="border border-black p-4 rounded bg-white relative">
                  <p className="font-bold text-black mb-8 z-10 relative">TESLİM EDEN / EXPORTER</p>
                  <p className="text-[10px] text-slate-600 mb-1 z-10 relative">İmza & Kaşe</p>
                  <p className="border-b border-dashed border-black w-3/4 mx-auto z-10 relative"></p>
                  {exporter?.stamp && <img src={exporter.stamp} className="absolute inset-0 m-auto mix-blend-multiply opacity-80" style={{ maxWidth: '80%', maxHeight: '80%' }} />}
                </div>
                <div className="border border-black p-4 rounded bg-white">
                  <p className="font-bold text-black mb-8">TAŞIYICI / CARRIER</p>
                  <p className="text-[10px] text-slate-600 mb-1">İmza & Kaşe</p>
                  <p className="border-b border-dashed border-black w-3/4 mx-auto"></p>
                </div>
                <div className="border border-black p-4 rounded bg-white">
                  <p className="font-bold text-black mb-8">TESLİM ALAN / CONSIGNEE</p>
                  <p className="text-[10px] text-slate-600 mb-1">İmza & Kaşe</p>
                  <p className="border-b border-dashed border-black w-3/4 mx-auto"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ExportManagementApp />);
  </script>
</body>
</html>
