          if (key === 'adet' || key === 'fiyat') {
            const a = parseFloat(String(updated.adet).replace(',', '.')) || 0;
            const f = parseFloat(String(updated.fiyat).replace(',', '.')) || 0;
            updated.tutar = (a * f).toFixed(2);
          }
          return updated;
        }));
      };

      const handleRemoveExtraCharge = (id) => {
        setExtraCharges(prev => prev.filter(ec => ec.id !== id));
      };

      const processedRows = useMemo(() => processTableRows(items), [items]);
      const totals = useMemo(() => calculateTotals(items, processedRows), [items, processedRows]);

      const paginatedRows = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedRows.slice(start, start + pageSize);
      }, [processedRows, currentPage, pageSize]);

      const totalPages = Math.ceil(processedRows.length / pageSize) || 1;

      const columns = [
        { key: 'siraNo', label: 'Sıra No', width: 'w-16' },
        { key: 'adsIsNo', label: 'ADS İş No', width: 'w-24' },
        { key: 'parcaAdi', label: 'Parça Adı', width: 'w-48' },
        { key: 'sipRefNo', label: 'Sip Ref No', width: 'w-28' },
        { key: 'posNo', label: 'Pos No', width: 'w-20' },
        { key: 'resimNo', label: 'Resim No', width: 'w-32' },
        { key: 'fiyat', label: 'Fiyat', width: 'w-24' },
        { key: 'adet', label: 'Adet', width: 'w-20' },
        { key: 'tutar', label: 'Tutar', width: 'w-28' },
        { key: 'netKg', label: 'Net KG', width: 'w-24' },
        { key: 'brutKg', label: 'Brüt KG', width: 'w-24' },
        { key: 'paletNo', label: 'Palet No', width: 'w-24' },
        { key: 'paletEbatlari', label: 'Palet Ebatları', width: 'w-32' },
      ];

      const handleDownloadTemplate = () => {
        if (!window.XLSX) {
          alert("XLSX modülü henüz yüklenmedi.");
          return;
        }

        const sampleData = [
          ["SIRA NO", "ADS İŞ NO", "PARÇA ADI", "SİP.REF NO", "POS", "RESİM NO", "FİYAT", "ADET", "TUTAR", "NET KG", "BRÜT KG", "PALET NO", "PALET EBATLARI"],
          [1, "26/0147-2", "Bowl Cover", "4500285283-20", 20, "D 2903.184.00 -", 4091.22, 2, 8182.44, 532, 560, "1/24", "80x160x50"],
          [2, "26/0147-2", "Bowl Cover", "4500285283-20", 20, "D 2903.184.00 -", 4091.22, 2, 8182.44, 532, 560, "2/24", "80x160x50"]
        ];

        const ws = window.XLSX.utils.aoa_to_sheet(sampleData);
        ws['!cols'] = Array(13).fill({ wch: 15 });

        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "Ceklist_Sablonu");
        window.XLSX.writeFile(wb, "Ornek_Ceklist_Sablonu.xlsx");
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!window.XLSX) {
          alert("XLSX okuma kütüphanesi hazır değil. Sayfayı yenileyip tekrar deneyin.");
          return;
        }

        const inputEl = e.target;
        setIsExcelLoading(true);

        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const dataBuffer = new Uint8Array(evt.target.result);
              const wb = window.XLSX.read(dataBuffer, { 
                type: 'array', 
                cellFormula: false, 
                cellHTML: false, 
                cellText: true 
              });

              if (!wb.SheetNames || wb.SheetNames.length === 0) {
                alert("Excel dosyasında çalışma sayfası bulunamadı.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];

              if (!ws || !ws['!ref']) {
                alert("Seçilen çalışma sayfası boş.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const range = window.XLSX.utils.decode_range(ws['!ref']);
              if (range.e.r > 5000) range.e.r = 5000;

              const rawData = window.XLSX.utils.sheet_to_json(ws, { 
                header: 1, 
                blankrows: false,
                range: range 
              });

              if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
                alert("Excel dosyasında okunabilir veri bulunamadı.");
                setIsExcelLoading(false);
                if (inputEl) inputEl.value = "";
                return;
              }

              const normalizeText = (str) => {
                return String(str || '')
                  .replace(/İ/g, 'i')
                  .replace(/I/g, 'ı')
                  .replace(/i̇/g, 'i')
                  .toLowerCase()
                  .trim();
              };

              const parseTurkishNumber = (val) => {
                if (val === null || val === undefined || val === '') return '';
                if (typeof val === 'number') return isNaN(val) ? '' : val;
                let str = String(val).replace(/\s/g, '').trim();
                if (str.includes(',') && str.includes('.')) {
                  str = str.replace(/\./g, '').replace(',', '.');
                } else if (str.includes(',')) {
                  str = str.replace(',', '.');
                }
                const num = parseFloat(str);
                return isNaN(num) ? String(val).trim() : num;
              };

              let headerRowIndex = -1;
              const colMap = {};

              const keywords = {
                siraNo: ['sıra no', 'sira no', 's.no', 'sno', 'item no', 'sıra', 'sira'],
                adsIsNo: ['ads iş no', 'ads is no', 'anadolu work no', 'work no', 'iş no', 'is no'],
                parcaAdi: ['parça adı', 'parca adi', 'part name', 'description', 'açıklama', 'aciklama', 'malzeme', 'ürün'],
                sipRefNo: ['sip.ref no', 'sip ref no', 'order ref. no', 'order ref', 'po no', 'sip ref'],
                posNo: ['pos no', 'pos', 'poz'],
                resimNo: ['resim no', 'drawing no', 'çizim no', 'resim'],
                modelNo: ['model no', 'pattern no', 'model'],
                fiyat: ['fiyat', 'price', 'unit price', 'birim fiyat'],
                adet: ['adet', 'qty', 'quantity', 'miktar', 'pcs'],
                tutar: ['tutar', 'amount', 'toplam tutar'],
                dokumKg: ['döküm kg', 'dokum kg', 'casting weight'],
                netKg: ['net kg', 'net weight', 'net'],
                brutKg: ['brüt kg', 'gross weight', 'brut kg', 'brüt', 'brut'],
                sarjNo: ['şarj no', 'sarj no', 'heat no', 'charge no'],
                paletNo: ['palet no', 'pallet no', 'koli no', 'palet'],
                paletEbatlari: ['palet ebatları', 'palet ebatlari', 'pallet dimensions', 'ebat', 'dimension', 'ölçü']
              };

              for (let r = 0; r < Math.min(30, rawData.length); r++) {
                const row = rawData[r];
                if (!row || !Array.isArray(row)) continue;

                let matchCount = 0;
                const tempMap = {};

                row.forEach((cellVal, colIdx) => {
                  const text = normalizeText(cellVal);
                  if (!text) return;

                  for (const [key, wordList] of Object.entries(keywords)) {
                    if (tempMap[key] === undefined) {
                      if (wordList.some(w => text === w) || wordList.some(w => w.length > 2 && text.includes(w))) {
                        tempMap[key] = colIdx;
                        matchCount++;
                        break;
                      }
                    }
                  }
                });

                if (matchCount >= 2) {
                  headerRowIndex = r;
                  Object.assign(colMap, tempMap);
                  break;
                }
              }

              const defaultIndices = {
                siraNo: 0, adsIsNo: 1, parcaAdi: 2, sipRefNo: 3, posNo: 4, resimNo: 5,
                fiyat: 6, adet: 7, tutar: 8, netKg: 9, brutKg: 10, paletNo: 11, paletEbatlari: 12
              };

              Object.keys(defaultIndices).forEach(key => {
                if (colMap[key] === undefined) {
                  colMap[key] = defaultIndices[key];
                }
              });

              const startRow = headerRowIndex !== -1 ? headerRowIndex + 1 : 0;
              const newItems = [];

              const isHeaderSubrow = (str) => {
                const s = normalizeText(str);
                if (!s) return false;
                return (
                  s === 'part name' || s === 'parça adı' || s === 'parca adi' || 
                  s === 'description' || s === 'item no' || s === 'anadolu work no' || 
                  s === 'order ref. no' || s === 'drawing no' || s === 'pattern no' || 
                  s === 'qty' || s === 'quantity' || s === 'casting weight' || 
                  s === 'net weight' || s === 'gross weight' || s === 'heat no' || 
                  s === 'pallet no' || s === 'pallet dimensions' ||
                  s.startsWith('(part name') || s.startsWith('(item no') || s.startsWith('(order ref')
                );
              };

              let lastPalletNo = '';
              let lastPalletEbatlari = '';
              let lastBrutKg = '';

              for (let i = startRow; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || !Array.isArray(row) || row.length === 0) continue;

                const safeGet = (key) => {
                  const idx = colMap[key];
                  if (idx === undefined || idx < 0 || idx >= row.length) return '';
                  const val = row[idx];
                  return (val === null || val === undefined) ? '' : String(val).trim();
                };

                const siraNoRaw = safeGet('siraNo');
                const parcaAdi = safeGet('parcaAdi');
                const fiyatVal = safeGet('fiyat');

                const c0 = siraNoRaw.toUpperCase();
                const cFiyat = fiyatVal.toUpperCase();

                if (
                  c0.includes('TOPLAM') || c0.includes('TOTAL') || 
                  cFiyat.includes('TOPLAM') || cFiyat.includes('TOTAL') || 
                  c0.includes('YALNIZ') || c0.includes('ONLY') || 
                  c0.includes('ISTIFLENEMEZ')
                ) {
                  break;
                }

                if (isHeaderSubrow(parcaAdi) || isHeaderSubrow(siraNoRaw)) {
                  continue;
                }

                const adetVal = safeGet('adet');
                const posNo = safeGet('posNo');

                if (!parcaAdi && !adetVal && !posNo && !siraNoRaw) continue;

                let pNo = safeGet('paletNo');
                let pEbat = safeGet('paletEbatlari');
                let bKg = safeGet('brutKg');

                if (pNo !== '') {
                  lastPalletNo = pNo;
                  lastPalletEbatlari = pEbat;
                  lastBrutKg = bKg;
                } else if (lastPalletNo !== '' && pEbat !== '') {
                  pNo = lastPalletNo;
                  if (!pEbat) pEbat = lastPalletEbatlari;
                  if (!bKg) bKg = lastBrutKg;
                }

                const parsedAdet = parseTurkishNumber(adetVal);
                const parsedFiyat = parseTurkishNumber(fiyatVal);
                const rawTutar = safeGet('tutar');
                let parsedTutar = parseTurkishNumber(rawTutar);
                if (!parsedTutar && typeof parsedAdet === 'number' && typeof parsedFiyat === 'number') {
                  parsedTutar = (parsedAdet * parsedFiyat).toFixed(2);
                }

                newItems.push({
                  id: generateId(),
                  siraNo: siraNoRaw || String(newItems.length + 1),
                  adsIsNo: safeGet('adsIsNo'),
                  parcaAdi: parcaAdi,
                  sipRefNo: safeGet('sipRefNo'),
                  posNo: safeGet('posNo'),
                  resimNo: safeGet('resimNo'),
                  modelNo: safeGet('modelNo'),
                  fiyat: parsedFiyat,
                  adet: parsedAdet,
                  tutar: parsedTutar,
                  dokumKg: parseTurkishNumber(safeGet('dokumKg')),
                  netKg: parseTurkishNumber(safeGet('netKg')),
                  brutKg: parseTurkishNumber(bKg),
                  sarjNo: safeGet('sarjNo'),
                  paletNo: pNo,
                  paletEbatlari: pEbat
                });
              }

              if (newItems.length === 0) {
                alert("Excel dosyasından geçerli bir veri satırı okunamadı. Lütfen dosyanızı kontrol edin.");
              } else {
                setItems(newItems);
              }

            } catch (err) {
              console.error("Excel Ayrıştırma Hatası:", err);
              alert("Excel dosyası okunurken bir hata oluştu: " + err.message);
            } finally {
              setIsExcelLoading(false);
              if (inputEl) inputEl.value = "";
            }
          };

          reader.onerror = () => {
            alert("Dosya yükleme hatası!");
            setIsExcelLoading(false);
            if (inputEl) inputEl.value = "";
          };

          reader.readAsArrayBuffer(file);
        }, 50);
      };

      const handleAddRow = () => {
        const newRow = columns.reduce((acc, col) => ({ ...acc, [col.key]: '' }), { id: generateId() });
        setItems([...items, newRow]);
      };

      const handleRemoveRow = (id) => {
        setItems(items.filter(i => i.id !== id));
        setSelectedIds(selectedIds.filter(i => i !== id));
      };

      const handleItemChange = (index, key, value) => {
        setItems(prevItems => {
          const newItems = [...prevItems];
          const currentRow = newItems[index];
          const currentPallet = (currentRow.paletNo || '').trim();
          const isMergedKey = (key === 'brutKg' || key === 'paletNo' || key === 'paletEbatlari');

          if (isMergedKey && currentPallet !== '') {
            for (let k = 0; k < newItems.length; k++) {
              if ((newItems[k].paletNo || '').trim() === currentPallet) {
                newItems[k] = { ...newItems[k], [key]: value };
              }
            }
          } else {
            const updatedRow = { ...currentRow, [key]: value };
            if (key === 'adet' || key === 'fiyat') {
              const adet = parseFloat(updatedRow.adet) || 0;
              const fiyat = parseFloat(updatedRow.fiyat) || 0;
              if (adet && fiyat) updatedRow.tutar = (adet * fiyat).toFixed(2);
            }
            newItems[index] = updatedRow;
          }
          return newItems;
        });
      };

      const toggleSelectAll = () => {
        if (selectedIds.length === items.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(items.map(i => i.id));
        }
      };

      const toggleSelectRow = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleApplyPalletGroup = () => {
        if (selectedIds.length === 0) return;
        setItems(prev => prev.map(item => {
          if (selectedIds.includes(item.id)) {
            return { ...item, paletNo: groupPalletNo, paletEbatlari: groupPalletEbat, brutKg: groupBrutKg };
          }
          return item;
        }));
        setGroupPalletNo(''); setGroupPalletEbat(''); setGroupBrutKg(''); setSelectedIds([]);
      };

      const handleSave = () => {
        if (!invoiceNumber.trim() || !customerId) {
          alert("Lütfen Fatura No ve Müşteri seçimini yapın.");
          return;
        }
        onSaveChecklist({
          exporterId: exporter.id,
          invoiceNumber: invoiceNumber.trim(),
          checklistDate,
          deliveryDate,
          customerId,
          transporterId,
          currency,
          deliveryAddress,
          selectedBankId,
          selectedInsuranceId,
          customsDescriptionTR: customsDescriptionTR.trim(),
          specialNote: specialNote.trim(),
          shipmentNo: shipmentNo.trim(),
          bookingNo: bookingNo.trim(),
          containerNo: containerNo.trim(),
          hasDutyFee,
          dutyFeeRate: Number(dutyFeeRate) || 0,
          dutyFeeLabel: dutyFeeLabel.trim(),
          extraCharges: extraCharges.filter(ec => ec.description && String(ec.description).trim() !== ''),
          hasDownPayment,
          downPaymentRate: Number(downPaymentRate) || 0,
          isFreeOfCharge,
          items,
          createdAt: initialData?.createdAt || new Date().toISOString()
        });
      };

      const [isHeaderCollapsed, setIsHeaderCollapsed] = useState(false);
      const [tableSearch, setTableSearch] = useState('');

      const filteredPaginatedRows = useMemo(() => {
        const q = tableSearch.trim().toLocaleLowerCase('tr-TR');
        if (!q) return paginatedRows;
        return processedRows.filter(r => {
          const it = r.item;
          return (
            String(it.parcaAdi || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(it.sipRefNo || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(it.resimNo || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(it.adsIsNo || '').toLocaleLowerCase('tr-TR').includes(q) ||
            String(it.paletNo || '').toLocaleLowerCase('tr-TR').includes(q)
          );
        });
      }, [paginatedRows, processedRows, tableSearch]);

      const selectedCustomerName = customers.find(c => c.id === customerId)?.name || 'Müşteri Seçilmedi';

      return (
        <div className="flex flex-col h-full bg-slate-100 z-20 overflow-hidden">
          {/* ÜST BAŞLIK BARI */}
          <div className="bg-slate-900 text-white px-4 py-2 flex justify-between items-center shadow-md shrink-0">
            <div className="flex items-center gap-3">
              <button type="button" onClick={onBack} className="p-1.5 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition-colors" title="Listeye Dön">
                <ArrowLeft size={18} />
              </button>
              <h2 className="text-sm font-bold flex items-center tracking-wide">
                <FileSpreadsheet className="mr-2 text-blue-400 w-4 h-4" /> {initialData ? 'Evrak / Check List Düzenle' : 'Yeni Evrak / Check List Oluştur'}
              </h2>
              {isHeaderCollapsed && (
                <div className="hidden md:flex items-center gap-2 ml-3 pl-3 border-l border-slate-700 text-xs text-slate-300">
                  <span className="font-bold text-blue-300">{invoiceNumber || 'Taslak'}</span>
                  <span>•</span>
                  <span className="font-semibold text-white truncate max-w-[200px]">{selectedCustomerName}</span>
                  <span>•</span>
                  <span className="bg-slate-800 px-2 py-0.5 rounded text-amber-300 font-bold">{totals.totalAdet} Adet / {totals.paletCount} Palet</span>
                </div>
              )}
            </div>

            <div className="flex items-center gap-2.5">
              <button
                type="button"
                onClick={() => setIsHeaderCollapsed(!isHeaderCollapsed)}
                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold flex items-center transition-colors"
                title="Çok satırlı çeklistlerde üst bilgi alanını gizleyerek tabloyu büyütür"
              >
                {isHeaderCollapsed ? '▼ Fatura Bilgilerini Göster' : '▲ Fatura Bilgilerini Daralt (Tam Ekran Tablo)'}
              </button>
              <button type="button" onClick={handleSave} className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold flex items-center shadow-md transition-colors">
                <Save size={14} className="mr-1.5" /> Evrakı Kaydet
              </button>
            </div>
          </div>

          {/* BÖLÜM 1: STANDART EVRAK BİLGİLERİ (Ferah, Sıkışmayan 2 Satır Düzeni) */}
          {!isHeaderCollapsed && (
            <div className="bg-white border-b border-slate-200 px-4 py-2.5 shrink-0 space-y-2">
              {/* 1. SATIR: FATURA NO, TARİHLER, DÖVİZ, MÜŞTERİ, NAKLİYECİ */}
              <div className="flex flex-wrap lg:flex-nowrap items-end gap-2.5">
                <div className="w-36 shrink-0">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Fatura No *</label>
                  <input type="text" className="w-full px-2.5 py-1.5 border border-slate-300 rounded-md outline-none text-xs font-extrabold text-blue-900 focus:border-blue-600 bg-slate-50/50 focus:bg-white" value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} placeholder="ADS2026..." />
                </div>
                <div className="w-32 shrink-0">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Fatura Tarihi</label>
                  <input type="date" className="w-full px-2 py-1.5 border border-slate-300 rounded-md outline-none text-xs font-semibold bg-white focus:border-blue-600" value={checklistDate} onChange={e => setChecklistDate(e.target.value)} />
                </div>
                <div className="w-32 shrink-0">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Teslim Tarihi</label>
                  <input type="date" className="w-full px-2 py-1.5 border border-slate-300 rounded-md outline-none text-xs font-semibold bg-white focus:border-blue-600" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} />
                </div>
                <div className="w-24 shrink-0">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Döviz</label>
                  <select className="w-full px-2 py-1.5 border border-slate-300 rounded-md outline-none text-xs bg-white font-extrabold text-slate-800 focus:border-blue-600" value={currency} onChange={e => setCurrency(e.target.value)}>
                    <option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="TRY">TRY (₺)</option><option value="GBP">GBP (£)</option>
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Müşteri (Consignee) *</label>
                  <select className="w-full px-2.5 py-1.5 border border-slate-300 rounded-md outline-none text-xs font-bold text-slate-800 bg-white focus:border-blue-600" value={customerId} onChange={e => setCustomerId(e.target.value)}>
                    <option value="">-- Müşteri Seçin --</option>
                    {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Nakliyeci (Carrier)</label>
                  <select className="w-full px-2.5 py-1.5 border border-slate-300 rounded-md outline-none text-xs font-semibold text-slate-800 bg-white focus:border-blue-600" value={transporterId} onChange={e => setTransporterId(e.target.value)}>
                    <option value="">-- Nakliyeci Seçin --</option>
                    {transporters.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
              </div>

              {/* 2. SATIR: BANKA, SİGORTA, TR GÜMRÜK TANIMI, SHIPMENT, BOOKING VE CONTAINER NO (Ferah ve Kesilmeyen Genişlik) */}
              <div className="flex flex-wrap lg:flex-nowrap items-end gap-2.5">
                <div className="flex-1 min-w-[180px]">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Banka Hesabı</label>
                  <select className="w-full px-2.5 py-1.5 border border-slate-300 rounded-md outline-none text-xs bg-white font-medium" value={selectedBankId} onChange={e => setSelectedBankId(e.target.value)}>
                    <option value="">-- Otomatik ({currency}) --</option>
                    {exporter?.banks?.map(b => <option key={b.id} value={b.id}>{b.bankName} ({b.currency})</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[180px]">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Sigorta Acentesi</label>
                  <select className="w-full px-2.5 py-1.5 border border-slate-300 rounded-md outline-none text-xs bg-white font-medium" value={selectedInsuranceId} onChange={e => setSelectedInsuranceId(e.target.value)}>
                    <option value="">-- Acente Seçin --</option>
                    {exporter?.insurances?.map(i => <option key={i.id} value={i.id}>{i.agencyName}</option>)}
                  </select>
                </div>
                <div className="w-48 shrink-0">
                  <label className="block text-[10px] font-bold text-indigo-700 uppercase tracking-wider mb-0.5" title="GİB TR e-Fatura Satır Başlığı">TR Gümrük Tanımı</label>
                  <input type="text" className="w-full px-2.5 py-1.5 border border-indigo-200 rounded-md outline-none text-xs font-bold text-indigo-900 bg-indigo-50/40 focus:bg-white" value={customsDescriptionTR} onChange={e => setCustomsDescriptionTR(e.target.value)} placeholder="Yatak / Boru" />
                </div>
                <div className="w-24 shrink-0">
                  <label className="block text-[10px] font-bold text-red-700 uppercase tracking-wider mb-0.5">Shipment</label>
                  <input type="text" className="w-full px-2 py-1.5 border border-red-200 rounded-md outline-none text-xs font-bold text-red-800 text-center bg-red-50/40 focus:bg-white" value={shipmentNo} onChange={e => setShipmentNo(e.target.value)} placeholder="23" />
                </div>
                <div className="w-44 shrink-0">
                  <label className="block text-[10px] font-bold text-blue-800 uppercase tracking-wider mb-0.5">Booking No</label>
                  <input type="text" className="w-full px-2.5 py-1.5 border border-blue-200 rounded-md outline-none text-xs font-bold text-blue-900 bg-blue-50/40 focus:bg-white" value={bookingNo} onChange={e => setBookingNo(e.target.value)} placeholder="ZIMUIST..." />
                </div>
                <div className="w-44 shrink-0">
                  <label className="block text-[10px] font-bold text-sky-800 uppercase tracking-wider mb-0.5">📦 Container No</label>
                  <input type="text" className="w-full px-2.5 py-1.5 border border-sky-200 rounded-md outline-none text-xs font-bold text-sky-900 bg-sky-50/40 focus:bg-white" value={containerNo} onChange={e => setContainerNo(e.target.value)} placeholder="JXLU..." />
                </div>
              </div>
            </div>
          )}

          {/* BÖLÜM 2: ARAÇ ÇUBUĞU VE TIKLAYINCA AÇILAN OPSİYONEL ALAN BUTONLARI (Yatay Kaydırma Çubuğu Yok!) */}
          <div className="bg-slate-100 border-b border-slate-300 px-4 py-2 shrink-0 space-y-2">
            <div className="flex flex-wrap items-center justify-between gap-2">
              {/* Sol: Tablo İşlemleri + Tıklayınca Açılan Opsiyonel Alan Butonları */}
              <div className="flex flex-wrap items-center gap-1.5">
                <button type="button" onClick={handleAddRow} className="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-md text-xs font-bold flex items-center shadow-sm">
                  <Plus size={14} className="mr-1" /> Satır Ekle
                </button>
                <div className="relative inline-block">
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} disabled={isExcelLoading} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                  <button type="button" className={`px-3 py-1.5 text-white rounded-md text-xs font-bold flex items-center shadow-sm ${isExcelLoading ? 'bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                    {isExcelLoading ? <Loader2 className="mr-1 w-3.5 h-3.5" /> : <Upload size={14} className="mr-1" />}
                    {isExcelLoading ? 'Yükleniyor...' : 'Excel Yükle'}
                  </button>
                </div>
                <button type="button" onClick={handleDownloadTemplate} className="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-2.5 py-1.5 rounded-md text-xs font-semibold flex items-center">
                  <Download size={13} className="mr-1" /> Şablon
                </button>

                <span className="text-slate-300 mx-1">|</span>

                {/* 1. Tıklayınca Açılan: Sevk Adresi */}
                <button
                  type="button"
                  onClick={() => setShowDeliveryAddrInput(!showDeliveryAddrInput)}
                  className={`px-2.5 py-1.5 rounded-md text-xs font-bold border flex items-center gap-1.5 transition-colors ${
                    showDeliveryAddrInput || deliveryAddress.trim()
                      ? 'bg-blue-50 text-blue-800 border-blue-300 shadow-sm'
                      : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300'
                  }`}
                >
                  <span>📍 Sevk Adresi</span>
                  {deliveryAddress.trim() && <span className="bg-blue-600 text-white text-[9px] px-1.5 py-0.2 rounded-full">✓ Dolu</span>}
                </button>

                {/* 2. Tıklayınca Açılan: Nakliye Özel Notu */}
                <button
                  type="button"
                  onClick={() => setShowSpecialNoteInput(!showSpecialNoteInput)}
                  className={`px-2.5 py-1.5 rounded-md text-xs font-bold border flex items-center gap-1.5 transition-colors ${
                    showSpecialNoteInput || specialNote.trim()
                      ? 'bg-amber-50 text-amber-900 border-amber-300 shadow-sm'
                      : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300'
                  }`}
                >
                  <span>📌 Nakliye Notu</span>
                  {specialNote.trim() && <span className="bg-amber-600 text-white text-[9px] px-1.5 py-0.2 rounded-full">✓ Dolu</span>}
                </button>

                {/* 3. Tıklayınca Açılan: Ek Maliyetler (Freight, Pattern vb.) */}
                <button
                  type="button"
                  onClick={() => setShowExtraChargesPanel(!showExtraChargesPanel)}
                  className={`px-2.5 py-1.5 rounded-md text-xs font-bold border flex items-center gap-1.5 transition-colors ${
                    showExtraChargesPanel || extraCharges.length > 0
                      ? 'bg-indigo-50 text-indigo-900 border-indigo-300 shadow-sm'
                      : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300'
                  }`}
                >
                  <span>➕ Ek Maliyet</span>
                  {extraCharges.length > 0 && (
                    <span className="bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-extrabold">
                      {extraCharges.length}
                    </span>
                  )}
                </button>

                {/* 4. Tıklayınca Açılan: ABD Duty / Peşinat / Bedelsiz */}
                <button
                  type="button"
                  onClick={() => setShowTaxDutyPanel(!showTaxDutyPanel)}
                  className={`px-2.5 py-1.5 rounded-md text-xs font-bold border flex items-center gap-1.5 transition-colors ${
                    showTaxDutyPanel || hasDutyFee || hasDownPayment || isFreeOfCharge
                      ? 'bg-rose-50 text-rose-800 border-rose-300 shadow-sm'
                      : 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300'
                  }`}
                >
                  <span>🛡️ Duty & DP</span>
                  {hasDutyFee && <span className="bg-rose-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">%{dutyFeeRate}</span>}
                  {hasDownPayment && <span className="bg-red-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">Peşinat %{downPaymentRate}</span>}
                  {isFreeOfCharge && <span className="bg-blue-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">Bedelsiz</span>}
                </button>
              </div>

              {/* Sağ: Tablo İçi Arama ve Sayfalama */}
              <div className="flex items-center gap-2">
                
                {items.length > 0 && !tableSearch && (
                  <div className="flex items-center gap-1 text-xs bg-white px-2.5 py-1 rounded-md border border-slate-300">
                    <button type="button" disabled={currentPage === 1} onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="disabled:opacity-40 font-bold px-1.5 hover:bg-slate-100 rounded">&lt;</button>
                    <span className="font-bold text-blue-700 px-1">{currentPage}/{totalPages}</span>
                    <button type="button" disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} className="disabled:opacity-40 font-bold px-1.5 hover:bg-slate-100 rounded">&gt;</button>
                  </div>
                )}
              </div>
            </div>

            {/* TIKLAYINCA AÇILAN OPSİYONEL KUTULAR (Sadece Açık Olanlar Görünür) */}
            {(showDeliveryAddrInput || showSpecialNoteInput) && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 pt-1.5 border-t border-slate-200/80">
                {showDeliveryAddrInput && (
                  <div className="flex items-center gap-2 bg-blue-50/60 border border-blue-200 px-3 py-1.5 rounded-lg">
                    <span className="text-xs font-extrabold text-blue-900 whitespace-nowrap">📍 Sevk Adresi:</span>
                    <input
                      type="text"
                      className="flex-1 px-2.5 py-1 border border-blue-300 rounded text-xs bg-white outline-none focus:ring-1 focus:ring-blue-500"
                      value={deliveryAddress}
                      onChange={e => setDeliveryAddress(e.target.value)}
                      placeholder="Müşteri adresinden farklıysa sevk adresini buraya yazın..."
                    />
                    <button type="button" onClick={() => setShowDeliveryAddrInput(false)} className="text-slate-400 hover:text-slate-600" title="Gizle"><X size={14} /></button>
                  </div>
                )}

                {showSpecialNoteInput && (
                  <div className="flex items-center gap-2 bg-amber-50/70 border border-amber-300 px-3 py-1.5 rounded-lg">
                    <span className="text-xs font-extrabold text-amber-900 whitespace-nowrap">📌 Nakliye Notu:</span>
                    <input
                      type="text"
                      className="flex-1 px-2.5 py-1 border border-amber-300 rounded text-xs font-semibold text-amber-950 bg-white outline-none focus:ring-1 focus:ring-amber-500"
                      value={specialNote}
                      onChange={e => setSpecialNote(e.target.value)}
                      placeholder="Örn: Customs support Marketing 19 6921 RE Duiven..."
                    />
                    <button type="button" onClick={() => setShowSpecialNoteInput(false)} className="text-slate-400 hover:text-slate-600" title="Gizle"><X size={14} /></button>
                  </div>
                )}
              </div>
            )}

            {/* TIKLAYINCA AÇILAN: EK MALİYETLER PANELİ VE ABD DUTY PANELİ YAN YANA */}
            {(showExtraChargesPanel || showTaxDutyPanel) && (
              <div className="flex flex-wrap items-start gap-3 pt-1.5 border-t border-slate-200/80">
                {showExtraChargesPanel && (
                  <div className="flex-1 min-w-[340px] bg-indigo-50/70 border border-indigo-200 rounded-lg p-2 space-y-1.5">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex flex-wrap items-center gap-1.5">
                        <span className="text-xs font-extrabold text-indigo-950 mr-1">➕ Ek Maliyet</span>
                        <button type="button" onClick={() => handleAddExtraCharge('Freight')} className="bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 px-2 py-0.5 rounded text-[11px] font-bold shadow-sm">+ Freight</button>
                        <button type="button" onClick={() => handleAddExtraCharge('Pattern Cost')} className="bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 px-2 py-0.5 rounded text-[11px] font-bold shadow-sm">+ Pattern</button>
                        <button type="button" onClick={() => handleAddExtraCharge('Machining Cost')} className="bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 px-2 py-0.5 rounded text-[11px] font-bold shadow-sm">+ Machining</button>
                        <button type="button" onClick={() => handleAddExtraCharge('Quality Control Costs')} className="bg-white hover:bg-indigo-100 text-indigo-800 border border-indigo-300 px-2 py-0.5 rounded text-[11px] font-bold shadow-sm">+ Quality</button>
                        <button type="button" onClick={() => handleAddExtraCharge('')} className="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-0.5 rounded text-[11px] font-bold shadow-sm">+ Özel Satır</button>
                      </div>
                      <button type="button" onClick={() => setShowExtraChargesPanel(false)} className="text-slate-400 hover:text-slate-600"><X size={14} /></button>
                    </div>

                    {extraCharges.length > 0 && (
                      <div className="flex flex-wrap gap-2 pt-1">
                        {extraCharges.map((ec) => (
                          <div key={ec.id} className="flex items-center gap-1.5 bg-white border border-indigo-200 px-2 py-1 rounded text-xs shadow-sm">
                            <input type="text" placeholder="Order No" value={ec.sipRefNo || ''} onChange={e => handleExtraChargeChange(ec.id, 'sipRefNo', e.target.value)} className="w-24 px-1.5 py-0.5 border rounded text-[11px] outline-none" />
                            <input type="text" placeholder="Açıklama (Freight vb.)" value={ec.description || ''} onChange={e => handleExtraChargeChange(ec.id, 'description', e.target.value)} className="w-36 px-1.5 py-0.5 border rounded text-[11px] font-bold text-indigo-950 outline-none" />
                            <input type="number" placeholder="Adet" value={ec.adet ?? 1} onChange={e => handleExtraChargeChange(ec.id, 'adet', e.target.value)} className="w-12 px-1 py-0.5 border rounded text-[11px] text-center font-bold outline-none" />
                            <input type="text" placeholder="Birim Fiyat" value={ec.fiyat ?? ''} onChange={e => handleExtraChargeChange(ec.id, 'fiyat', e.target.value)} className="w-24 px-1.5 py-0.5 border rounded text-[11px] text-right font-semibold outline-none" />
                            <span className="font-extrabold text-indigo-900 text-[11px] whitespace-nowrap px-1">
                              = {(parseFloat(ec.tutar) || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                            </span>
                            <button type="button" onClick={() => handleRemoveExtraCharge(ec.id)} className="text-red-500 hover:bg-red-50 p-0.5 rounded"><Trash2 size={13} /></button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {showTaxDutyPanel && (
                  <div className="flex flex-wrap items-center gap-3 bg-rose-50/70 border border-rose-200 rounded-lg px-3 py-2 text-xs">
                    <label className="flex items-center gap-1.5 font-bold text-rose-800 cursor-pointer whitespace-nowrap">
                      <input type="checkbox" checked={hasDutyFee} onChange={e => setHasDutyFee(e.target.checked)} className="w-3.5 h-3.5 accent-rose-600" />
                      Duty Fee
                    </label>
                    {hasDutyFee && (
                      <div className="flex items-center gap-1">
                        <input type="number" step="0.01" value={dutyFeeRate} onChange={e => setDutyFeeRate(e.target.value)} className="w-14 px-1.5 py-0.5 border border-rose-300 rounded text-xs font-black text-rose-700 text-center bg-white" />
                        <span className="font-bold text-rose-700">%</span>
                        <input type="text" value={dutyFeeLabel} onChange={e => setDutyFeeLabel(e.target.value)} placeholder={`RECIP TR ${String(dutyFeeRate).replace('.', ',')} % DUTY`} className="w-40 px-2 py-0.5 border border-rose-200 rounded text-xs font-bold text-rose-900 bg-white" />
                      </div>
                    )}

                    <span className="text-rose-200">|</span>

                    <label className="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer whitespace-nowrap">
                      <input type="checkbox" checked={hasDownPayment} onChange={e => setHasDownPayment(e.target.checked)} className="w-3.5 h-3.5 accent-red-600" />
                      Down Payment
                    </label>
                    {hasDownPayment && (
                      <div className="flex items-center gap-1">
                        <input type="number" min="0" max="100" value={downPaymentRate} onChange={e => setDownPaymentRate(e.target.value)} className="w-12 px-1 py-0.5 border rounded text-xs font-bold text-red-600 text-center bg-white" />
                        <span className="font-bold text-slate-500">%</span>
                      </div>
                    )}

                    <span className="text-rose-200">|</span>

                    <label className="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer whitespace-nowrap">
                      <input type="checkbox" checked={isFreeOfCharge} onChange={e => setIsFreeOfCharge(e.target.checked)} className="w-3.5 h-3.5 accent-blue-600" />
                      Bedelsiz
                    </label>

                    <button type="button" onClick={() => setShowTaxDutyPanel(false)} className="text-slate-400 hover:text-slate-600 ml-2"><X size={14} /></button>
                  </div>
                )}
              </div>
            )}

            {/* SEÇİLİ SATIRLARI PALETTE BİRLEŞTİRME BARI */}
            {selectedIds.length > 0 && (
              <div className="bg-amber-50 border border-amber-300 px-3 py-1.5 rounded-lg flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs font-bold text-amber-900">{selectedIds.length} Satır Seçili — Tek Palette Birleştir:</span>
                <div className="flex items-center gap-2">
                  <input type="text" placeholder="Palet No (1/6)" className="px-2 py-1 border rounded text-xs w-28 bg-white" value={groupPalletNo} onChange={e => setGroupPalletNo(e.target.value)} />
                  <input type="text" placeholder="Ebat (80x120x40)" className="px-2 py-1 border rounded text-xs w-32 bg-white" value={groupPalletEbat} onChange={e => setGroupPalletEbat(e.target.value)} />
                  <input type="text" placeholder="Brüt KG" className="px-2 py-1 border rounded text-xs w-24 bg-white" value={groupBrutKg} onChange={e => setGroupBrutKg(e.target.value)} />
                  <button type="button" onClick={handleApplyPalletGroup} className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded text-xs font-bold">Uygula</button>
                  <button type="button" onClick={() => setSelectedIds([])} className="text-xs text-slate-500 hover:underline">Vazgeç</button>
                </div>
              </div>
            )}
          </div>

          {/* BÖLÜM 3: MAKSİMUM ALANLI KALEM TABLOSU */}
          <div className="flex-1 overflow-auto bg-slate-200 px-3 py-2">
            <div className="bg-white rounded-lg shadow border border-slate-300 inline-block min-w-full overflow-hidden">
              <table className="min-w-full text-left border-collapse whitespace-nowrap">
                <thead>
                  <tr className="bg-slate-800 text-white text-[11px] uppercase tracking-wider sticky top-0 z-10">
                    <th className="py-2 px-2 w-8 text-center border-r border-slate-700">
                      <input type="checkbox" checked={items.length > 0 && selectedIds.length === items.length} onChange={toggleSelectAll} />
                    </th>
                    <th className="py-2 px-2 w-9 text-center border-r border-slate-700">Sil</th>
                    {columns.map(col => <th key={col.key} className={`py-2 px-2 font-semibold border-x border-slate-700 ${col.width}`}>{col.label}</th>)}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs">
                  {items.length === 0 ? (
                    <tr><td colSpan={columns.length + 2} className="p-8 text-center text-slate-500">Henüz kalem bulunmuyor. Excel yükleyebilir veya satır ekleyebilirsiniz.</td></tr>
                  ) : (
                    filteredPaginatedRows.map((rowInfo) => {
                      const index = rowInfo.originalIndex;
                      const row = rowInfo.item;
                      const isSelected = selectedIds.includes(row.id);

                      return (
                        <tr key={row.id} className={`transition-colors ${isSelected ? 'bg-amber-200/70' : `${rowInfo.groupColor} hover:bg-blue-100/40`}`}>
                          <td className="py-0.5 px-1 border-r text-center border-slate-200">
                            <input type="checkbox" checked={isSelected} onChange={() => toggleSelectRow(row.id)} />
                          </td>
                          <td className="py-0.5 px-1 border-r text-center border-slate-200">
                            <button type="button" onClick={() => handleRemoveRow(row.id)} className="text-slate-400 hover:text-red-500 p-0.5">
                              <Trash2 size={14} />
                            </button>
                          </td>

                          {columns.map(col => {
                            const isMergedField = (col.key === 'brutKg' || col.key === 'paletNo' || col.key === 'paletEbatlari');

                            if (isMergedField) {
                              if (!tableSearch && !rowInfo.isFirstInGroup) return null;
                              return (
                                <td key={col.key} rowSpan={tableSearch ? 1 : rowInfo.rowSpan} className="py-0.5 px-1 border-r border-slate-300 align-middle bg-slate-50 text-center font-bold">
                                  <input 
                                    type="text" 
                                    value={row[col.key] ?? ''} 
                                    onChange={(e) => handleItemChange(index, col.key, e.target.value)} 
                                    className="w-full px-1.5 py-0.5 bg-transparent outline-none focus:bg-white text-xs font-bold text-center text-blue-900" 
                                    placeholder="-" 
                                  />
                                </td>
                              );
                            }

                            return (
                              <td key={col.key} className="py-0.5 px-1 border-r border-slate-200">
                                <input 
                                  type="text" 
                                  value={row[col.key] ?? ''} 
                                  onChange={(e) => handleItemChange(index, col.key, e.target.value)} 
                                  className="w-full px-1.5 py-0.5 bg-transparent outline-none focus:bg-white text-xs" 
                                  placeholder="-" 
                                />
                              </td>
                            );
                          })}
                        </tr>
                      );
                    })
                  )}
                </tbody>
                <tfoot className="bg-slate-900 text-white font-bold text-xs sticky bottom-0 z-10 shadow-lg border-t-2 border-slate-700">
                  <tr>
                    <td colSpan={8} className="py-2 px-2.5 text-right uppercase tracking-wider font-extrabold text-slate-300 bg-slate-950">
                      MALZEME TOPLAMI ({items.length} Satır):
                    </td>
                    <td className="py-2 px-2 text-right"></td>
                    <td className="py-2 px-2 text-right font-extrabold text-amber-400 text-xs">
                      {totals.totalAdet.toLocaleString('tr-TR')} ADET
                    </td>
                    <td className="py-2 px-2 text-right font-extrabold text-emerald-400 text-xs">
                      {totals.totalTutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                    </td>
                    <td className="py-2 px-2 text-right font-extrabold text-sky-300 text-xs">
                      {totals.totalNetKg.toLocaleString('tr-TR')} KG
                    </td>
                    <td className="py-2 px-2 text-right font-extrabold text-amber-300 text-xs bg-slate-800">
                      {totals.totalBrutKg.toLocaleString('tr-TR')} KG
                    </td>
                    <td className="py-2 px-2 text-center font-extrabold text-indigo-300 text-xs bg-slate-800">
                      {totals.paletCount} Palet
                    </td>
                    <td className="py-2 px-2"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // PROFORMA FATURA YÖNETİMİ, FORMU VE A4 YAZDIRMA EKRANI
    // =========================================================================
    function ProformaManager({ data, customers, onCreateNew, onEdit, onPrint, onConvertToChecklist, onDelete }) {
      const getCustomerName = (id) => customers.find(c => c.id === id)?.name || 'Bilinmiyor';

      const calcProformaTotal = (items = []) => {
        return items.reduce((sum, item) => {
          const adet = parseFloat(item.adet) || 0;
          const fiyat = parseFloat(item.fiyat) || 0;
          const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
          return sum + tutar;
        }, 0);
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
          <div className="p-5 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
            <div>
              <h3 className="text-lg font-semibold text-slate-800 flex items-center">
                <FileText className="w-5 h-5 mr-2 text-rose-600" /> Kayıtlı Proforma Faturalar (Sipariş & Avans)
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">Üretim başlamadan önce müşteriye gönderilen avans faturaları. Üretim bittiğinde tek tıkla Check List'e aktarabilirsiniz.</p>
            </div>
            <button type="button" onClick={onCreateNew} className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-lg font-bold flex items-center shadow-sm text-sm transition-colors">
              <Plus size={18} className="mr-1.5" /> Yeni Proforma Fatura Oluştur
            </button>
          </div>
          <div className="overflow-auto flex-1">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-sm sticky top-0 shadow-sm">
                  <th className="p-4 font-semibold">Proforma No / Tarih</th>
                  <th className="p-4 font-semibold">Müşteri</th>
                  <th className="p-4 font-semibold">Toplam Tutar</th>
                  <th className="p-4 font-semibold">Avans Oranı & Tutarı</th>
                  <th className="p-4 font-semibold">Kalem</th>
                  <th className="p-4 font-semibold w-72 text-center">İşlem</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 text-sm">
                {data.length > 0 ? data.map(item => {
                  const total = calcProformaTotal(item.items);
                  const advRate = Number(item.advanceRate ?? 30);
                  const advAmount = (total * advRate) / 100;
                  const curr = item.currency || 'EUR';
                  return (
                    <tr key={item.id} className="hover:bg-slate-50">
                      <td className="p-4 font-bold text-rose-700">
                        {item.proformaNumber}
                        <div className="text-xs text-slate-400 font-normal">{formatDateTR(item.proformaDate)}</div>
                      </td>
                      <td className="p-4 text-slate-800 font-medium">{getCustomerName(item.customerId)}</td>
                      <td className="p-4 text-slate-800 font-bold">
                        {total.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {curr}
                      </td>
                      <td className="p-4">
                        <span className="bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded text-xs font-extrabold">
                          %{advRate} Avans: {advAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {curr}
                        </span>
                      </td>
                      <td className="p-4 text-slate-600">
                        <span className="bg-slate-200 text-slate-700 py-1 px-3 rounded-full text-xs font-semibold">{item.items?.length || 0} Kalem</span>
                      </td>
                      <td className="p-4 text-center">
                        <div className="flex justify-center items-center gap-2">
                          <button
                            type="button"
                            onClick={() => onPrint(item)}
                            className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded text-xs font-bold flex items-center shadow-sm"
                            title="Proforma Fatura Yazdır"
                          >
                            <Printer size={14} className="mr-1" /> Proforma Yazdır
                          </button>
                          <button
                            type="button"
                            onClick={() => onConvertToChecklist(item)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs font-bold flex items-center shadow-sm"
                            title="Üretim Bittiğinde Kalemleri ve Avansı Check List'e Aktar"
                          >
                            <ChevronRight size={14} className="mr-0.5" /> Çekliste Aktar
                          </button>
                          <button type="button" onClick={() => onEdit(item)} className="text-blue-600 p-1" title="Düzenle"><Edit size={18} /></button>
                          <button type="button" onClick={() => onDelete(item.id)} className="text-red-500 p-1" title="Sil"><Trash2 size={16} /></button>
                        </div>
                      </td>
                    </tr>
                  );
                }) : (
                  <tr>
                    <td colSpan={6} className="p-12 text-center text-slate-500 text-lg">
                      Henüz kayıtlı Proforma Fatura bulunmuyor. Sağ üstten yeni oluşturabilirsiniz.
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ProformaForm({ exporter, customers, initialData, onBack, onSaveProforma }) {
      const [proformaNumber, setProformaNumber] = useState(initialData?.proformaNumber || '');
      const [proformaDate, setProformaDate] = useState(initialData?.proformaDate || new Date().toISOString().split('T')[0]);
      const [deliveryDate, setDeliveryDate] = useState(initialData?.deliveryDate || '');
      const [customerId, setCustomerId] = useState(initialData?.customerId || '');
      const [currency, setCurrency] = useState(initialData?.currency || 'EUR');
      const [deliveryTerm, setDeliveryTerm] = useState(initialData?.deliveryTerm || 'DAP');
      const [deliveryAddress, setDeliveryAddress] = useState(initialData?.deliveryAddress || '');
      const [selectedBankId, setSelectedBankId] = useState(initialData?.selectedBankId || '');
      const [advanceRate, setAdvanceRate] = useState(initialData?.advanceRate ?? 30);
      const [paymentTerms, setPaymentTerms] = useState(initialData?.paymentTerms || '');
      const [items, setItems] = useState(initialData?.items || []);
      const [isExcelLoading, setIsExcelLoading] = useState(false);

      const columns = [
        { key: 'siraNo', label: 'Sıra No', width: 'w-16' },
        { key: 'sipRefNo', label: 'Order No (Sip. Ref)', width: 'w-36' },
        { key: 'posNo', label: 'Pos No', width: 'w-20' },
        { key: 'parcaAdi', label: 'Part Name (Parça Adı)', width: 'w-56' },
        { key: 'resimNo', label: 'Drawing No (Resim No)', width: 'w-40' },
        { key: 'adet', label: 'Quantity (Adet)', width: 'w-24' },
        { key: 'fiyat', label: 'Unit Price (Birim Fiyat)', width: 'w-32' },
        { key: 'tutar', label: 'Total (Toplam Tutar)', width: 'w-32' },
        { key: 'netKg', label: 'Tahmini Net KG (Opsiyonel)', width: 'w-28' }
      ];

      const totals = useMemo(() => {
        let totalAdet = 0;
        let totalNetKg = 0;
        let totalTutar = 0;
        items.forEach(item => {
          const adet = parseFloat(item.adet) || 0;
          const fiyat = parseFloat(item.fiyat) || 0;
          const tutar = parseFloat(item.tutar) || (adet * fiyat) || 0;
          const netKg = parseFloat(item.netKg) || 0;
          totalAdet += adet;
          totalNetKg += netKg;
          totalTutar += tutar;
        });
        const advAmount = (totalTutar * (Number(advanceRate) || 0)) / 100;
        const balanceAmount = Math.max(0, totalTutar - advAmount);
        return { totalAdet, totalNetKg, totalTutar, advAmount, balanceAmount };
      }, [items, advanceRate]);

      const handleAddRow = () => {
        setItems([...items, {
          id: generateId(),
          siraNo: String(items.length + 1),
          sipRefNo: '',
          posNo: '',
          parcaAdi: '',
          resimNo: '',
          adet: '',
          fiyat: '',
          tutar: '',
          netKg: ''
        }]);
      };

      const handleRemoveRow = (id) => {
        setItems(items.filter(i => i.id !== id));
      };

      const handleItemChange = (index, key, value) => {
        setItems(prev => {
          const next = [...prev];
          const updated = { ...next[index], [key]: value };
          if (key === 'adet' || key === 'fiyat') {
            const adet = parseFloat(String(updated.adet).replace(',', '.')) || 0;
            const fiyat = parseFloat(String(updated.fiyat).replace(',', '.')) || 0;
            if (adet && fiyat) updated.tutar = (adet * fiyat).toFixed(2);
          }
          next[index] = updated;
          return next;
        });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file || !window.XLSX) return;
        const inputEl = e.target;
        setIsExcelLoading(true);

        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const dataBuffer = new Uint8Array(evt.target.result);
              const wb = window.XLSX.read(dataBuffer, { type: 'array', cellFormula: false, cellHTML: false, cellText: true });
              const ws = wb.Sheets[wb.SheetNames[0]];
              const rawData = window.XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });

              const parseNum = (val) => {
                if (val === null || val === undefined || val === '') return '';
                if (typeof val === 'number') return isNaN(val) ? '' : val;
                let str = String(val).replace(/\s/g, '').trim();
                if (str.includes(',') && str.includes('.')) str = str.replace(/\./g, '').replace(',', '.');
                else if (str.includes(',')) str = str.replace(',', '.');
                const num = parseFloat(str);
                return isNaN(num) ? String(val).trim() : num;
              };

              const newItems = [];
              for (let i = 1; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || !Array.isArray(row) || row.length === 0) continue;
                const c0 = String(row[0] || '').toUpperCase();
                if (c0.includes('TOPLAM') || c0.includes('TOTAL') || c0.includes('YALNIZ')) break;
                const parcaAdi = String(row[2] || '').trim();
                if (!parcaAdi || parcaAdi.toLowerCase() === 'part name') continue;

                const adet = parseNum(row[7]);
                const fiyat = parseNum(row[6]);
                let tutar = parseNum(row[8]);
                if (!tutar && typeof adet === 'number' && typeof fiyat === 'number') {
                  tutar = (adet * fiyat).toFixed(2);
                }

                newItems.push({
                  id: generateId(),
                  siraNo: String(row[0] || newItems.length + 1),
                  adsIsNo: String(row[1] || '').trim(),
                  parcaAdi,
                  sipRefNo: String(row[3] || '').trim(),
                  posNo: String(row[4] || '').trim(),
                  resimNo: String(row[5] || '').trim(),
                  fiyat,
                  adet,
                  tutar,
                  netKg: parseNum(row[9])
                });
              }
              if (newItems.length > 0) setItems(newItems);
              else alert("Excel dosyasından kalem okunamadı.");
            } catch (err) {
              alert("Excel okuma hatası: " + err.message);
            } finally {
              setIsExcelLoading(false);
              if (inputEl) inputEl.value = '';
            }
          };
          reader.readAsArrayBuffer(file);
        }, 50);
      };

      const handleSave = () => {
        if (!proformaNumber.trim() || !customerId) {
          alert("Lütfen Proforma No ve Müşteri seçimini yapın.");
          return;
        }
        onSaveProforma({
          exporterId: exporter.id,
          proformaNumber: proformaNumber.trim(),
          proformaDate,
          deliveryDate,
          customerId,
          currency,
          deliveryTerm,
          deliveryAddress,
          selectedBankId,
          advanceRate: Number(advanceRate) || 0,
          paymentTerms,
          items,
          createdAt: initialData?.createdAt || new Date().toISOString()
        });
      };

      return (
        <div className="flex flex-col h-full bg-white z-20 overflow-hidden">
          <div className="bg-rose-900 text-white p-4 flex justify-between items-center shadow-md shrink-0">
            <div className="flex items-center">
              <button type="button" onClick={onBack} className="mr-4 p-2 hover:bg-rose-800 rounded-full text-rose-200 hover:text-white">
                <ArrowLeft size={24} />
              </button>
              <h2 className="text-xl font-bold flex items-center">
                <FileText className="mr-2 text-rose-300" /> {initialData ? 'Proforma Fatura Düzenle' : 'Yeni Proforma Fatura Oluştur (Sipariş & Avans)'}
              </h2>
            </div>
            <div className="text-rose-200 text-sm">İhracatçı: <span className="text-white font-bold">{exporter.name}</span></div>
          </div>

          <div className="p-4 border-b border-gray-200 bg-slate-50 shrink-0">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">PROFORMA NO *</label>
                <input type="text" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm font-bold text-rose-700" value={proformaNumber} onChange={e => setProformaNumber(e.target.value)} placeholder="PI-2026-001" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">PROFORMA TARİHİ</label>
                <input type="date" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={proformaDate} onChange={e => setProformaDate(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">TAHMİNİ TESLİM TARİHİ</label>
                <input type="date" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">MÜŞTERİ *</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={customerId} onChange={e => setCustomerId(e.target.value)}>
                  <option value="">-- Müşteri Seçin --</option>
                  {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">DÖVİZ</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white font-bold" value={currency} onChange={e => setCurrency(e.target.value)}>
                  <option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="TRY">TRY (₺)</option><option value="GBP">GBP (£)</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">TESLİM ŞEKLİ (DELIVERY TERM)</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white font-bold" value={deliveryTerm} onChange={e => setDeliveryTerm(e.target.value)}>
                  <option value="DAP">DAP</option><option value="CIF">CIF</option><option value="FOB">FOB</option><option value="EXW">EXW</option><option value="DDP">DDP</option><option value="FCA">FCA</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">BANKA HESABI</label>
                <select className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm bg-white" value={selectedBankId} onChange={e => setSelectedBankId(e.target.value)}>
                  <option value="">-- Otomatik Seç --</option>
                  {exporter?.banks?.map(b => <option key={b.id} value={b.id}>{b.bankName} ({b.currency})</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-rose-700 mb-1">AVANS / PEŞİNAT ORANI (%)</label>
                <div className="flex items-center gap-2">
                  <input type="number" min="0" max="100" step="1" className="w-24 px-3 py-1.5 border-2 border-rose-300 rounded-lg outline-none text-sm font-black text-rose-700 text-center" value={advanceRate} onChange={e => setAdvanceRate(e.target.value)} />
                  <span className="text-xs font-bold text-slate-600">
                    Avans: {totals.advAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                  </span>
                </div>
              </div>
              <div className="md:col-span-2">
                <label className="block text-xs font-semibold text-slate-700 mb-1">FARKLI SEVK ADRESİ (OPSİYONEL)</label>
                <input type="text" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm" value={deliveryAddress} onChange={e => setDeliveryAddress(e.target.value)} placeholder="Müşteri adresinden farklıysa yazın..." />
              </div>
              <div className="md:col-span-2">
                <label className="block text-xs font-semibold text-slate-700 mb-1">ÖDEME NOTU / ŞARTI (OPSİYONEL)</label>
                <input type="text" className="w-full px-3 py-1.5 border rounded-lg outline-none text-sm" value={paymentTerms} onChange={e => setPaymentTerms(e.target.value)} placeholder={`Örn: ${advanceRate}% Advance payment prior to production, ${100 - (Number(advanceRate) || 0)}% before shipment`} />
              </div>
            </div>

            <div className="flex justify-between items-center gap-2">
              <div className="flex items-center gap-2">
                <button type="button" onClick={handleAddRow} className="bg-white border text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow-sm hover:bg-slate-50">
                  <Plus size={16} className="mr-1" /> Sipariş Kalemi Ekle
                </button>
                <div className="relative inline-block">
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} disabled={isExcelLoading} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                  <button type="button" className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium flex items-center shadow-sm">
                    <Upload size={16} className="mr-1" /> Excel'den Sipariş Yükle
                  </button>
                </div>
              </div>

              <button type="button" onClick={handleSave} className="px-6 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold flex items-center shadow-md">
                <Save size={16} className="mr-1.5" /> Proformayı Kaydet
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-auto bg-slate-200 p-3">
            <div className="bg-white rounded-xl shadow-lg inline-block min-w-full overflow-hidden">
              <table className="min-w-full text-left border-collapse whitespace-nowrap">
                <thead>
                  <tr className="bg-slate-800 text-white text-xs uppercase tracking-wider sticky top-0 z-10">
                    <th className="p-2.5 w-10 text-center border-r border-slate-700">Sil</th>
                    {columns.map(col => <th key={col.key} className={`p-2.5 font-semibold border-x border-slate-700 ${col.width}`}>{col.label}</th>)}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-sm">
                  {items.length === 0 ? (
                    <tr><td colSpan={columns.length + 1} className="p-8 text-center text-slate-500">Sipariş kalemi ekleyin veya Excel'den yükleyin.</td></tr>
                  ) : (
                    items.map((row, index) => (
                      <tr key={row.id} className="hover:bg-rose-50/40">
                        <td className="p-1 border-r text-center border-slate-200">
                          <button type="button" onClick={() => handleRemoveRow(row.id)} className="text-slate-400 hover:text-red-500 p-1">
                            <Trash2 size={15} />
                          </button>
                        </td>
                        {columns.map(col => (
                          <td key={col.key} className="p-1 border-r border-slate-200">
                            <input
                              type="text"
                              value={row[col.key] ?? ''}
                              onChange={(e) => handleItemChange(index, col.key, e.target.value)}
                              className="w-full px-2 py-1 bg-transparent outline-none focus:bg-white text-xs"
                              placeholder="-"
                            />
                          </td>
                        ))}
                      </tr>
                    ))
                  )}
                </tbody>
                <tfoot className="bg-slate-900 text-white font-bold text-xs sticky bottom-0 z-10">
                  <tr>
                    <td colSpan={6} className="p-2.5 text-right uppercase tracking-wider font-extrabold text-slate-300">
                      TOPLAM SİPARİŞ & AVANS ÖZETİ:
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-amber-400">
                      {totals.totalAdet.toLocaleString('tr-TR')} PCS
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-rose-400">
                      Avans (%{advanceRate}): {totals.advAmount.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                    </td>
                    <td className="p-2.5 text-right font-extrabold text-emerald-400">
                      Toplam: {totals.totalTutar.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} {currency}
                    </td>
                    <td className="p-2.5 text-right font-bold text-sky-300">
                      {totals.totalNetKg ? `${totals.totalNetKg.toLocaleString('tr-TR')} KG` : '-'}
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Seçilen Nakliyecinin İlk 3 Harfi ve Taşımacılık Türüne Göre Sembol Döndüren Yardımcı Bileşen
    function CarrierBadge({ transporter, className = "text-[#0047b3] text-[10px] font-black italic inline-flex items-center gap-1" }) {
      const code = useMemo(() => {
        if (!transporter?.name) return 'TCT';
        const clean = String(transporter.name).trim();
        return clean.substring(0, 3).toLocaleUpperCase('tr-TR');
      }, [transporter?.name]);

      const iconName = useMemo(() => {
        const t = String(transporter?.transportType || '').toLowerCase();
        if (t.includes('deniz')) return 'ship';
        if (t.includes('hava')) return 'plane';
        if (t.includes('demir')) return 'train-front';
        return 'truck';
      }, [transporter?.transportType]);

      return (
        <span className={className} title={`${transporter?.name || ''} (${transporter?.transportType || 'Karayolu'})`}>
          <span>{code}</span>
          <Icon name={iconName} size={12} className="inline text-[#0047b3]" />
        </span>
      );
    }

    // Duty Fee 2. Hücresine (dutyFeeLabel) Doğrudan Sayı/Tutar Girilmişse Algılayan Yardımcı Fonksiyon
    const parseDirectDutyValue = (val) => {
      if (val === null || val === undefined) return null;
      const str = String(val).trim();
      if (!str) return null;
      // Eğer içinde harf veya % işareti varsa (Örn: "RECIP TR 15 % DUTY") bu bir metin etiketidir, direkt tutar değildir
      if (/[a-zA-ZğüşıöçĞÜŞİÖÇ%]/.test(str)) return null;
      let clean = str.replace(/\s/g, '');
      if (clean.includes(',') && clean.includes('.')) {
        clean = clean.replace(/\./g, '').replace(',', '.');
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      const num = parseFloat(clean);
      return (!isNaN(num) && num >= 0) ? num : null;
    };

    // Kurumsal PROFORMA INVOICE A4 Görünümü
    function ProformaInvoicePage({ data, exporter, customer, transporter, deliveryTerm, showStamp, advanceRate, hasDownPayment }) {
      const rawItems = data?.items || [];
      const items = useMemo(() => groupItemsForInvoice(rawItems), [rawItems]);
      const extraCharges = useMemo(() => (data?.extraCharges || []).filter(ec => ec && ec.description && String(ec.description).trim() !== ''), [data?.extraCharges]);
      const currency = data?.currency || 'EUR';
      const cleanDrawingNo = (str) => String(str || '').replace(/[-–—\s]+$/, '').trim();

      const totals = useMemo(() => {
        let totalAdet = 0;
        let totalNetKg = 0;
        let totalTutar = 0;
        items.forEach(i => {
          const adet = parseFloat(i.adet) || 0;
          const fiyat = parseFloat(i.fiyat) || 0;
          const tutar = parseFloat(i.tutar) || (adet * fiyat) || 0;
          const netKg = parseFloat(i.netKg) || 0;
          totalAdet += adet;
          totalNetKg += netKg;
          totalTutar += tutar;
        });
        return { totalAdet, totalNetKg, totalTutar };
      }, [items]);

      const extraChargesTotal = useMemo(() => {
        return extraCharges.reduce((sum, ec) => {
          const a = parseFloat(String(ec.adet ?? 1).replace(',', '.')) || 0;
          const f = parseFloat(String(ec.fiyat ?? 0).replace(',', '.')) || 0;
          const t = parseFloat(String(ec.tutar ?? 0).replace(',', '.')) || (a * f) || 0;
          return sum + t;
        }, 0);
      }, [extraCharges]);

      const netOrderAmount = totals.totalTutar + extraChargesTotal;
      const hasDuty = Boolean(data?.hasDutyFee);
      const dutyRate = Number(data?.dutyFeeRate ?? 0);
      const directDuty = parseDirectDutyValue(data?.dutyFeeLabel);

      // 2. hücreye direkt tutar yazılmışsa onu kullan, yazılmamışsa % orandan hesapla
      const dutyAmount = hasDuty
        ? (directDuty !== null ? directDuty : (totals.totalTutar * dutyRate) / 100)
        : 0;
      const finalOrderAmount = netOrderAmount + dutyAmount;

      const effectiveDutyLabel = useMemo(() => {
        if (directDuty !== null) {
          return dutyRate > 0
            ? `RECIP TR ${dutyRate.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} % DUTY`
            : 'CUSTOMS DUTY';
        }
        return data?.dutyFeeLabel && String(data.dutyFeeLabel).trim() !== ''
